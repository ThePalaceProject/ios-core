forgeos:
  project_id: proj_87884c17
  initiative_id: null   # integrator opens a new umbrella initiative when bumping Palace submodule pin
  changeset_id: null
  notes: |
    Unusual: implementation in submodule. ForgeOS changeset tracks the
    Palace-side coordination work (ADR + submodule bumps + Palace call-site
    updates), not the toolkit-side PRs directly. Toolkit PRs governed by
    toolkit repo's own conventions (ThePalaceProject/ios-audiobooktoolkit).
    No ForgeOS hooks fire on toolkit-side commits.

triage_notes:
  partition_revised: |
    ADR-stated partition was "T1 establishes async shape + migrates one player;
    T2 migrates the remaining implementations." Architect re-partitioned to:
    T1 = protocol + OpenAccess + LCPStreamingPlayer (LCP inherits from
    OpenAccess; signatures must change atomically — non-disjoint with T1's
    protocol commit). T2 = FindawayPlayer (standalone) + external callers
    AudiobookManager + AudiobookPlaybackModel. Findaway is unblocked because
    it does not inherit from OpenAccess.
  audiobookmanager_status: |
    Not read-only. AudiobookManager.swift calls Player completion-handler
    methods at lines 219/223/847/861. Reassigned to T2 (call-site-only edits;
    rest of the 33KB file is read-only).
  t3_palace_callers: |
    Zero Palace-side callers of the toolkit's AudiobookSessionManager exist
    (verified by grep on epic/audiobook-toolkit-overhaul HEAD). Palace's
    Palace.AudiobookSessionManager is a distinct class (Phase 3 / PR #982)
    that has nothing to do with the toolkit's. The rename is purely internal
    to the toolkit module.
  shared_singleton_recommendation: |
    KEEP .shared on the toolkit's AudiobookSessionManager (renamed to
    AudiobookDownloadCoordinator). iOS delivers URLSession background
    completion to a process-wide handler in AppDelegate/SceneDelegate;
    instance-based ownership would require AppDelegate rework across every
    consumer app. Out of scope for this swarm. ADR's "pure rename, .shared
    stays" guidance confirmed.

risks:
  - description: LCPStreamingPlayer has 14 override declarations
    impact: T1 implementer must verify all overrides still match base
      signatures after the async migration. Compiler enforces this — a build
      failure on T1 means a missed override.
    mitigation: T1 contract requires build + test green before push.

  - description: Findaway SDK emits duplicate completion notifications on rapid skips
    impact: withCheckedContinuation will crash on second resume.
    mitigation: T2 contract REQUIRES an atomic single-resume guard, locked
      by testPlayAt_resumesContinuationOnce.

  - description: Toolkit has no pbxproj helper script
    impact: T1/T3 implementers may hand-edit project.pbxproj. T1 likely
      doesn't need pbxproj edits (no new files); T3 has 4 line edits.
    mitigation: Both contracts document the exact lines/fields to update.

  - description: Toolkit base ref drift between T1 push and T2 worktree creation
    impact: If toolkit main advances between T1's push and T2's worktree, T2
      must rebase on the new main.
    mitigation: Orchestrator notifies T2 immediately after T1 push;
      Toolkit's release cadence is low (last 5 commits over multiple weeks).

  - description: ForgeOS scope ambiguity for submodule work
    impact: Toolkit PRs are not under ForgeOS governance; the eventual
      Palace submodule-bump PR will need its own initiative.
    mitigation: manifest.yaml documents initiative_id=null; integrator opens
      a new initiative at submodule-bump time.

dispatch_recommendation:
  parallel_set_1:
    - T1
    - T3
  dependent:
    - T2 (waits for T1 push)
  rationale: |
    Two-wave dispatch. Wave 1 = T1 + T3 in parallel (disjoint files).
    Wave 2 = T2 (after T1 protocol shape is committed and pushed). T3 lands
    independently of either wave; can merge first to toolkit main.

