name: Update Jira on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main, develop]

jobs:
  update-jira:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get build number
        id: build
        run: |
          # Extract build number from project.pbxproj
          BUILD_NUM=$(grep -m1 'CURRENT_PROJECT_VERSION' Palace.xcodeproj/project.pbxproj | grep -oE '[0-9]+' | head -1)
          echo "number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "📦 Build number: $BUILD_NUM"
          
      - name: Extract Jira tickets
        id: tickets
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Extract the IMPLEMENTED ticket(s) from the PR TITLE and BRANCH only.
          #
          # IMPORTANT: We deliberately do NOT scan the PR body. The body routinely
          # *mentions* other tickets ("Held for next week (NOT in this PR): PP-xxxx",
          # "Shares a layer with PP-yyyy", "Stacked on PP-zzzz"). Grepping the body
          # closed/commented every mentioned key on merge — auto-closing tickets that
          # have no implementing code (see the PP-4527/4529/4531/4533 incident,
          # 2026-06-22). Title + branch are the authoritative "this PR implements X".
          #
          # NOTE: env vars (not direct interpolation) prevent shell injection.
          ALL_TEXT="$PR_TITLE $PR_BRANCH"

          # Extract unique PP-XXXX tickets (silently skip if none found)
          TICKETS=$(echo "$ALL_TEXT" | grep -oE 'PP-[0-9]+' | sort -u | tr '\n' ' ' || true)
          
          if [ -z "$TICKETS" ]; then
            # No tickets found - this is fine, not all PRs have Jira tickets
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found tickets: $TICKETS"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "list=$TICKETS" >> $GITHUB_OUTPUT
          fi
          
      - name: Update Jira tickets
        if: steps.tickets.outputs.found == 'true'
        continue-on-error: true
        env:
          # Personal credentials are always used for JIRA ticket updates (comments,
          # transitions). Org credentials are available via JIRA_EMAIL / JIRA_API_TOKEN
          # for other steps that need them.
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_PERSONAL_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_PERSONAL_API_TOKEN }}
          BUILD_NUM: ${{ steps.build.outputs.number }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
          TICKETS: ${{ steps.tickets.outputs.list }}
        run: |
          # Create temp config for script
          cat > .jira-config << EOF
          JIRA_URL="$JIRA_URL"
          JIRA_EMAIL="$JIRA_EMAIL"
          JIRA_API_TOKEN="$JIRA_API_TOKEN"
          JIRA_PROJECT_KEY="PP"
          EOF
          
          # Update each ticket
          for TICKET in $TICKETS; do
            echo "📝 Updating $TICKET..."
            
            # Add build info comment
            ./scripts/jira-integration.sh add-build-info "$TICKET" "$BUILD_NUM" "$PR_NUM" "$PR_TITLE" "$BRANCH" || {
              echo "⚠️ Failed to add comment to $TICKET"
            }
            
            # Transition to QA/Review — NOT Done.
            # Merge means "ready for QA", not "verified/done". Closing a ticket is a
            # human/QA decision after the change is validated (e.g. the device
            # VoiceOver pass for a11y stories). Auto-closing on merge is what caused
            # the 2026-06-22 incident where merged-but-unvalidated tickets were
            # marked Done. The "add-build-info" comment above already says "Ready for QA".
            echo "🔎 Moving $TICKET to QA/Review..."
            ./scripts/jira-integration.sh transition "$TICKET" "QA/Review" || {
              echo "⚠️ Failed to transition $TICKET to QA/Review (may already be there or a different workflow)"
            }
          done
          
          # Cleanup
          rm -f .jira-config
          
      - name: Summary
        if: steps.tickets.outputs.found == 'true'
        run: |
          echo "## 🎫 Jira Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tickets Updated:** ${{ steps.tickets.outputs.list }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** ${{ steps.build.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
