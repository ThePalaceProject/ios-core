# chaos-replay-on-pr.yml
#
# Runs all checked-in chaos-discovered replays against a PR's candidate
# build. Deterministic; cheap. This is what actually GUARDS PRs from
# regressions that prior chaos sessions found.
#
# Live chaos exploration runs separately (chaos-qa-on-demand.yml,
# chaos-qa-nightly.yml). Replays here are the curated, kept-in-tree
# subset that have proven valuable enough to lock into CI forever.
#
# Replays live under .simdrive/replays/chaos/<flow>-<descriptor>.yaml.
# Each YAML was written by `simdrive.record_stop` during a chaos session
# and curated by a human as worth-keeping.

name: chaos-replay-on-pr

on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.simdrive/replays/chaos/**'
      - 'Palace/**'
      - 'PalaceTests/**'
      - 'Palace.xcodeproj/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  # Skipped (not failed) when no [macos, palace-ios] runner is available
  # OR no replays exist yet. Set ENABLE_CHAOS_QA_RUNNER repo variable to
  # "true" once the runner is provisioned and at least one curated replay
  # is in the corpus.
  replay:
    runs-on: [self-hosted, macos, palace-ios]
    timeout-minutes: 30
    # NOTE: `hashFiles()` is NOT permitted in a job-level `if:` — it is only
    # available inside steps. The previous job-level `hashFiles(...)` guard made
    # the ENTIRE workflow a startup failure on every push/PR ("workflow file
    # issue", zero jobs) on every branch. The corpus-presence check now lives in
    # the "Check chaos corpus" step below; this job-level guard only gates on the
    # self-hosted runner being provisioned. When the var is unset the job SKIPS
    # cleanly (run = success) instead of erroring at startup.
    if: vars.ENABLE_CHAOS_QA_RUNNER == 'true'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Check chaos corpus exists
        id: corpus
        run: |
          # `-e`-safe: the no-match non-zero is consumed by the `if` condition.
          if compgen -G ".simdrive/replays/chaos/*.yaml" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No curated chaos replays in .simdrive/replays/chaos/ — nothing to verify; skipping."
          fi

      - name: Pick / boot sim
        id: sim
        if: steps.corpus.outputs.present == 'true'
        run: |
          UDID=$(xcrun simctl list devices iPhone | awk '/Booted/ {print $NF; exit}' | tr -d '()')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl create chaos-replay "iPhone 16 Pro" "iOS 18.4")
            xcrun simctl boot "$UDID"
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build candidate
        if: steps.corpus.outputs.present == 'true'
        run: |
          xcodebuild -project Palace.xcodeproj -scheme Palace \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/dd-replay build > /tmp/build.log 2>&1
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            /tmp/dd-replay/Build/Products/Debug-iphonesimulator/Palace.app

      - name: Replay each chaos-discovered scenario
        id: replays
        if: steps.corpus.outputs.present == 'true'
        run: |
          # scripts/chaos-replay.sh stages each .simdrive/replays/chaos/<name>/
          # recording into simdrive's recordings_root and replays it via the
          # Python API (recorder.replay), classifying the result with the same
          # anti-false-pass gate the fleet worker uses. It exits non-zero if any
          # replay diverges or a corpus entry is malformed.
          #
          # (This replaces the old inline `simdrive replay ...` CLI call, which
          # invoked a subcommand that does not exist — replay is Python/MCP-only.)
          set -o pipefail
          REPORT=/tmp/replay-report.txt
          scripts/chaos-replay.sh \
            --udid "${{ steps.sim.outputs.udid }}" \
            --threshold 0.85 2>&1 | tee "$REPORT"
          RC=${PIPESTATUS[0]}
          # Summary line: "chaos-replay: N passed, M failed (of K)"
          PASS=$(grep -oE 'chaos-replay: [0-9]+ passed' "$REPORT" | grep -oE '[0-9]+' | head -1 || echo 0)
          FAIL=$(grep -oE '[0-9]+ failed' "$REPORT" | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "pass=${PASS:-0}" >> "$GITHUB_OUTPUT"
          echo "fail=${FAIL:-0}" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Comment summary on PR
        if: failure() && steps.corpus.outputs.present == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '⚠️ **chaos-replay** found ${{ steps.replays.outputs.fail }} divergent replay(s) ' +
                    '(${{ steps.replays.outputs.pass }} passed). ' +
                    'A previously-fixed chaos-discovered bug appears to have regressed. ' +
                    'See workflow logs for details and the specific replay YAML(s) that diverged.',
            });
