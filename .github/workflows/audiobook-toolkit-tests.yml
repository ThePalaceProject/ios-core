name: Audiobook Toolkit Tests
# Runs PalaceAudiobookToolkit's XCTest suite against the commit this repo pins
# as the ios-audiobooktoolkit submodule. The Palace scheme does not include
# PalaceAudiobookToolkitTests, so before this workflow those tests ran only by
# hand.
#
# The toolkit builds from a checkout of itself (PalaceUIKit was vendored into
# it, PP-4953). Its one outside input is AudioEngine.xcframework, which its
# project reads from ../Carthage/Build; from this repo's root that is
# Carthage/Build, which scripts/fetch-audioengine.sh fills. So no DRM setup,
# no private submodules and no secrets: the job checks out one public
# submodule and builds one small project.
#
# Triggered only when the pin (or this job's own inputs) changes. Nothing in
# Palace/ is compiled into the toolkit, so app changes cannot change its result.
#
# AudioEngine is Findaway's licensed SDK, so it is fetched only in same-repo
# runs, matching Android (which fetches Findaway only in builds of main). A
# pull request from a fork skips the tests and says so in its own job, rather
# than failing or reading as a run that tested something.
on:
  pull_request:
    # Pull requests into a feature/** branch skip this macOS workflow; the
    # feature branch's own PR into develop runs it. Every other base still
    # runs it. See docs/architecture/feature-branch-workflow.md.
    branches-ignore: ['feature/**']
    paths:
      - 'ios-audiobooktoolkit'
      - '.github/workflows/audiobook-toolkit-tests.yml'
      - 'scripts/fetch-audioengine.sh'
      - 'scripts/xcresult_summary.py'
      - 'scripts/reference_toolchain.py'
      - 'scripts/reference-toolchain.ini'
  workflow_dispatch:
concurrency:
  group: audiobook-toolkit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  toolkit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Checkout (no submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Only the toolkit. The other submodules are private DRM repos this job
      # does not need, so it runs without a token and on fork PRs too.
      - name: Check out the pinned audiobook toolkit
        run: |
          git submodule update --init ios-audiobooktoolkit
          echo "toolkit at $(git -C ios-audiobooktoolkit rev-parse HEAD)"

      - name: Cache AudioEngine
        id: audioengine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Carthage/Build
          key: audioengine-${{ hashFiles('scripts/fetch-audioengine.sh') }}

      - name: Fetch AudioEngine
        if: steps.audioengine.outputs.cache-hit != 'true'
        run: ./scripts/fetch-audioengine.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: toolkit-spm-${{ hashFiles('ios-audiobooktoolkit/PalaceAudiobookToolkit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            toolkit-spm-

      - name: Select simulator
        id: sim
        run: |
          SIMULATOR_ID=$(python3 scripts/reference_toolchain.py select-sim --profile reference)
          python3 scripts/reference_toolchain.py report --profile reference \
            --udid "$SIMULATOR_ID" --configuration Debug --strict
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run toolkit tests
        timeout-minutes: 30
        shell: bash
        # `shell: bash` runs with -eo pipefail; +e so the status is read from
        # PIPESTATUS (xcodebuild's, not tee's) and the rollup still prints.
        run: |
          set +e
          xcodebuild test \
            -project ios-audiobooktoolkit/PalaceAudiobookToolkit.xcodeproj \
            -scheme PalaceAudiobookToolkit \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -resultBundlePath "$RUNNER_TEMP/ToolkitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/toolkit-test.log"
          status=${PIPESTATUS[0]}
          echo "---- rollup ----"
          grep -E -A1 "^Test Suite 'All tests'" "$RUNNER_TEMP/toolkit-test.log"
          grep -E "\*\* TEST" "$RUNNER_TEMP/toolkit-test.log"
          echo "xcodebuild exit status: $status"
          exit "$status"

      # xcodebuild exits 0 when the scheme selects no tests, so the step above
      # cannot tell an empty run from a green one. The result bundle can.
      - name: Require executed tests and no failures
        if: ${{ !cancelled() }}
        run: python3 scripts/xcresult_summary.py --path "$RUNNER_TEMP/ToolkitTests.xcresult" --mode gate

      - name: Upload test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-test-log
          path: ${{ runner.temp }}/toolkit-test.log
          retention-days: 7

  toolkit-tests-skipped-on-fork:
    name: toolkit tests skipped (fork PR, licensed AudioEngine)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::toolkit tests skipped on fork PRs (licensed AudioEngine)"
