name: Validate JIRA Credential Usage

# Ensures JIRA workflows use the correct credentials:
# - jira-pr-opened.yml and jira-update-on-merge.yml MUST use JIRA_PERSONAL_*
#   (personal credentials for writing comments/transitions)
# - jira-release-sync.yml uses org credentials via the shared circulation action
#
# This check prevents accidental regressions from merges or reverts.

on:
  pull_request:
    paths:
      - '.github/workflows/jira-*.yml'

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JIRA credential usage
        run: |
          FAILED=false

          # jira-pr-opened.yml must use personal credentials
          if grep -q 'JIRA_USER_EMAIL\|secrets\.JIRA_EMAIL\b\|secrets\.JIRA_API_TOKEN\b' .github/workflows/jira-pr-opened.yml 2>/dev/null; then
            if ! grep -q 'JIRA_PERSONAL' .github/workflows/jira-pr-opened.yml; then
              echo "::error file=.github/workflows/jira-pr-opened.yml::Must use JIRA_PERSONAL_EMAIL / JIRA_PERSONAL_API_TOKEN for JIRA writes (comments, transitions)"
              FAILED=true
            fi
          fi

          # jira-update-on-merge.yml must use personal credentials
          if grep -q 'JIRA_USER_EMAIL\|secrets\.JIRA_EMAIL\b\|secrets\.JIRA_API_TOKEN\b' .github/workflows/jira-update-on-merge.yml 2>/dev/null; then
            if ! grep -q 'JIRA_PERSONAL' .github/workflows/jira-update-on-merge.yml; then
              echo "::error file=.github/workflows/jira-update-on-merge.yml::Must use JIRA_PERSONAL_EMAIL / JIRA_PERSONAL_API_TOKEN for JIRA writes (comments, transitions)"
              FAILED=true
            fi
          fi

          # jira-release-sync.yml should use the shared circulation action
          if [ -f .github/workflows/jira-release-sync.yml ]; then
            if grep -q 'JIRA_PERSONAL' .github/workflows/jira-release-sync.yml; then
              echo "::error file=.github/workflows/jira-release-sync.yml::jira-release-sync uses the shared circulation action with org credentials — do not use JIRA_PERSONAL_* here"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "❌ JIRA credential validation failed."
            echo "   See: https://github.com/ThePalaceProject/ios-core/pull/777 for the correct pattern."
            exit 1
          fi

          echo "✅ JIRA credential usage is correct."
