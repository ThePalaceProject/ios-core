name: Tooling Checks
# Fast integrity gate for the harness/CI tooling itself — the scripts, hooks,
# and detectors that gate everything else. CI historically only ran
# `xcodebuild test`, so a broken verify-pr.sh (bash syntax error) or a
# commit-blocking pre-commit hook could ship green (PR #1045). This job runs
# on every PR in ~1 minute on an ubuntu runner (no Xcode) and closes that gap:
#   1. bash -n on every committed shell script  (catches syntax breaks)
#   2. pytest on the detector suite              (catches detector logic regressions)
#   3. the pre-commit hook fixture test          (catches hook-wiring regressions)
# A second job (flake-lint) diff-scopes the STARVE-001 test-flakiness gate against
# the PR's base branch — blocks NEW parallel-clone-starvation deadline-polls.
on: [ pull_request, workflow_dispatch ]
concurrency:
  group: tooling-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules — tooling is in-repo)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install --quiet pytest

      # 1. Syntax-check every committed shell script. `scripts/hooks` is a
      #    machine-local symlink into the harness (absent on CI), so it is
      #    excluded via -type f (symlinks are skipped by find -type f).
      - name: bash -n all shell scripts
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(find scripts -type f -name '*.sh' 2>/dev/null | sort)
          if [ "$fail" -ne 0 ]; then
            echo "One or more shell scripts have a syntax error."
            exit 1
          fi
          echo "All committed shell scripts pass bash -n."

      # 1b. verify-pr.sh is the pre-PR battery — assert it specifically parses,
      #     since a break there silently aborts the whole local gate.
      - name: bash -n verify-pr.sh (explicit)
        run: bash -n scripts/verify-pr.sh

      # 2. Detector logic suite. These are the Phase 3.5 class-detectable
      #    detectors + the M1 checks that have pytest coverage.
      - name: pytest detector suite
        run: |
          if [ -d scripts/tests ]; then
            python3 -m pytest scripts/tests/ -q
          else
            echo "No scripts/tests/ — skipping."
          fi

      # 3. Hook-wiring fixture test. Proves the pre-commit detector hook
      #    correctly blocks on a violation, identifies the detector, and honors
      #    bypass envvars — and that every wired detector is invoked with an
      #    interface it accepts (the bug that would have blocked every commit).
      - name: pre-commit detector hook fixture test
        run: |
          # TRACKED file: absence means the gate was deleted, not that it is
          # optional. Skipping here turns a removed test into a green check.
          if [ ! -f scripts/tests/test_pre_commit_phase35_detectors.sh ]; then
            echo "::error::scripts/tests/test_pre_commit_phase35_detectors.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_pre_commit_phase35_detectors.sh

      # 3b. verify-pr detector wiring test. The three decomposition ratchets
      #     (locator count, god-class LOC, .shared reads) each shipped with a
      #     baseline and a passing pytest while being invoked by NOTHING
      #     (audited 2026-08-20). A detector's own unit tests are silent about
      #     whether anything calls it, so this asserts the CALL SITE — and
      #     asserts the clean path passes, not just that a violation blocks.
      #
      #     NOTE: deliberately does not spell out the completion-isolation
      #     detector's filename. test_check_completion_isolation.py guards
      #     "is this detector a CI step yet?" with a substring scan of THIS
      #     file, so naming it here — even in a comment — trips that ratchet.
      #     (Same shape as the ratchet-detectors-count-comment-mentions trap.)
      - name: verify-pr detector wiring test
        run: |
          # TRACKED file: absence means the gate was deleted, not that it is
          # optional. Fail rather than skip, or removing the test turns the
          # gate green — the failure mode this whole branch is about.
          if [ ! -f scripts/tests/test_verify_pr_ratchet_wiring.sh ]; then
            echo "::error::scripts/tests/test_verify_pr_ratchet_wiring.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_verify_pr_ratchet_wiring.sh

      # 3c. Documentation references must resolve. A tooling extraction left the
      #     docs pointing at scripts and workflows that no longer exist, and one
      #     of those pointers was the coverage summary telling reviewers that
      #     excluded paths were "covered by simdrive E2E journeys" via a workflow
      #     that did not exist. Hand-aimed audits missed it twice; this one is
      #     mechanical and covers every tracked doc. A pre-existing backlog is
      #     baselined — new dangling references fail, and baseline entries that
      #     start resolving fail too, so the amnesty cannot quietly grow.
      - name: doc references resolve
        run: |
          # TRACKED file: see above — absence is a deleted gate, not an opt-out.
          if [ ! -f scripts/check-doc-references-resolve.py ]; then
            echo "::error::scripts/check-doc-references-resolve.py is missing — the gate cannot run."
            exit 1
          fi
          python3 scripts/check-doc-references-resolve.py

      # 3e. The ratchet aggregation's BEHAVIOUR. This is the check that two
      #     reviewers between them walked through SEVEN ways when it asserted by
      #     grepping source text — every attack left the searched-for strings in
      #     place while making the branch unreachable. The replacement runs the
      #     block with stubbed inputs and asserts the outcome it records.
      #
      #     It shipped INVOKED BY NOTHING, which is the exact defect this branch
      #     is about, in the file arguing against it. Its only mention anywhere
      #     was a COMMENT in a sibling test — a mention, not a call. Wired here,
      #     failing closed like its siblings.
      - name: ratchet aggregation behaviour test
        run: |
          if [ ! -f scripts/tests/test_ratchet_aggregation_behaviour.sh ]; then
            echo "::error::scripts/tests/test_ratchet_aggregation_behaviour.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_ratchet_aggregation_behaviour.sh

      # 3d. ...and prove the gate above is actually wired, with an interface it
      #     accepts, and that it passes on a clean tree. A bash test, so pytest
      #     does not collect it.
      - name: doc-reference gate wiring test
        run: |
          # TRACKED file: absence means the gate was deleted, not that it is
          # optional. Fail rather than skip, or removing the test turns the
          # gate green — the failure mode this whole branch is about.
          if [ ! -f scripts/tests/test_doc_reference_gate_wiring.sh ]; then
            echo "::error::scripts/tests/test_doc_reference_gate_wiring.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_doc_reference_gate_wiring.sh

      # 4. @objc-witness-drift detector (bash test — not collected by pytest).
      #    Proves the same-name-drift block path, the benign different-name
      #    pass path, and the allowlist. Guards the Unit-Tests workflow gate.
      - name: objc-witness-drift detector test
        run: |
          if [ -f scripts/tests/test_check_objc_witness_nearly_matches.sh ]; then
            bash scripts/tests/test_check_objc_witness_nearly_matches.sh
          else
            echo "No objc-witness detector test — skipping."
          fi

      # 5. Committed-signing gate (repo rule: no team/profile in git, Manual only).
      #    Diff-based (blocks NEW signing info); the one pre-existing Automatic
      #    config (Palace Release) is cleaned separately once local dev-signing is
      #    provided via a gitignored xcconfig — flipping it blind would break it.
      - name: committed-signing detector test
        run: |
          # TRACKED file: absence means the gate was deleted, not that it is
          # optional. Skipping here turns a removed test into a green check.
          if [ ! -f scripts/tests/test_check_no_committed_signing.sh ]; then
            echo "::error::scripts/tests/test_check_no_committed_signing.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_check_no_committed_signing.sh

      # 5b. doc-hygiene detector: blocks process/generated docs (swarm transcripts/
      #     contracts, campaign scaffolding, generated .arch IR) from being committed;
      #     passes legit ADRs/READMEs. Asserts BOTH directions (see the shell test).
      - name: doc-hygiene detector test
        run: |
          # TRACKED file: absence means the gate was deleted, not that it is
          # optional. Skipping here turns a removed test into a green check.
          if [ ! -f scripts/tests/test_check_doc_hygiene.sh ]; then
            echo "::error::scripts/tests/test_check_doc_hygiene.sh is missing — the gate cannot be verified."
            exit 1
          fi
          bash scripts/tests/test_check_doc_hygiene.sh
      - name: contributor-surface gate
        run: |
          if [ -f scripts/check-contributor-surface.py ]; then
            python3 scripts/check-contributor-surface.py
          else
            echo "No contributor-surface gate — skipping."
          fi


  # Diff-scoped test-flakiness gate. Separate job because it needs the PR's base
  # branch fetched (fetch-depth: 0 + an explicit base fetch) to diff against —
  # the tooling-integrity job runs shallow. Fails the PR if a changed test file
  # ADDS a fixed-deadline wait on async work (STARVE-001 / recurrence class
  # `parallel-clone-starvation`): those starve under the 2 parallel sim clones on
  # the macOS test runner and fail all 3 `-retry-tests-on-failure` iterations.
  # Scoped to ADDED lines only, so it never chokes on the ~675 legacy occurrences.
  flake-lint:
    runs-on: ubuntu-latest
    env:
      # PR target branch (develop for the overwhelming majority); default to
      # develop for a manual workflow_dispatch run that has no base_ref.
      BASE: ${{ github.base_ref || 'develop' }}
    steps:
      - name: Checkout (full history so the base merge-base is reachable)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch PR base branch
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

      # Flag NEW deadline-poll waits on lines this PR adds vs its base. The
      # linter's --changed mode is diff-scoped (added lines of PalaceTests/*.swift
      # only) and exits 1 on a hit. No Xcode/simulator needed.
      - name: STARVE-001 — no new deadline-poll waits in changed tests
        run: python3 scripts/lint-test-quality.py --changed "origin/${BASE}"

      # 8. Dependency money-path gate. Readium renders and decrypts borrowed
      #    content, so a pin bump can break borrow / fulfillment / playback with
      #    no compile error and no failing test — that is how the 3.7 -> 3.9 bump
      #    shipped broken LCP audiobook streaming. This step fails a PR that
      #    moves the pin without recording money-path validation. A PR that does
      #    not touch the pin passes untouched, which the pytest above asserts
      #    explicitly.
      - name: Readium money-path validation gate
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bash scripts/check-dependency-money-paths.sh --base "origin/${{ github.base_ref }}"
