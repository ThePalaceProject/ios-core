name: Palace Release
on:
  pull_request:
    branches:
      - main
    types: [closed]
jobs:
  create-release:
    # Only when the PR actually merged — a closed-but-unmerged PR to main must not cut a release.
    if: github.event.pull_request.merged == true
    runs-on: macos-26
    outputs:
      version: ${{ steps.export-version.outputs.version }}
    steps:
      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify Xcode Version
        run: xcodebuild -version
      - name: Checkout main repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}
      - name: Checkout Certificates
        uses: actions/checkout@v7
        with:
          repository: ThePalaceProject/mobile-certificates
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}
          path: ./mobile-certificates
      - name: Create release notes
        run: ./scripts/create-release-notes.sh
        env:
          BUILD_CONTEXT: ci
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}
      - name: Verify path and version
        id: export-version
        run: |
          echo "Release notes path: " $RELEASE_NOTES_PATH
          cat $RELEASE_NOTES_PATH
          echo "Changelog path:     " $CHANGELOG_PATH
          cat $CHANGELOG_PATH
          echo "Version:            " $VERSION_NUM
          echo "version=$VERSION_NUM" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_NOTES_PATH: ${{ env.RELEASE_NOTES_PATH }}
          CHANGELOG_PATH: ${{ env.CHANGELOG_PATH }}
          VERSION_NUM: ${{ env.VERSION_NUM }}
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION_NUM" > /dev/null 2>&1; then
            gh release edit "$VERSION_NUM" \
              --title "$VERSION_NUM" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$VERSION_NUM" \
              --title "$VERSION_NUM" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

  jira-sync:
    needs: create-release
    uses: ./.github/workflows/jira-release-sync.yml
    with:
      tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit
