name: Unit Tests
on:
  # No `paths-ignore`. A workflow skipped by a path filter never reports its
  # checks, so a required check would sit at "Expected — waiting" forever on a
  # docs-only PR. The `changes` job below decides instead, and the
  # `build-and-test` gate reports success when nothing relevant changed.
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of test shards (for measuring the shard count; the default is UNIT_TEST_SHARDS)'
        required: false
        default: ''
      workers:
        description: 'Parallel test workers per shard (the default is 2)'
        required: false
        default: ''
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # How many matrix jobs run the tests. Chosen from measured cost and wall
  # clock; see the PR that introduced sharding for the N=2/3/4 comparison.
  # The plan, the matrix and the gate all read this one number.
  UNIT_TEST_SHARDS: 2

jobs:

  # NOTE: Standalone QAAtlas and AccessLint jobs have been consolidated into
  # the Ledger Analysis workflow (ledger.yml) which now integrates both tools.
  # See: https://github.com/mauricecarrier7/ledger-dist

  # Decide whether this PR can change the unit-test result at all. Everything
  # runs unless every changed path is on the skippable list in
  # scripts/ci-unit-test-relevance.py (other workflows, tooling pytests, docs,
  # agent metadata). Any failure to list the changed files runs the suite.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github
            Palace.xcodeproj
      - name: Decide whether the unit tests must run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request (${{ github.event_name }}); running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API returns at most 3000 entries; a list that long may be
          # truncated, and a truncated list cannot prove anything is skippable.
          if ! gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
                --jq '.[].filename' > changed.txt; then
            echo "::warning::could not list the PR's changed files; running the unit tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(wc -l < changed.txt | tr -d ' ')
          echo "$COUNT changed file(s)"
          if [ "$COUNT" -ge 3000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci-unit-test-relevance.py --changed changed.txt --github-output

  # Build once. The products, the .xctestrun and the shard plan go up as one
  # artifact that every shard downloads, so a re-run shard does not rebuild.
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      xcode: ${{ steps.xcode.outputs.version }}
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # The shards select this exact version: products built by one Xcode are
      # not guaranteed to run under another, and `latest-stable` is resolved
      # per runner.
      - name: Record Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Checkout main repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}

      # Package checkouts only (DerivedData/SourcePackages — the Crashlytics
      # build phase finds its script there), keyed on the lockfile. SPM checks every checkout out at the
      # revision Package.resolved pins, so a restored cache cannot change what
      # is built. DerivedData is deliberately NOT cached: this workflow cleaned
      # before every build to defeat stale-DerivedData false greens, so the
      # cache restored objects the build then discarded (measured: restore
      # ~0 min, save ~1 min per run, no compile reused).
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Palace.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Checkout Certificates
        uses: actions/checkout@v7
        with:
          repository: ThePalaceProject/mobile-certificates
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}
          path: ./mobile-certificates

      - name: Checkout Adobe RMSDK
        uses: ./.github/actions/checkout-adobe
        with:
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}

      - name: Setup repo with DRM
        run: ./scripts/setup-repo-drm.sh
        env:
          BUILD_CONTEXT: ci

      - name: Build non-Carthage 3rd party dependencies
        run: ./scripts/build-3rd-party-dependencies.sh
        env:
          BUILD_CONTEXT: ci

      - name: Select simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep iPhone | head -10
          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone" \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          [ -n "$SIMULATOR_ID" ] || { echo "::error::no iPhone simulator"; exit 1; }
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      # Same build settings as scripts/xcode-test-optimized.sh: ad-hoc signed
      # (an unsigned host has no keychain-access-group and 15 classes skip,
      # PP-5058), Debug, -Onone, testability on. No `xcodebuild clean`: the
      # DerivedData directory is new on every runner.
      - name: Build for testing
        id: build
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/BuildResults.xcresult"
          xcodebuild build-for-testing \
            -project Palace.xcodeproj \
            -scheme Palace \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/BuildResults.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            GCC_OPTIMIZATION_LEVEL=0 \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            ENABLE_TESTABILITY=YES 2>&1 | tee build-output.log

      # Fails the job when a build warning shows an `@objc` optional-protocol
      # method that "nearly matches" its requirement by the same name — i.e. the
      # method silently is NOT the delegate witness and the callback is skipped
      # at runtime (the Xcode-26.2 WKNavigationDelegate sign-in break, #1205).
      # Benign different-name nearly-matches (e.g. CarPlay) are ignored.
      - name: Guard against @objc witness drift (silent delegate skip)
        if: always() && steps.build.outcome != 'skipped'
        run: scripts/check-objc-witness-nearly-matches.sh build-output.log

      # The report job parses this bundle for the build errors when the build
      # fails, which is how the PR comment shows them.
      - name: Upload build results
        if: failure() && steps.build.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-results
          path: ${{ runner.temp }}/BuildResults.xcresult
          retention-days: 7
          overwrite: true

      # The class list comes from the BUILT bundles, not from grepping source:
      # it is exactly what xcodebuild would run unsharded. The planner fails
      # if a class would land in no shard or two, or if an isolated-serial
      # name matches nothing.
      - name: Enumerate tests and plan the shards
        id: plan
        run: |
          set -euo pipefail
          SHARDS="${{ github.event.inputs.shards }}"
          SHARDS="${SHARDS:-$UNIT_TEST_SHARDS}"
          XCTESTRUN=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 1 -name "*.xctestrun" | head -1)
          [ -f "$XCTESTRUN" ] || { echo "::error::build-for-testing produced no .xctestrun"; exit 1; }
          mkdir -p "$RUNNER_TEMP/plan"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -enumerate-tests \
            -test-enumeration-style flat \
            -test-enumeration-format json \
            -test-enumeration-output-path "$RUNNER_TEMP/plan/enumeration.json"
          python3 scripts/ci-test-shards.py plan \
            --enumeration "$RUNNER_TEMP/plan/enumeration.json" \
            --shards "$SHARDS" \
            --out "$RUNNER_TEMP/plan/shard-plan.json"
          echo "shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")" >> "$GITHUB_OUTPUT"

      # build-for-testing records each local package framework in the
      # xctestrun's coverage metadata as static, and leaves some out, so the
      # shards' xcresults list those packages with no files. Rewrite those
      # entries before the products ship. On failure the app coverage is
      # unaffected and the report names every package it did not receive.
      - name: Point coverage metadata at the package binaries
        continue-on-error: true
        run: |
          set -euo pipefail
          XCTESTRUN=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 1 -name "*.xctestrun" | head -1)
          python3 scripts/ci-xctestrun-package-coverage.py "$XCTESTRUN"

      # Everything test-without-building needs, and nothing it does not:
      # object files, module interfaces and dSYMs stay behind (~350 MB).
      # zstd, because upload-artifact's zip does not keep symlinks and is slow.
      - name: Package test products
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dd/Build"
          tar -cf - --exclude '*.o' --exclude '*.swiftmodule' --exclude '*.dSYM' Products \
            | zstd -T0 -3 -q -o "$RUNNER_TEMP/plan/Products.tar.zst"
          ls -la "$RUNNER_TEMP/plan"

      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: ${{ runner.temp }}/plan
          retention-days: 3
          compression-level: 0
          overwrite: true

      # Small and separate, so the gate can check the plan without the products.
      - name: Upload shard plan
        uses: actions/upload-artifact@v7
        with:
          name: shard-plan
          path: ${{ runner.temp }}/plan/shard-plan.json
          retention-days: 14
          overwrite: true

  # One job per shard. A failed shard re-runs alone (`gh run rerun --failed`)
  # against the build artifact above; nothing is rebuilt.
  test:
    needs: [changes, build]
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    name: test (shard ${{ matrix.shard }})
    # The shard budget inside ci-run-test-shard.sh interrupts xcodebuild at
    # 30 minutes so the result bundle is still written; this is the backstop.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ needs.build.outputs.xcode }}

      # No submodules and no token: the tests run from the built products. The
      # repo is here for the scripts, the package tests, and the lint tests
      # that read Palace/ and PalaceTests/ sources through #filePath.
      - name: Checkout
        uses: actions/checkout@v7

      # BookmarkSpecConformanceTests reads the mobile-specs corpus from the
      # checkout through #filePath, so the one submodule the tests read has to
      # be here. It is public; .gitmodules names it by SSH, which this job has
      # no key for, hence the https rewrite.
      - name: Check out the submodules the tests read
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 mobile-specs

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}/plan

      - name: Unpack test products
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Build"
          zstd -dc "$RUNNER_TEMP/plan/Products.tar.zst" | tar -xf - -C "$RUNNER_TEMP/Build"
          XCTESTRUN=$(find "$RUNNER_TEMP/Build/Products" -maxdepth 1 -name "*.xctestrun" | head -1)
          [ -f "$XCTESTRUN" ] || { echo "::error::no .xctestrun in the test products"; exit 1; }
          PLAN="$RUNNER_TEMP/plan/shard-plan.json"
          {
            echo "xctestrun=$XCTESTRUN"
            echo "plan=$PLAN"
            echo "streaming_on=$(python3 scripts/ci-test-shards.py extra --plan "$PLAN" --shard ${{ matrix.shard }} streaming-on)"
            echo "packages=$(python3 scripts/ci-test-shards.py extra --plan "$PLAN" --shard ${{ matrix.shard }} packages)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Run test shard
        id: tests
        timeout-minutes: 40
        shell: bash
        env:
          BUILD_CONTEXT: ci
          CI_TEST_WORKERS: ${{ github.event.inputs.workers || '2' }}
        run: |
          set -o pipefail
          scripts/ci-run-test-shard.sh \
            "${{ steps.plan.outputs.xctestrun }}" \
            "${{ steps.plan.outputs.plan }}" \
            "${{ matrix.shard }}" \
            "$RUNNER_TEMP/shard-out"
        continue-on-error: true

      # One screen that separates a runner stall from a code hang, so nobody
      # has to download the xcresult to find out. The 2026-09 census traced the
      # allowance kills to memory pressure on this 3-CPU / 7 GB runner; each
      # spindump XCTest attached to a failure is summarized in one line.
      - name: Runner memory and hang diagnostics
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/ci-runner-diagnostics.py memory-summary "$RUNNER_TEMP/shard-out/memory-samples.txt"
          echo "--- now"
          memory_pressure -Q || true
          sysctl vm.swapusage || true
          vm_stat | head -14 || true
          RESULT="$RUNNER_TEMP/shard-out/TestResults.xcresult"
          if [ -d "$RESULT" ]; then
            rm -rf "$RUNNER_TEMP/failure-attachments"; mkdir -p "$RUNNER_TEMP/failure-attachments"
            xcrun xcresulttool export attachments --path "$RESULT" \
              --output-path "$RUNNER_TEMP/failure-attachments" --only-failures > /dev/null || true
            python3 scripts/ci-runner-diagnostics.py spindump-summary --attachments "$RUNNER_TEMP/failure-attachments"
          fi

      # R7a: production runs `lcp_audiobook_streaming_enabled` ON, and the shard
      # passes run every test with it pinned OFF (PalaceTests/PalaceTestSetup.swift).
      # This leg re-runs the flag consumers' suites with PALACE_TEST_LCP_STREAMING=on
      # against the same prebuilt products. It runs on the one shard the plan
      # assigns it to (`extras.streaming-on`), weighted like a class.
      #
      # Which suites: every Palace/ file that reads the flag (the census below)
      # names a type — the file name up to any `+Extension` suffix. The leg runs
      # every XCTestCase class in a PalaceTests file that mentions one of those
      # types or the flag itself. The list is derived at run time, so a new
      # consumer joins the leg without editing this file.
      #
      # How the leg proves it tested something:
      #   * the derived class list is non-empty and every class on it appears in
      #     the result bundle (xcodebuild ignores an -only-testing name that
      #     matches nothing, so a misspelt or renamed class would otherwise be
      #     dropped without a sign);
      #   * LCPStreamingTestPinTests' ON-leg canary PASSED. It skips unless the
      #     variable reached the test host, so a skip means the leg ran OFF.
      #
      # Serial on purpose: the leg is ~1,100 tests and ~30 s of test time, so
      # simulator clones would cost more than they save, and several of these
      # classes are load-sensitive (see ISOLATED_SERIAL_TESTS in
      # scripts/xcode-test-optimized.sh).
      #
      # To exclude a test that fails because production behaves differently
      # under ON, add one line per test to ON_SKIP_ARGS, naming its ticket:
      #   `-skip-testing:PalaceTests/<Class>/<test>  # PP-<n>: <why>`
      # None are excluded today.
      - name: Run LCP-streaming flag consumers' suites with the flag ON
        id: tests_streaming_on
        if: ${{ !cancelled() && steps.plan.outputs.streaming_on == 'true' }}
        timeout-minutes: 25
        shell: bash
        env:
          BUILD_CONTEXT: ci
          TEST_RUNNER_PALACE_TEST_LCP_STREAMING: 'on'
        run: |
          set -euo pipefail

          DECLARATIONS='Palace/FeatureFlags/RemoteFeatureFlags.swift|Palace/Packages/PalaceFeatureFlags/Sources/PalaceFeatureFlags/PalaceFeatureFlag.swift'
          # `|| true` on the grep stages: under pipefail a stage that matches
          # nothing would end the step with no message; the empty-list checks
          # below report that case instead.
          CONSUMERS=$({ grep -rlE 'isLCPAudiobookStreamingEnabled|lcpStreamingEnabledProvider' Palace --include='*.swift' || true; } \
            | { grep -vxE "$DECLARATIONS" || true; } | LC_ALL=C sort)
          TYPES=()
          for f in $CONSUMERS; do
            t=$(basename "$f" .swift); t=${t%%+*}
            if ! grep -qE "(class|struct|enum|actor|extension)[[:space:]]+${t}\b" "$f"; then
              echo "::error file=$f::reads the streaming flag, but declares no type named '$t'; the ON leg derives suites from the file name"
              exit 1
            fi
            TYPES+=("$t")
          done
          [ ${#TYPES[@]} -gt 0 ] || { echo "::error::flag census found no consumers"; exit 1; }
          UNIQUE=()
          while IFS= read -r t; do UNIQUE+=("$t"); done < <(printf '%s\n' "${TYPES[@]}" | LC_ALL=C sort -u)
          TYPES=("${UNIQUE[@]}")
          echo "Consumer types: ${TYPES[*]}"

          PATTERN="\\b($(IFS='|'; echo "${TYPES[*]}"))\\b|isLCPAudiobookStreamingEnabled|lcpStreamingEnabledProvider|lcpAudiobookStreamingLocalOverrideKey|LCPStreamingTestPin"
          CLASSES=$({ grep -rlE "$PATTERN" PalaceTests --include='*.swift' || true; } \
            | { xargs grep -hE '^[[:space:]]*(@MainActor[[:space:]]+)?((final|private|fileprivate|internal)[[:space:]]+)*class[[:space:]]+[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*(XCTestCase|PalaceTestCase|PalaceWiringTestCase)\b' || true; } \
            | sed -E 's/.*class[[:space:]]+([A-Za-z0-9_]+).*/\1/' | LC_ALL=C sort -u)
          echo "$CLASSES" | grep -qx 'LCPStreamingTestPinTests' || { echo "::error::derived class list lacks LCPStreamingTestPinTests"; exit 1; }
          echo "ON leg: $(echo "$CLASSES" | wc -l | tr -d ' ') classes"
          ONLY_ARGS=()
          for c in $CLASSES; do ONLY_ARGS+=("-only-testing:PalaceTests/$c"); done
          ON_SKIP_ARGS=(
          )

          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone" \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          [ -n "$SIMULATOR_ID" ] || { echo "::error::no iPhone simulator"; exit 1; }

          RESULT="$RUNNER_TEMP/TestResults-streaming-on.xcresult"
          rm -rf "$RESULT"
          set +e
          xcodebuild test-without-building \
            -xctestrun "${{ steps.plan.outputs.xctestrun }}" \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath "$RESULT" \
            "${ONLY_ARGS[@]}" \
            ${ON_SKIP_ARGS[@]+"${ON_SKIP_ARGS[@]}"} \
            -retry-tests-on-failure -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO
          XCB_EXIT=$?
          set -e
          [ -d "$RESULT" ] || { echo "::error::the ON leg produced no result bundle"; exit 1; }

          xcrun xcresulttool get test-results tests --path "$RESULT" > "$RUNNER_TEMP/streaming-on-tests.json"
          EXPECTED="$CLASSES" python3 - "$RUNNER_TEMP/streaming-on-tests.json" <<'PY'
          import json, os, sys
          nodes = json.load(open(sys.argv[1]))["testNodes"]
          suites, canary = set(), []
          def walk(n):
              if n.get("nodeType") == "Test Suite":
                  suites.add(n.get("name"))
              if n.get("nodeType") == "Test Case" and n.get("name", "").startswith("testOnLegCanary_EnvironmentReachedTheHost"):
                  canary.append(n.get("result"))
              for c in n.get("children", []):
                  walk(c)
          for n in nodes:
              walk(n)
          expected = set(os.environ["EXPECTED"].split())
          missing = sorted(expected - suites)
          if missing:
              sys.exit(f"::error::ON leg did not run: {', '.join(missing)}")
          if canary != ["Passed"]:
              sys.exit(f"::error::ON-leg canary result {canary}; PALACE_TEST_LCP_STREAMING did not reach the test host, so the leg ran OFF")
          print(f"ON leg ran all {len(expected)} expected suites; canary passed")
          PY
          exit $XCB_EXIT
        continue-on-error: true

      - name: Upload streaming-ON results
        if: steps.tests_streaming_on.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-streaming-on
          overwrite: true
          path: ${{ runner.temp }}/TestResults-streaming-on.xcresult
          retention-days: 7
        continue-on-error: true

      # Fails the job when a build warning shows an `@objc` optional-protocol
      # method that "nearly matches" its requirement by the same name — i.e. the
      # method silently is NOT the delegate witness and the callback is skipped
      # at runtime (the Xcode-26.2 WKNavigationDelegate sign-in break, #1205).
      # Benign different-name nearly-matches (e.g. CarPlay) are ignored.
      # Host-buildable Swift packages, on the shard the plan gives them to
      # (`extras.packages`). These test targets are not in the Palace scheme,
      # so xcodebuild never runs them; before 2026-09-25 PalaceAuthTests (116
      # tests) ran nowhere. Measured 2026-09-25: Auth 116, ReadingPosition 20,
      # Logging 8, all green in well under a minute combined.
      #
      # PalaceKeychain is deliberately NOT here. It builds, then HANGS: its tests
      # guard with KeychainAvailability.skipIfUnavailable(), which probes by writing
      # to the keychain. That guard was written for the iOS Simulator, where an
      # unentitled host returns -34018 and the skip fires. On an unsigned macOS
      # `swift test` binary the same call blocks on a UI authorization prompt
      # instead of erroring, so the guard itself never returns. Wiring it here
      # would hang CI for the step timeout. Tracked in the Phase A notes.
      # Paths are written out in full, deliberately. A `for pkg in ...` loop
      # builds the path at runtime, so check-package-tests-wired.sh cannot see
      # which packages this step covers.
      - name: Run PalaceTriageBot package tests
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: swift test --enable-code-coverage --package-path Palace/Packages/PalaceTriageBot

      - name: Run PalaceAuth package tests
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: swift test --enable-code-coverage --package-path Palace/Packages/PalaceAuth

      - name: Run PalaceLogging package tests
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: swift test --enable-code-coverage --package-path Palace/Packages/PalaceLogging

      - name: Run PalaceReadingPosition package tests
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: swift test --enable-code-coverage --package-path Palace/Packages/PalaceReadingPosition

      # PalaceUtilities is the Phase B1 extraction: the Foundation-only core of
      # Palace/Utilities, with no package dependencies at all. 153 tests, under
      # a second.
      - name: Run PalaceUtilities package tests
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: swift test --enable-code-coverage --package-path Palace/Packages/PalaceUtilities

      # One llvm-cov export per package above, for the report job. A package
      # whose tests did not finish leaves no file, and the report then reads
      # as incomplete rather than as that package at 0%.
      - name: Collect package coverage
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/package-coverage"
          mkdir -p "$OUT"
          for pkg in PalaceTriageBot PalaceAuth PalaceLogging PalaceReadingPosition PalaceUtilities; do
            src=$(swift test --show-codecov-path --package-path "Palace/Packages/$pkg")
            if [ -f "$src" ]; then cp "$src" "$OUT/$pkg.json"; else echo "::warning::no coverage file for $pkg at $src"; fi
          done
          ls -la "$OUT"

      - name: Upload package coverage
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: package-coverage
          path: ${{ runner.temp }}/package-coverage/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      # The package suite above runs RedactionCorpusTests, but a deny-list guard
      # is only worth its ability to fail. --self-test disables redaction to prove
      # the guard goes red on an un-redacted corpus, catching a guard that has
      # silently stopped guarding.
      - name: Verify TriageBot redaction leak gate
        if: ${{ !cancelled() && steps.plan.outputs.packages == 'true' }}
        run: bash scripts/triage-corpus-check.sh --self-test

      - name: Collect Snapshot Failures
        if: always()
        id: snapshots
        run: |
          mkdir -p snapshot-failures
          find /Users/runner/Library/Developer/CoreSimulator -name "*.png" -path "*tmp*" -type f 2>/dev/null | head -50 | while read -r file; do
            cp "$file" snapshot-failures/ 2>/dev/null || true
          done
          COUNT=$(find snapshot-failures -maxdepth 1 -name "*.png" | wc -l | tr -d ' ')
          echo "Snapshot files found: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Snapshot Failures
        if: always() && steps.snapshots.outputs.count != '0'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures-shard-${{ matrix.shard }}
          path: snapshot-failures/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      # Archive failures are not test failures (PP-4988): continue-on-error.
      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      # After an xcodebuild crash or a failed shard, TestResults.xcresult may not
      # exist. The shard keeps the unmerged bundles (possibly unfinalized) and the
      # raw xcodebuild log of each pass in shard-out/partial; upload them so the
      # failure text can still be read with xcresulttool or from the log.
      - name: Check for partial test results
        if: always()
        id: partial
        run: |
          if [ -n "$(ls -A "$RUNNER_TEMP/shard-out/partial" 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload partial test results
        if: always() && steps.partial.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: partial-test-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out/partial/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      # NOT continue-on-error: the gate cannot prove this shard ran its classes
      # without it, and it must then fail rather than assume.
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out/shard-report.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure' || steps.tests_streaming_on.outcome == 'failure'
        run: exit 1

  # The single required check. It passes when every shard passed and the shard
  # reports together account for every planned class exactly once, or when the
  # `changes` job found nothing that can affect the tests (build and test then
  # report `skipped`, which this job reads as a pass only in that case).
  build-and-test:
    needs: [changes, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate
        id: eval
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES run=$RUN build=$BUILD test=$TEST"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::could not decide whether the tests must run (changes job: $CHANGES)"; exit 1
          fi
          if [ "$RUN" = "false" ]; then
            if [ "$BUILD" = "skipped" ] && [ "$TEST" = "skipped" ]; then
              echo "No changed path can affect the unit tests; build and test were skipped."
              echo "verify=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::tests were not required but build=$BUILD test=$TEST"; exit 1
          fi
          if [ "$BUILD" != "success" ]; then echo "::error::build: $BUILD"; exit 1; fi
          if [ "$TEST" != "success" ]; then echo "::error::one or more test shards: $TEST"; exit 1; fi
          echo "verify=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.eval.outputs.verify == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Download shard plan
        if: steps.eval.outputs.verify == 'true'
        uses: actions/download-artifact@v8
        with:
          name: shard-plan
          path: plan

      - name: Download shard reports
        if: steps.eval.outputs.verify == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: shard-report-*
          path: reports

      - name: Every planned class ran in exactly one shard
        if: steps.eval.outputs.verify == 'true'
        run: |
          set -euo pipefail
          REPORTS=()
          while IFS= read -r r; do REPORTS+=("$r"); done < <(find reports -name shard-report.json | sort)
          printf '%s\n' "${REPORTS[@]}"
          python3 scripts/ci-test-shards.py verify-union --plan plan/shard-plan.json "${REPORTS[@]}"

  # Merges the shard bundles and produces the same reports, PR comment and
  # artifacts the single job did. It does not gate: the pass/fail verdict is
  # the shards' and `build-and-test`'s. Runs on macOS only because xcresulttool
  # does; publishing to Pages happens on Linux in `publish-report`.
  report:
    needs: [changes, build, test]
    if: always() && needs.changes.outputs.run == 'true' && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ needs.build.outputs.xcode || 'latest-stable' }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Test History
        uses: actions/cache@v6
        with:
          path: .test-history
          key: test-history-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            test-history-${{ github.head_ref || github.ref_name }}
            test-history-develop
            test-history-

      - name: Download shard results
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-shard-*
          path: shard-results

      - name: Download shard plan
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: shard-plan
          path: plan

      - name: Download shard reports
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: shard-report-*
          path: shard-reports

      - name: Download package coverage
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: package-coverage
          path: package-coverage

      # Whether every planned class ran. Coverage and "all passed" mean nothing
      # over a run that lost classes to a runner failure, and without this the
      # loss reads as a coverage drop (run 36797084975). The gate's own check;
      # here it only decides what the report may claim.
      - name: Check every planned class ran
        id: completeness
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "${{ needs.build.result }}" != "success" ]; then
            { echo "complete=false"; echo "reason=the build did not succeed, so no test ran"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPORTS=()
          while IFS= read -r r; do REPORTS+=("$r"); done < <(find shard-reports -name shard-report.json 2>/dev/null | sort)
          if [ ! -f plan/shard-plan.json ]; then
            { echo "complete=false"; echo "reason=the shard plan could not be downloaded"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if OUT=$(python3 scripts/ci-test-shards.py verify-union --plan plan/shard-plan.json ${REPORTS[@]+"${REPORTS[@]}"}); then
            echo "$OUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"
            REASON=$(echo "$OUT" | sed -n 's/^::error:://p' | cut -c1-600 | paste -sd ';' -)
            { echo "complete=false"; echo "reason=${REASON:-the shard reports do not account for every planned class}"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Download build results
        if: needs.build.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: build-results
          path: build-results/BuildResults.xcresult

      - name: Download snapshot failures
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: snapshot-failures-shard-*
          path: snapshot-failures
          merge-multiple: true

      # One bundle for the parsers, as the single job had: the shard bundles
      # merged, or the build's own bundle when the build failed.
      - name: Find Test Results
        if: always()
        id: find_results
        run: |
          set -uo pipefail
          if [ -d build-results/BuildResults.xcresult ]; then
            echo "path=build-results/BuildResults.xcresult" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # upload-artifact stores a directory's CONTENTS, so each shard bundle
          # arrives as shard-results/test-results-shard-N/ holding Info.plist.
          # Give each one back its .xcresult name before merging.
          mkdir -p bundles
          BUNDLES=()
          for d in shard-results/test-results-shard-*; do
            [ -f "$d/Info.plist" ] || continue
            mv "$d" "bundles/$(basename "$d").xcresult"
            BUNDLES+=("bundles/$(basename "$d").xcresult")
          done
          echo "shard bundles: ${#BUNDLES[@]}"
          if [ ${#BUNDLES[@]} -eq 0 ]; then
            echo "❌ No xcresult found"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#BUNDLES[@]} -eq 1 ]; then
            cp -R "${BUNDLES[0]}" TestResults.xcresult
          else
            xcrun xcresulttool merge --output-path TestResults.xcresult "${BUNDLES[@]}"
          fi
          echo "path=TestResults.xcresult" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>&1 | head -30 || true

      - name: Parse Test Results
        if: always()
        id: parse_results
        run: |
          RESULT_PATH="${{ steps.find_results.outputs.path }}"
          
          # Initialize defaults
          echo "tests=0" >> $GITHUB_OUTPUT
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "skipped=0" >> $GITHUB_OUTPUT
          echo "duration=unknown" >> $GITHUB_OUTPUT
          echo "pass_rate=N/A" >> $GITHUB_OUTPUT
          
          if [ "${{ steps.find_results.outputs.found }}" != "true" ] || [ ! -d "$RESULT_PATH" ]; then
            echo "No results to parse"
            exit 0
          fi
          
          echo "Parsing test results from: $RESULT_PATH"
          
          # Debug: Show raw xcresulttool output structure
          echo "=== xcresulttool version ==="
          xcrun xcresulttool version 2>/dev/null || echo "version command not available"
          
          echo "=== Raw test-results summary (first 2000 chars) ==="
          xcrun xcresulttool get test-results summary --path "$RESULT_PATH" 2>/dev/null | head -c 2000 || echo "summary command failed"
          
          echo ""
          echo "=== Raw test-results tests structure (first 3000 chars) ==="
          xcrun xcresulttool get test-results tests --path "$RESULT_PATH" 2>/dev/null | head -c 3000 || echo "tests command failed"
          
          echo ""
          echo "=== Parsing with Python script ==="
          
          # Use the enhanced Python parser - outputs to GITHUB_OUTPUT and test-data.json
          python3 scripts/parse-xcresult.py "$RESULT_PATH" --json test-data.json || true
          
          # Debug: Show parsed values
          echo "=== Parsed Test Results ==="
          cat test-data.json | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('summary',{}); print(f\"Tests: {s.get('tests',0)}, Passed: {s.get('passed',0)}, Failed: {s.get('failed',0)}\")" 2>/dev/null || echo "Could not read test-data.json"
          
      - name: Compare with History
        if: always()
        id: history
        run: |
          if [ -f "test-data.json" ] && [ -d ".test-history" ]; then
            echo "Comparing with test history..."
            python3 scripts/test-history.py compare test-data.json .test-history || true
          else
            echo "No history available for comparison"
            echo "has_history=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Save to History
        if: always()
        run: |
          if [ -f "test-data.json" ]; then
            python3 scripts/test-history.py save test-data.json .test-history || true
          fi
          
      # Exit 0 is a complete report; exit 3 (with coverage-data.json still
      # written) names what is missing: no result bundle, an unreadable one, a
      # shard that lost classes, a package with no data. The steps below read
      # the status output, not this step's outcome.
      - name: Parse Code Coverage
        if: always()
        id: coverage
        env:
          FOUND: ${{ steps.find_results.outputs.found }}
          RESULT_PATH: ${{ steps.find_results.outputs.path }}
          COMPLETE: ${{ steps.completeness.outputs.complete }}
          REASON: ${{ steps.completeness.outputs.reason }}
        run: |
          set -uo pipefail
          ARGS=(--json coverage-data.json --repo-root "$GITHUB_WORKSPACE" --expect-local-packages
                --host-package-dir package-coverage)
          # The packages the test job runs with `swift test --enable-code-coverage`.
          for pkg in PalaceTriageBot PalaceAuth PalaceLogging PalaceReadingPosition PalaceUtilities; do
            ARGS+=(--expect-host-package "$pkg")
          done
          if [ "$COMPLETE" != "true" ]; then
            ARGS+=(--incomplete-reason "not every planned test class ran: ${REASON:-unknown}")
          fi
          if [ "$FOUND" != "true" ] || [ ! -d "$RESULT_PATH" ]; then
            ARGS+=(--incomplete-reason "no test result bundle")
            RESULT_PATH="${RESULT_PATH:-missing.xcresult}"
          fi
          python3 scripts/coverage-report.py "$RESULT_PATH" "${ARGS[@]}"
          RC=$?
          echo "coverage-report.py exited $RC"
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 3 ]; then
            echo "coverage_status=incomplete" >> "$GITHUB_OUTPUT"
            echo "coverage_incomplete_reason=coverage-report.py exited $RC" >> "$GITHUB_OUTPUT"
            exit "$RC"
          fi

      # Coverage floor gate. Reports, does not block (continue-on-error): the
      # floors are already below on several modules, and making it required is
      # a separate decision. Incomplete data exits 3 and is never a pass.
      - name: Enforce Coverage Floors
        if: always()
        id: coverage_gate
        continue-on-error: true
        env:
          COMPLETE: ${{ steps.completeness.outputs.complete }}
          REASON: ${{ steps.completeness.outputs.reason }}
        run: |
          # steps.completeness.outputs.complete: coverage from a run that lost
          # classes is lower for that reason alone, so the floors are not
          # compared; the reason is reported in their place.
          if [ "$COMPLETE" != "true" ]; then
            echo "::error title=Coverage floors not evaluated::not every planned test class ran: ${REASON:-unknown}"
            exit 1
          fi
          set +e
          python3 scripts/enforce_coverage_floors.py coverage-data.json --floors scripts/coverage-floors.json
          RC=$?
          if [ "$RC" -eq 3 ]; then
            echo "::error title=Coverage incomplete::floors not compared; the Parse Code Coverage step names what is missing"
          fi
          exit "$RC"

      - name: Process Snapshot Failures
        if: always()
        id: snapshots
        run: |
          COUNT=$(find snapshot-failures -maxdepth 1 -name "*.png" 2>/dev/null | wc -l | tr -d ' ')
          echo "Total snapshot files found: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            { echo "found=true"; echo "count=$COUNT"; } >> "$GITHUB_OUTPUT"
            python3 scripts/process-snapshots.py snapshot-failures || true
          else
            { echo "found=false"; echo "count=0"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Report URL
        id: report_url
        if: always()
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          echo "report_url=https://${REPO_OWNER}.github.io/${REPO_NAME}/test-reports/${{ github.run_number }}/" >> "$GITHUB_OUTPUT"

      - name: Generate Test Reports
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test-report
          
          # Generate Markdown report
          python3 scripts/generate-test-report.py test-data.json test-report/TEST_RESULTS.md \
            --commit "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --snapshot-count "${{ steps.snapshots.outputs.count }}" || true
          
          # Generate HTML report
          python3 scripts/generate-html-report.py test-data.json test-report/test-report.html \
            --coverage coverage-data.json \
            --commit "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" || true
          
          # Fallback if scripts fail
          if [ ! -f "test-report/TEST_RESULTS.md" ]; then
            echo "# Test Results" > test-report/TEST_RESULTS.md
            echo "" >> test-report/TEST_RESULTS.md
            echo "Tests: ${{ steps.parse_results.outputs.tests }}" >> test-report/TEST_RESULTS.md
            echo "Passed: ${{ steps.parse_results.outputs.passed }}" >> test-report/TEST_RESULTS.md
            echo "Failed: ${{ steps.parse_results.outputs.failed }}" >> test-report/TEST_RESULTS.md
          fi
          
          echo "Generated reports:"
          ls -la test-report/
          
      - name: Generate GitHub Step Summary
        if: always()
        continue-on-error: true
        run: |
          TESTS="${{ steps.parse_results.outputs.tests }}"
          PASSED="${{ steps.parse_results.outputs.passed }}"
          FAILED="${{ steps.parse_results.outputs.failed }}"
          SKIPPED="${{ steps.parse_results.outputs.skipped }}"
          DURATION="${{ steps.parse_results.outputs.duration }}"
          PASS_RATE="${{ steps.parse_results.outputs.pass_rate }}"
          CLASS_SUMMARY="${{ steps.parse_results.outputs.class_summary }}"
          COVERAGE="${{ steps.coverage.outputs.coverage_formatted }}"
          TOTAL_COVERAGE="${{ steps.coverage.outputs.total_coverage_formatted }}"
          EXCLUDED_FILES="${{ steps.coverage.outputs.excluded_file_count }}"
          COVERAGE_STATUS="${{ steps.coverage.outputs.coverage_status }}"
          COVERAGE_INCOMPLETE="${{ steps.coverage.outputs.coverage_incomplete_reason }}"
          COVERAGE_PACKAGES="${{ steps.coverage.outputs.coverage_packages }}"
          NEW_FAILURES="${{ steps.history.outputs.new_failures }}"
          FIXED_TESTS="${{ steps.history.outputs.fixed_tests }}"
          FLAKY_TESTS="${{ steps.history.outputs.flaky_tests }}"
          TEST_COUNT_CHANGE="${{ steps.history.outputs.test_count_change }}"
          BUILD_STATUS="${{ steps.parse_results.outputs.build_status }}"
          BUILD_ERRORS="${{ steps.parse_results.outputs.build_errors }}"
          RUNNER_FAILURES="${{ steps.parse_results.outputs.runner_failures }}"
          COMPLETE="${{ steps.completeness.outputs.complete }}"
          INCOMPLETE_REASON="${{ steps.completeness.outputs.reason }}"
          
          echo "## 🧪 Palace Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Runner failures are not test failures: a test runner that never
          # connected or died, named as such so the failure list is not read
          # as a test regression.
          {
            if [ "$COMPLETE" != "true" ] && [ "$BUILD_STATUS" != "failed" ]; then
              printf '### ⚠️ NOT EVERY TEST RAN\n\n%s\n\n' "$INCOMPLETE_REASON"
            fi
            if [ -n "$RUNNER_FAILURES" ]; then
              printf '<details open>\n<summary><strong>Runner failures (not test failures)</strong></summary>\n\n'
              printf "\`\`\`\n%s\n\`\`\`\n</details>\n\n" "$RUNNER_FAILURES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
          # Check for build failure first
          if [ "$BUILD_STATUS" = "failed" ]; then
            echo "### 🔴 BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The build failed before tests could run." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "$BUILD_ERRORS" ]; then
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary><strong>Build Errors</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$BUILD_ERRORS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$TESTS" != "0" ] && [ "$TESTS" != "" ]; then
            # Header with counts
            if [ "$FAILED" = "0" ] && [ "$COMPLETE" != "true" ]; then
              echo "### ⚠️ NO TEST FAILED, BUT NOT EVERY TEST RAN" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$FAILED" = "0" ]; then
              echo "### ✅ ALL TESTS PASSED" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ $FAILED TEST(S) FAILED" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Quick stats line
            COVERAGE_DISPLAY=""
            if [ "$COVERAGE" != "N/A" ] && [ -n "$COVERAGE" ]; then
              COVERAGE_DISPLAY=" | 📈 $COVERAGE coverage"
            fi
            echo "**$TESTS tests** | **$PASSED passed** | **$FAILED failed** | **$SKIPPED skipped** | ⏱️ $DURATION | 📊 $PASS_RATE$COVERAGE_DISPLAY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Class breakdown table — collapsed by default. Auto-expand
            # if any class had failures (so triage detail is visible
            # without an extra click on red runs).
            if [ -n "$CLASS_SUMMARY" ]; then
              CLASS_COUNT=$(echo "$CLASS_SUMMARY" | wc -l | tr -d ' ')
              FAILED_CLASS_COUNT=$(echo "$CLASS_SUMMARY" | awk -F'|' '$4 != "0" { c++ } END { print c+0 }')
              if [ "$FAILED_CLASS_COUNT" -gt 0 ]; then
                SUMMARY_LABEL="<strong>Tests by Class</strong> — $CLASS_COUNT classes, <strong>$FAILED_CLASS_COUNT with failures</strong>"
                DETAILS_OPEN=" open"
              else
                SUMMARY_LABEL="<strong>Tests by Class</strong> — $CLASS_COUNT classes (click to expand)"
                DETAILS_OPEN=""
              fi
              echo "<details${DETAILS_OPEN}>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>$SUMMARY_LABEL</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Class | Tests | Passed | Failed | Duration |" >> $GITHUB_STEP_SUMMARY
              echo "|-------|-------|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
              echo "$CLASS_SUMMARY" | while IFS='|' read -r class total passed failed duration; do
                if [ "$failed" = "0" ]; then
                  echo "| ✅ $class | $total | $passed | $failed | $duration |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| ❌ $class | $total | $passed | **$failed** | $duration |" >> $GITHUB_STEP_SUMMARY
                fi
              done
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          else
            # 0 tests - check why
            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "### ✅ ALL TESTS PASSED" >> $GITHUB_STEP_SUMMARY
            elif [ "$BUILD_STATUS" = "failed" ] || [ -n "$BUILD_ERRORS" ]; then
              echo "### 🔴 BUILD FAILED - No tests ran" >> $GITHUB_STEP_SUMMARY
              if [ -n "$BUILD_ERRORS" ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><strong>Build Errors</strong></summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "$BUILD_ERRORS" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "### ❌ TESTS FAILED" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Failed tests
          FAILED_TESTS="${{ steps.parse_results.outputs.failed_tests }}"
          if [ -n "$FAILED_TESTS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><strong>Failed Tests</strong></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$FAILED_TESTS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Testing Coverage Breakdown
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Testing Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Unit test line coverage — testable = denominator excludes UI/lifecycle
          # files listed in scripts/coverage-exclude.json; total = every executable
          # line. We gate on testable; total is shown for continuity.
          if [ "$COVERAGE_STATUS" != "complete" ]; then
            echo "**Coverage: INCOMPLETE** — ${COVERAGE_INCOMPLETE:-the coverage step did not produce a report}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$COVERAGE" != "N/A" ] && [ -n "$COVERAGE" ]; then
            echo "**Unit Test Line Coverage (testable surfaces): $COVERAGE**" >> $GITHUB_STEP_SUMMARY
            if [ -n "$TOTAL_COVERAGE" ] && [ "$TOTAL_COVERAGE" != "N/A" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "_Total coverage incl. UI/lifecycle: $TOTAL_COVERAGE ($EXCLUDED_FILES files excluded from testable denominator — see \`scripts/coverage-exclude.json\`)_" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            # Packages are measured apart from the app line above, and the app
            # suite (iOS) and swift test (macOS) runs are not combined.
            if [ -n "$COVERAGE_PACKAGES" ]; then
              echo "| Package | Measured by | Covered / executable | Testable |" >> $GITHUB_STEP_SUMMARY
              echo "|---------|-------------|----------------------|----------|" >> $GITHUB_STEP_SUMMARY
              echo "$COVERAGE_PACKAGES" | while IFS='|' read -r scope name covered total pct; do
                if [ -n "$name" ]; then
                  echo "| $name | $scope | $covered / $total | $pct |" >> $GITHUB_STEP_SUMMARY
                fi
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # These paths are excluded from the ratio. They are NOT covered by any CI
          # job: E2E/chaos runs locally via scripts/verify-pr.sh --simdrive/--chaos.

          # Coverage context note
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Why two coverage numbers?** Testable coverage subtracts files that " >> $GITHUB_STEP_SUMMARY
          echo "> can't be exercised from xcodebuild — SwiftUI views, UIKit VCs, AppDelegate/SceneDelegate " >> $GITHUB_STEP_SUMMARY
          echo "> lifecycle (see \`scripts/coverage-exclude.json\`) — so raising it means more _testable_ " >> $GITHUB_STEP_SUMMARY
          echo "> logic is tested, not that we shipped less UI. Total coverage is kept for continuity. " >> $GITHUB_STEP_SUMMARY
          echo "> The excluded paths are NOT covered by any CI job. They are exercised only if a maintainer opts in locally (\`scripts/verify-pr.sh --simdrive --chaos\`), which needs a booted simulator and a QA harness that is not in this repo — so on a contributor's clone, and on every CI run, nothing exercises them." >> $GITHUB_STEP_SUMMARY
          
          # History/Trends
          if [ -n "$NEW_FAILURES" ] || [ -n "$FIXED_TESTS" ] || [ -n "$FLAKY_TESTS" ] || [ -n "$TEST_COUNT_CHANGE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📈 Trends" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "$TEST_COUNT_CHANGE" ]; then
              echo "Test count change: **$TEST_COUNT_CHANGE**" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ -n "$NEW_FAILURES" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>⚠️ <strong>New Failures</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$NEW_FAILURES" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ -n "$FIXED_TESTS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>✅ <strong>Fixed Tests</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$FIXED_TESTS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ -n "$FLAKY_TESTS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>⚡ <strong>Flaky Tests Detected</strong></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$FLAKY_TESTS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Snapshots
          SNAPSHOT_COUNT="${{ steps.snapshots.outputs.count }}"
          if [ "$SNAPSHOT_COUNT" != "0" ] && [ -n "$SNAPSHOT_COUNT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📸 Snapshot Failures: $SNAPSHOT_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "Download **snapshot-failures** artifact to view diff images" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Report Link and Artifacts
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          
          REPORT_URL="${{ steps.report_url.outputs.report_url }}"
          if [ -n "$REPORT_URL" ]; then
            echo "### 🔗 [View Interactive Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **test-report** | 📄 Markdown + HTML report |" >> $GITHUB_STEP_SUMMARY
          echo "| **test-data** | 📊 JSON data files |" >> $GITHUB_STEP_SUMMARY
          echo "| **test-results** | 🔍 Full xcresult (open in Xcode) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.snapshots.outputs.found }}" = "true" ]; then
            echo "| **snapshot-failures** | 🖼️ Visual diff images |" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Upload Test Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-report
          path: test-report/
          retention-days: 14
          if-no-files-found: ignore
          
      - name: Upload Test Data JSON
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-data
          path: |
            test-data.json
            coverage-data.json
          retention-days: 14
          if-no-files-found: ignore
          
      - name: Upload Snapshot Failures
        if: steps.snapshots.outputs.found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: snapshot-failures
          path: snapshot-failures/
          retention-days: 14
          if-no-files-found: ignore
          
      # `continue-on-error` because failing to ARCHIVE results is not the same
      # as failing tests, and the board must not say otherwise. This step uploads
      # the .xcresult bundle, which Xcode is still finalizing and which contains
      # filenames the artifact uploader trips over; it has failed with
      # `ENOENT ... stat '.../Data/data.0~...'` on four separate branches in two
      # days while the run's own tally read zero failures (PP-4988).
      #
      # The pass/fail gate is unaffected: `Fail if tests failed` keys on the test
      # STEP's outcome, so a genuine test failure still turns the board red. What
      # this stops is a green test run being reported as a failure because an
      # archive could not be saved — which trains everyone to ignore red, and is
      # how a broken commit gate shipped here once before.
      - name: Upload Test Results
        if: steps.find_results.outputs.found == 'true'
        continue-on-error: true
        id: upload_results
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: test-results
          path: ${{ steps.find_results.outputs.path }}
          retention-days: 14
          if-no-files-found: ignore

      # Make the distinct outcome visible without opening the log: the tests ran
      # and passed, but their archive could not be saved. Previously this was
      # indistinguishable from a test failure on the checks list.
      - name: Note if results could not be archived
        if: always() && steps.upload_results.outcome == 'failure'
        run: |
          echo "::warning title=Test results not archived::The tests ran and their result is reported above, but the .xcresult artifact could not be uploaded. This does NOT mean a test failed. See PP-4988."
          {
            echo "### ⚠️ Test results were not archived"
            echo
            echo "The suite ran and its pass/fail verdict stands. Only the downloadable"
            echo "\`.xcresult\` artifact failed to upload, so the interactive report and"
            echo "Xcode-openable bundle are missing for this run."
            echo
            echo "This is tracked as **PP-4988** and is not a test failure."
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Post PR Comment with Results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            
            const tests = '${{ steps.parse_results.outputs.tests }}';
            const passed = '${{ steps.parse_results.outputs.passed }}';
            const failed = '${{ steps.parse_results.outputs.failed }}';
            const skipped = '${{ steps.parse_results.outputs.skipped }}';
            const duration = '${{ steps.parse_results.outputs.duration }}';
            const passRate = '${{ steps.parse_results.outputs.pass_rate }}';
            const testOutcome = '${{ needs.test.result }}';
            const failedTests = `${{ steps.parse_results.outputs.failed_tests }}`;
            const classSummary = `${{ steps.parse_results.outputs.class_summary }}`;
            const snapshotCount = '${{ steps.snapshots.outputs.count }}';
            const coverage = '${{ steps.coverage.outputs.coverage_formatted }}';
            const totalCoverage = '${{ steps.coverage.outputs.total_coverage_formatted }}';
            const excludedFiles = '${{ steps.coverage.outputs.excluded_file_count }}';
            const coverageStatus = '${{ steps.coverage.outputs.coverage_status }}';
            const coverageIncomplete = `${{ steps.coverage.outputs.coverage_incomplete_reason }}`;
            const coveragePackages = `${{ steps.coverage.outputs.coverage_packages }}`;
            const newFailures = `${{ steps.history.outputs.new_failures }}`;
            const fixedTests = `${{ steps.history.outputs.fixed_tests }}`;
            const flakyTests = `${{ steps.history.outputs.flaky_tests }}`;
            const testCountChange = '${{ steps.history.outputs.test_count_change }}';
            const buildStatus = '${{ steps.parse_results.outputs.build_status }}';
            const buildErrors = `${{ steps.parse_results.outputs.build_errors }}`;
            const runnerFailures = `${{ steps.parse_results.outputs.runner_failures }}`;
            const complete = '${{ steps.completeness.outputs.complete }}' === 'true';
            const incompleteReason = `${{ steps.completeness.outputs.reason }}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const reportUrl = '${{ steps.report_url.outputs.report_url }}';
            
            let body = '## 🧪 Unit Test Results\n\n';
            
            // Add clickable report link at the top
            if (reportUrl) {
              body += `📊 **[View Full Interactive Report](${reportUrl})**\n\n`;
            }
            
            // Check for build failure first
            if (buildStatus === 'failed') {
              body += `### 🔴 BUILD FAILED\n\n`;
              body += `The build failed before tests could run.\n\n`;
              
              if (buildErrors && buildErrors.trim()) {
                body += `<details>\n<summary><strong>Build Errors</strong></summary>\n\n`;
                body += '```\n' + buildErrors.trim() + '\n```\n';
                body += `</details>\n\n`;
              }
            } else if (tests !== '0' && tests !== '') {
              // Status header
              if (failed === '0' && !complete) {
                body += `### ⚠️ NO TEST FAILED, BUT NOT EVERY TEST RAN\n\n`;
              } else if (failed === '0') {
                body += `### ✅ ALL TESTS PASSED\n\n`;
              } else {
                body += `### ❌ ${failed} TEST${failed === '1' ? '' : 'S'} FAILED\n\n`;
              }
              
              // Quick stats
              let coverageDisplay = '';
              if (coverage && coverage !== 'N/A' && coverage !== '') {
                coverageDisplay = ` | 📈 ${coverage} coverage`;
              }
              body += `**${tests} tests** | **${passed} passed** | **${failed} failed** | **${skipped} skipped** | ⏱️ ${duration} | 📊 ${passRate}${coverageDisplay}\n\n`;

              // A runner failure is not a test failure; name it as one, and say
              // when it cost tests, since coverage is then lower for that reason.
              if (!complete) {
                body += `**Not every test ran.** ${incompleteReason}\n\n`;
                body += `Coverage below is from the tests that did run; the floors were not compared.\n\n`;
              }
              if (runnerFailures && runnerFailures.trim()) {
                body += `<details open>\n<summary><strong>Runner failures (not test failures)</strong></summary>\n\n`;
                body += '```\n' + runnerFailures.trim() + '\n```\n';
                body += `A test runner that never connected or stopped responding. `;
                body += complete
                  ? `The tests it was given were relaunched and ran.\n`
                  : `The tests it was given did not all run.\n`;
                body += `</details>\n\n`;
              }
              
              // Full per-class matrix — ALWAYS collapsed, never dumped open
              // (pr-report-contract.md §1, decision-first). ~900 green rows are
              // noise a reviewer must not scroll past; failures are surfaced
              // separately below. Skipped column added so an all-skipped class
              // reconciles instead of rendering as a false-green `7|0|0`;
              // ⚠️ flags any row where passed+failed+skipped != total.
              if (classSummary && classSummary.trim()) {
                const classLines = classSummary.trim().split('\n').filter(l => l.split('|')[0]);
                const failedClasses = classLines.filter(l => (l.split('|')[3] || '0') !== '0').length;
                const summaryLabel = failedClasses > 0
                  ? `<strong>All ${classLines.length} classes</strong> — ${failedClasses} with failures (full matrix)`
                  : `<strong>All ${classLines.length} classes</strong> (full matrix — click to expand)`;
                body += `<details>\n<summary>${summaryLabel}</summary>\n\n`;
                body += `| Class | Tests | Passed | Failed | Skipped | Duration |\n`;
                body += `|-------|-------|--------|--------|---------|----------|\n`;
                classLines.forEach(line => {
                  // 6-field format (cls|total|pass|fail|skip|dur); tolerate the
                  // legacy 5-field (cls|total|pass|fail|dur) during rollout.
                  const parts = line.split('|');
                  const cls = parts[0];
                  const total = parts[1] || '0';
                  const pass = parts[2] || '0';
                  const fail = parts[3] || '0';
                  const hasSkip = parts.length >= 6;
                  const skip = hasSkip ? (parts[4] || '0') : '0';
                  const dur = hasSkip ? parts[5] : (parts[4] || '-');
                  const reconciles = (parseInt(pass) + parseInt(fail) + parseInt(skip)) === parseInt(total);
                  const icon = parseInt(fail) > 0 ? '❌' : (reconciles ? '✅' : '⚠️');
                  const failCell = fail === '0' ? fail : `**${fail}**`;
                  body += `| ${icon} ${cls} | ${total} | ${pass} | ${failCell} | ${skip} | ${dur} |\n`;
                });
                body += `\n`;
                if (reportUrl) {
                  body += `📊 Full interactive matrix: **[report](${reportUrl})**\n`;
                }
                body += `</details>\n\n`;
              }
            } else {
              if (testOutcome === 'success') {
                body += `### ✅ ALL TESTS PASSED\n\n`;
              } else if (buildErrors && buildErrors.trim()) {
                body += `### 🔴 BUILD FAILED - No tests ran\n\n`;
                body += `<details>\n<summary><strong>Build Errors</strong></summary>\n\n`;
                body += '```\n' + buildErrors.trim() + '\n```\n';
                body += `</details>\n\n`;
              } else {
                body += `### ❌ TESTS FAILED\n\n`;
              }
            }
            
            // Failing detail — OPEN when red so the reviewer lands on the
            // actionable rows, not the collapsed matrix (contract §1).
            if (failedTests && failedTests.trim()) {
              body += `<details open>\n<summary>❌ <strong>Failed tests</strong></summary>\n\n`;
              body += '```\n' + failedTests.trim() + '\n```\n';
              // Names only — parse-xcresult emits identifiers, not messages.
              // Inlining the failure message + first stack frame is a tracked
              // Obligation (pr-report-contract.md gap #3); until then, the
              // interactive report carries the detail.
              body += `\n_Names only — open the interactive report above for messages + stack frames._\n`;
              body += `</details>\n\n`;
            }
            
            // Testing Coverage Breakdown
            body += `### 📊 Testing Coverage Breakdown\n\n`;

            if (coverageStatus !== 'complete') {
              body += `**Coverage: INCOMPLETE** — ${coverageIncomplete || 'the coverage step did not produce a report'}\n\n`;
            }
            // Unit test line coverage — testable excludes UI/lifecycle per
            // scripts/coverage-exclude.json; we gate on testable.
            if (coverage && coverage !== 'N/A' && coverage !== '') {
              body += `**Unit Test Line Coverage (testable surfaces): ${coverage}**\n\n`;
              if (totalCoverage && totalCoverage !== 'N/A' && totalCoverage !== '') {
                body += `_Total coverage incl. UI/lifecycle: ${totalCoverage} (${excludedFiles} files excluded from testable denominator — see \`scripts/coverage-exclude.json\`)_\n\n`;
              }
              if (coveragePackages && coveragePackages.trim()) {
                body += `| Package | Measured by | Covered / executable | Testable |\n`;
                body += `|---------|-------------|----------------------|----------|\n`;
                coveragePackages.trim().split('\n').forEach(line => {
                  const [scope, name, covered, total, pct] = line.split('|');
                  if (name) {
                    body += `| ${name} | ${scope} | ${covered} / ${total} | ${pct} |\n`;
                  }
                });
                body += '\n';
              }
            }

            // These paths are excluded from the ratio and are NOT covered by any CI
            // job: E2E/chaos runs locally via scripts/verify-pr.sh --simdrive/--chaos.

            body += `> **Why two coverage numbers?** Testable coverage subtracts files that `;
            body += `can't be exercised from xcodebuild — SwiftUI views, UIKit VCs, lifecycle `;
            body += `(see \`scripts/coverage-exclude.json\`) — so raising it means more _testable_ logic is tested, `;
            body += `not that we shipped less UI. Total coverage is kept for continuity. `;
            body += `The excluded paths are **not covered by any CI job**. They are exercised only if a maintainer opts in locally (\`scripts/verify-pr.sh --simdrive --chaos\`), which needs a booted simulator and a QA harness that is not in this repo — so on a contributor's clone, and on every CI run, nothing exercises them.\n\n`;
            
            // What changed vs. base — the orchestrator's first question
            // (contract §1). Delta-or-silent: this whole section renders only
            // when the .test-history cache hits (populating deltas). When it's
            // empty the section is silent by design, not a green claim — the
            // develop cache-warm job that makes deltas reliable is a tracked
            // Obligation (pr-report-contract.md gap #4).
            if ((newFailures && newFailures.trim()) || (fixedTests && fixedTests.trim()) || (flakyTests && flakyTests.trim()) || testCountChange) {
              body += `### 📈 What changed vs. base\n\n`;

              if (testCountChange) {
                body += `Test count: **${testCountChange}**\n\n`;
              }

              if (newFailures && newFailures.trim()) {
                body += `<details open>\n<summary>⚠️ <strong>New failures</strong> — passing on base, failing on this branch</summary>\n\n`;
                body += '```\n' + newFailures.trim() + '\n```\n';
                body += `</details>\n\n`;
              }

              if (fixedTests && fixedTests.trim()) {
                body += `<details>\n<summary>✅ <strong>Fixed</strong> — failing on base, passing on this branch</summary>\n\n`;
                body += '```\n' + fixedTests.trim() + '\n```\n';
                body += `</details>\n\n`;
              }

              if (flakyTests && flakyTests.trim()) {
                body += `<details>\n<summary>⚡ <strong>Flaky</strong> — inconsistent across recent runs</summary>\n\n`;
                body += '```\n' + flakyTests.trim() + '\n```\n';
                body += `</details>\n\n`;
              }
            }
            
            // Snapshot failures
            if (snapshotCount && snapshotCount !== '0') {
              body += `### 📸 Snapshot Failures: ${snapshotCount}\n`;
              body += `Download the **snapshot-failures** artifact to view visual differences.\n\n`;
            }
            
            // Links + provenance. The counts above are produced by THIS CI run
            // parsing the xcresult — not author-attested (contract §2,§3).
            body += `---\n`;
            if (reportUrl) {
              body += `🔗 **[Interactive HTML Report](${reportUrl})** | `;
            }
            body += `**[CI Run Details](${runUrl})**\n\n`;
            body += `_Counts above were produced by this CI run's xcresult parse — reproduce via the run link._\n\n`;
            
            // Artifacts table
            body += `<details>\n<summary>📦 <strong>Downloadable Artifacts</strong></summary>\n\n`;
            body += `| Artifact | Description |\n`;
            body += `|----------|-------------|\n`;
            body += `| test-report | 📄 Markdown + HTML reports |\n`;
            body += `| test-data | 📊 JSON data for tooling |\n`;
            body += `| test-results | 🔍 Full xcresult (open in Xcode) |\n`;
            if (snapshotCount && snapshotCount !== '0') {
              body += `| snapshot-failures | 🖼️ Visual diff images |\n`;
            }
            body += `\n</details>`;
            
            // Find and update or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('🧪 Unit Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
          
  # Pages publishing clones the gh-pages branch, which took ~3.3 minutes of the
  # macOS job; it needs nothing from macOS, so it runs here.
  publish-report:
    needs: report
    if: always() && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-report
          path: test-report

      - name: Download report data
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-data
          path: .

      - name: Download snapshot viewer
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: snapshot-failures
          path: snapshot-failures

      - name: Deploy Report to GitHub Pages
        if: always()
        continue-on-error: true
        id: deploy_report
        run: |
          # Create report directory structure
          REPORT_DIR="test-reports/${{ github.run_number }}"
          mkdir -p "$REPORT_DIR"
          
          # Copy reports
          cp test-report/test-report.html "$REPORT_DIR/" 2>/dev/null || true
          cp test-report/TEST_RESULTS.md "$REPORT_DIR/" 2>/dev/null || true
          cp test-data.json "$REPORT_DIR/" 2>/dev/null || true
          cp coverage-data.json "$REPORT_DIR/" 2>/dev/null || true
          
          # Copy snapshot viewer if exists
          if [ -f "snapshot-failures/snapshot-viewer.html" ]; then
            cp snapshot-failures/snapshot-viewer.html "$REPORT_DIR/"
            cp snapshot-failures/*.png "$REPORT_DIR/" 2>/dev/null || true
          fi
          
          # Create index.html that redirects to the report
          cat > "$REPORT_DIR/index.html" << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=test-report.html">
            <title>Redirecting to Test Report</title>
          </head>
          <body>
            <p>Redirecting to <a href="test-report.html">Test Report</a>...</p>
          </body>
          </html>
          INDEXEOF
          
          # Create root index listing recent reports
          mkdir -p test-reports
          cat > test-reports/index.html << 'ROOTINDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Palace iOS Test Reports</title>
            <style>
              body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #0d1117; color: #f0f6fc; }
              h1 { color: #58a6ff; }
              a { color: #58a6ff; }
              .report-link { display: block; padding: 10px; margin: 5px 0; background: #161b22; border-radius: 6px; text-decoration: none; }
              .report-link:hover { background: #21262d; }
            </style>
          </head>
          <body>
            <h1>🧪 Palace iOS Test Reports</h1>
            <p>Recent test reports from CI runs:</p>
            <div id="reports"></div>
            <script>
              // This will be populated by the actual report links
              document.getElementById('reports').innerHTML = '<p>Browse to a specific run number: <code>/test-reports/{run-number}/</code></p>';
            </script>
          </body>
          </html>
          ROOTINDEXEOF
          
          # Output the report URL
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPORT_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/test-reports/${{ github.run_number }}/"
          echo "report_url=$REPORT_URL" >> $GITHUB_OUTPUT
          echo "Report will be available at: $REPORT_URL"
          
      - name: Publish to GitHub Pages
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-reports
          destination_dir: test-reports
          keep_files: true
          
      # Same principle as the artifact upload above: failing to POST a summary
      # comment is not a test failure. Seen reddening a board on
      # fix/pp-4971-rate-aware-time-remaining while the suite itself was green.