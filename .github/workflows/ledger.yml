# Ledger Analysis for Palace iOS
#
# This workflow runs ledger analysis on PRs using the `observe` command
# which outputs structured JSON for CI integration.
#
# Currently non-blocking (continue-on-error: true).
# See comments below for enabling gating.

name: Ledger Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    # Only run on code changes, not docs-only
    paths:
      - '**.swift'
      - '**.m'
      - '**.h'
      - 'tools/ledger/**'
      # The reporting pipeline runs on its own changes, so a PR that edits the
      # analysis or the comment rendering demonstrates the result instead of
      # merging unexercised. Both were silently broken for a month precisely
      # because nothing re-ran them.
      - '.github/workflows/ledger.yml'
      - 'scripts/ledger_scc.py'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      full_analysis:
        description: 'Run full analysis instead of diff'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Ledger Analysis
    runs-on: macos-latest
    # Non-blocking for initial dogfood cycle
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch full history for diff analysis
          fetch-depth: 0

      - name: Setup environment
        run: |
          # Ensure jq is available (usually pre-installed on macos-latest)
          which jq || brew install jq
          
          # Create directories
          mkdir -p tools/bin
          mkdir -p artifacts/ledger

      - name: Install ledger
        run: |
          # v0.9.7: monolith app-target indexing (real blast-radius on the app
          # target; sign-in path no longer false-LOW). See CodeAtlas
          # fix/monolith-target-indexing. Install URL redirects to SyncTek-LLC.
          curl -fsSL https://raw.githubusercontent.com/mauricecarrier7/ledger-dist/main/install.sh \
            | bash -s -- --version 0.9.7 --dir ./tools/bin
          
          # The 0.9.6 and 0.9.7 releases ship NO accesslint asset, and
          # install.sh's fallback URL 404s for both. Ledger then silently falls
          # back to an internal analyzer that scans a top-level `Sources/`
          # directory Palace does not have, with zero rules registered — so it
          # reported "0 accessibility issues" while reading 0 files. Fetch the
          # binary from v0.9.5, the last release that carries it.
          if [[ ! -x ./tools/bin/accesslint ]]; then
            echo "accesslint missing from the 0.9.7 payload — fetching the v0.9.5 asset"
            curl -fsSL -o ./tools/bin/accesslint \
              https://github.com/mauricecarrier7/ledger-dist/releases/download/v0.9.5/accesslint-macos-arm64 \
              && chmod +x ./tools/bin/accesslint \
              || echo "accesslint fetch FAILED"
          fi

          # Clear macOS quarantine attributes (fixes exit code 11)
          xattr -cr ./tools/bin/ 2>/dev/null || true
          
          echo "Installed versions:"
          ./tools/bin/ledger --version

          # Absence must not render as success. The previous form printed
          # "AccessLint installed" on the failure branch of `||`, i.e. it said
          # "installed" precisely when the binary was not there.
          if ./tools/bin/accesslint --version 2>/dev/null; then
            echo "accesslint_available=true" >> $GITHUB_ENV
          else
            echo "::warning title=AccessLint unavailable::No accesslint binary — the accessibility section will report 'not evaluated' rather than a pass."
            echo "accesslint_available=false" >> $GITHUB_ENV
          fi


      - name: Run analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Initialize ledger with iOS preset
          echo "Initializing ledger..."
          ./tools/bin/ledger init --platform ios --no-interactive
          
          # Use our pre-configured config with correct settings
          echo "Applying custom config..."
          cp tools/ledger/ledger-config.json .ledger/config.json
          
          # Build model before observe
          echo "Building model..."
          ./tools/bin/ledger update
          
          # Two domains are deliberately absent.
          #
          # `qa` (QAAtlas): the AI test-matching step cannot correlate our
          # XCTest methods to production functions and emits self-contradictory
          # metrics (e.g. `Functions with Tests: 0 / 2344` beside a
          # `Coverage Estimate: 44.9%`). The instrumented line coverage that
          # scripts/coverage-report.py derives from xccov is ground truth and
          # replaces the estimate. Re-add if upstream matching improves.
          #
          # `reach`: its analyzer reads a top-level `Sources/` directory. This
          # repo has none — its roots are the `componentRoots` in
          # tools/ledger/ledger-config.json — so it scanned 0 files on every
          # run and reported dead code it had never looked for. The config
          # exposes no source-root key, so it could not be pointed at the real
          # tree from here. Re-add when the analyzer honours componentRoots, or
          # when ledger grows a flag for the source root.
          DOMAINS="arch,a11y"
          
          # Run ledger observe for CI-friendly JSON output
          echo "Running ledger observe with domains: $DOMAINS"
          ./tools/bin/ledger observe \
            --domains $DOMAINS \
            --output artifacts/ledger/observe \
            2>&1 | tee artifacts/ledger/observe.log
          
          # Debug: Show what was generated
          echo "=== Generated files ==="
          find artifacts/ledger/observe -type f -name "*.json" 2>/dev/null | head -20 || echo "No JSON files found"
          
          # Debug: Show summary.json content if exists
          if [[ -f "artifacts/ledger/observe/latest/summary.json" ]]; then
            echo "=== summary.json structure ==="
            jq 'keys' artifacts/ledger/observe/latest/summary.json
            echo "=== QA section ==="
            jq '.qa // "QA section not found"' artifacts/ledger/observe/latest/summary.json | head -30
          else
            echo "⚠️ summary.json not found"
            ls -la artifacts/ledger/observe/ 2>/dev/null || echo "observe dir not found"
            ls -la artifacts/ledger/observe/latest/ 2>/dev/null || echo "latest dir not found"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ledger-analysis
          path: |
            artifacts/ledger/observe/
            artifacts/ledger/observe.log
            artifacts/ledger/diff/
            artifacts/ledger/logs/
          retention-days: 14

      - name: Parse analysis results
        if: always()
        id: parse
        run: |
          # Initialize defaults
          echo "components=0" >> $GITHUB_OUTPUT
          echo "cycles=0" >> $GITHUB_OUTPUT
          echo "scc_count=0" >> $GITHUB_OUTPUT
          echo "largest_scc=0" >> $GITHUB_OUTPUT
          echo "violations=0" >> $GITHUB_OUTPUT
          echo "hotspots=0" >> $GITHUB_OUTPUT
          echo "changed_files=0" >> $GITHUB_OUTPUT
          echo "arch_issues=0" >> $GITHUB_OUTPUT
          echo "a11y_issues=0" >> $GITHUB_OUTPUT
          echo "a11y_blocker=0" >> $GITHUB_OUTPUT
          echo "a11y_major=0" >> $GITHUB_OUTPUT
          echo "a11y_minor=0" >> $GITHUB_OUTPUT
          echo "a11y_info=0" >> $GITHUB_OUTPUT
          # Whether AccessLint actually ran. Drives "not evaluated" vs a pass,
          # so a missing binary can never render as a clean bill of health.
          echo "a11y_available=${accesslint_available:-false}" >> $GITHUB_OUTPUT
          
          OBSERVE_DIR="artifacts/ledger/observe/latest"
          
          # Parse from summary.json (primary source)
          # v0.8.3 uses short keys: arch, a11y
          if [[ -f "$OBSERVE_DIR/summary.json" ]]; then
            
            # Architecture metrics (v0.8.3 uses .arch)
            COMPONENTS=$(jq -r '.arch.components // 0' "$OBSERVE_DIR/summary.json")
            CYCLES=$(jq -r '.arch.cycles // 0' "$OBSERVE_DIR/summary.json")
            VIOLATIONS=$(jq -r '.arch.violations // 0' "$OBSERVE_DIR/summary.json")
            HOTSPOTS=$(jq -r '.arch.hotspots // 0' "$OBSERVE_DIR/summary.json")
            ARCH_ISSUES=$(jq -r '.arch.findings | length // 0' "$OBSERVE_DIR/summary.json")
            AVG_COUPLING=$(jq -r '.arch.averageCoupling // 0' "$OBSERVE_DIR/summary.json")
            echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
            echo "cycles=$CYCLES" >> $GITHUB_OUTPUT
            echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
            echo "hotspots=$HOTSPOTS" >> $GITHUB_OUTPUT
            echo "arch_issues=$ARCH_ISSUES" >> $GITHUB_OUTPUT
            echo "avg_coupling=$AVG_COUPLING" >> $GITHUB_OUTPUT
            
            # Accessibility metrics (v0.8.3 uses .a11y with findings array)
            # Count from findings array since totalCount may not exist
            A11Y_TOTAL=$(jq -r '.a11y.findings | length // 0' "$OBSERVE_DIR/summary.json")
            A11Y_BLOCKER=$(jq -r '[.a11y.findings[] | select(.severity == "blocker")] | length // 0' "$OBSERVE_DIR/summary.json")
            A11Y_MAJOR=$(jq -r '[.a11y.findings[] | select(.severity == "major")] | length // 0' "$OBSERVE_DIR/summary.json")
            A11Y_MINOR=$(jq -r '[.a11y.findings[] | select(.severity == "minor")] | length // 0' "$OBSERVE_DIR/summary.json")
            A11Y_INFO=$(jq -r '[.a11y.findings[] | select(.severity == "info")] | length // 0' "$OBSERVE_DIR/summary.json")
            echo "a11y_issues=$A11Y_TOTAL" >> $GITHUB_OUTPUT
            echo "a11y_blocker=$A11Y_BLOCKER" >> $GITHUB_OUTPUT
            echo "a11y_major=$A11Y_MAJOR" >> $GITHUB_OUTPUT
            echo "a11y_minor=$A11Y_MINOR" >> $GITHUB_OUTPUT
            echo "a11y_info=$A11Y_INFO" >> $GITHUB_OUTPUT
            
          fi
          # Generate detailed markdown for expandable sections
          
          # Accessibility: All issues sorted by severity
          if [[ -f "$OBSERVE_DIR/a11y/findings.json" ]]; then
            jq -r '.findings | sort_by({blocker:0,major:1,minor:2,info:3}[.severity] // 4)[:5][] | "- " + ({blocker:"🚨",major:"🔴",minor:"🟡",info:"🔵"}[.severity] // "⚪") + " **" + .title + "** - `" + (.file | split("/")[-1]) + ":" + (.line|tostring) + "`"' \
              "$OBSERVE_DIR/a11y/findings.json" 2>/dev/null > /tmp/a11y_top_issues.md || true
            
            # Full issue list for expandable section
            jq -r '.findings | sort_by({blocker:0,major:1,minor:2,info:3}[.severity] // 4)[] | "| " + ({blocker:"🚨",major:"🔴",minor:"🟡",info:"🔵"}[.severity] // "⚪") + " " + .severity + " | " + .title + " | `" + (.file | split("/")[-1]) + ":" + (.line|tostring) + "` | " + (.rule // "-") + " |"' \
              "$OBSERVE_DIR/a11y/findings.json" 2>/dev/null > /tmp/a11y_all_issues.md || true
          fi
          
          # Architecture: Cycle details.
          #
          # Ledger emits `.cycles` as an INTEGER and `.findings` as an empty
          # array; ALL detail lives in `.issues[]`. The previous extraction read
          # `.cycles[] | .components` and `.findings[] | .message`, both of which
          # error on the real shape — the errors went to /dev/null and every PR
          # comment silently printed "See full report for cycle details."
          #
          # ledger_scc.py additionally collapses the reported cycle PATHS into
          # the distinct cycles (strongly-connected components) they represent,
          # and discounts edges `tools/ledger/ledger-config.json` declares
          # structurally impossible. See scripts/ledger_scc.py for why the raw
          # path count cannot be trended.
          if [[ -f "$OBSERVE_DIR/arch/analysis.json" ]]; then
            python3 scripts/ledger_scc.py \
              --analysis "$OBSERVE_DIR/arch/analysis.json" \
              --config tools/ledger/ledger-config.json \
              --json /tmp/arch_scc.json \
              --markdown /tmp/arch_cycles.md || true

            if [[ -f /tmp/arch_scc.json ]]; then
              echo "scc_count=$(jq -r '.sccCount // 0' /tmp/arch_scc.json)" >> $GITHUB_OUTPUT
              echo "largest_scc=$(jq -r '.largestSccSize // 0' /tmp/arch_scc.json)" >> $GITHUB_OUTPUT
            fi

            # Non-cycle findings (layer violations, hotspots, orphans) — also
            # from `.issues[]`, so a violation is NAMED and not left as a bare
            # number the reader cannot act on (pr-report-contract.md gap #8).
            {
              jq -r '.issues[]? | select(.type != "dependency_cycle")
                     | "- **" + .type + "**: " + .description' \
                "$OBSERVE_DIR/arch/analysis.json" 2>/dev/null || true
              jq -r '.findings[]? | "- **" + .type + "**: " + .message' \
                "$OBSERVE_DIR/arch/analysis.json" 2>/dev/null || true
            } > /tmp/arch_findings.md || true
          fi
          
          # Parse diff summary for changed files count
          if [[ -f "artifacts/ledger/logs/diff-summary.md" ]]; then
            CHANGED=$(grep -oE "Changed files:\*\* [0-9]+" artifacts/ledger/logs/diff-summary.md | grep -oE "[0-9]+" || echo "0")
            echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Post summary
        if: always()
        run: |
          echo "## 🏗️ CodeAtlas Ledger Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show summary if exists
          if [[ -f "artifacts/ledger/observe/latest/report.md" ]]; then
            cat artifacts/ledger/observe/latest/report.md >> $GITHUB_STEP_SUMMARY
          elif [[ -f "artifacts/ledger/logs/diff-summary.md" ]]; then
            cat artifacts/ledger/logs/diff-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No summary generated. Check workflow logs." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available in the Actions tab." >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            
            // Helper: round floats to 2 decimal places
            const round2 = (val) => {
              const num = parseFloat(val);
              return isNaN(num) ? val : num.toFixed(2);
            };
            
            // Basic metrics
            const changedFiles = '${{ steps.parse.outputs.changed_files }}' || '0';
            const components = '${{ steps.parse.outputs.components }}' || '0';
            const cycles = '${{ steps.parse.outputs.cycles }}' || '0';
            // Distinct cycles (strongly-connected components), not cycle paths.
            // `cycles` above is the analyzer's raw path enumeration — see
            // scripts/ledger_scc.py for why it cannot be trended.
            const sccCount = '${{ steps.parse.outputs.scc_count }}' || '0';
            const largestScc = '${{ steps.parse.outputs.largest_scc }}' || '0';
            const violations = '${{ steps.parse.outputs.violations }}' || '0';
            const hotspots = '${{ steps.parse.outputs.hotspots }}' || '0';
            const avgCouplingRaw = '${{ steps.parse.outputs.avg_coupling }}' || '0';
            const avgCoupling = round2(avgCouplingRaw);
            const archIssues = '${{ steps.parse.outputs.arch_issues }}' || '0';
            
            // AccessLint detailed metrics
            const a11yIssues = '${{ steps.parse.outputs.a11y_issues }}' || '0';
            const a11yBlocker = '${{ steps.parse.outputs.a11y_blocker }}' || '0';
            const a11yMajor = '${{ steps.parse.outputs.a11y_major }}' || '0';
            const a11yMinor = '${{ steps.parse.outputs.a11y_minor }}' || '0';
            const a11yInfo = '${{ steps.parse.outputs.a11y_info }}' || '0';
            const a11yAvailable = '${{ steps.parse.outputs.a11y_available }}' === 'true';
            
            const totalIssues = parseInt(archIssues) + parseInt(a11yIssues);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            
            let body = '## 🏗️ Architecture and Accessibility\n\n';

            // The headline answers one question: is there anything here for the
            // author to do? Everything else is reference material and belongs
            // further down or behind a fold. A panel where every number shouts
            // equally is a panel nobody reads.
            const criticalA11y = parseInt(a11yBlocker) + parseInt(a11yMajor);
            const todo = [];
            if (criticalA11y > 0) {
              todo.push(`**${criticalA11y} accessibility ${criticalA11y === 1 ? 'issue' : 'issues'}** at major or blocker severity — see below`);
            }
            if (parseInt(archIssues) > 0) {
              todo.push(`**${archIssues} architecture ${parseInt(archIssues) === 1 ? 'finding' : 'findings'}** — see below`);
            }

            if (todo.length > 0) {
              body += '**Worth a look before merging:**\n\n';
              for (const t of todo) { body += `- ${t}\n`; }
              body += '\n';
            } else if (!a11yAvailable) {
              body += '**Nothing to act on from the architecture scan.** Accessibility was *not evaluated* this run — see below.\n\n';
            } else {
              body += '**Nothing to act on.** No major accessibility issues and no new architecture findings.\n\n';
            }

            // Said once, plainly, near the top: these numbers do not respond to
            // this PR. Readers who do not know that will hunt for a change they
            // caused and find a constant.
            body += '<sub>All figures below are **whole-repo, measured at this PR\'s head commit** — not a diff against the base. A number that looks alarming is usually the repo\'s standing baseline, not something this branch did.</sub>\n\n';
            
            // ═══════════════════════════════════════════════════════════════
            // ACCESSIBILITY SECTION (AccessLint)
            // ═══════════════════════════════════════════════════════════════
            body += '---\n';
            body += '### ♿ Accessibility\n\n';

            if (!a11yAvailable) {
              body += '⚠️ **Not evaluated.** The AccessLint binary was unavailable, so **no files were scanned**.\n\n';
              body += '<sub>This is not a pass. Zero findings here means zero files read.</sub>\n\n';
            } else if (parseInt(a11yIssues) === 0) {
              body += '✅ **No issues found** across the scanned Swift sources.\n\n';
            } else {
              // Lead with the only line most readers need: is any of this
              // blocking a VoiceOver user today? Severity detail follows.
              if (criticalA11y > 0) {
                body += `🔴 **${criticalA11y} ${criticalA11y === 1 ? 'issue needs' : 'issues need'} attention** — these block or seriously impede assistive-technology users.\n\n`;
              } else {
                body += `🟡 **${a11yIssues} ${parseInt(a11yIssues) === 1 ? 'issue' : 'issues'}, none blocking.** Worth fixing, safe to merge.\n\n`;
              }

              body += '| | Severity | Count | What it means for a patron |\n';
              body += '|---|----------|-------|---------------------------|\n';
              if (parseInt(a11yBlocker) > 0) body += `| 🚨 | Blocker | **${a11yBlocker}** | Cannot use the control at all with VoiceOver |\n`;
              if (parseInt(a11yMajor) > 0) body += `| 🔴 | Major | **${a11yMajor}** | Reaches it, but cannot tell what it is or does |\n`;
              if (parseInt(a11yMinor) > 0) body += `| 🟡 | Minor | ${a11yMinor} | Usable, but harder work than it should be |\n`;
              if (parseInt(a11yInfo) > 0) body += `| 🔵 | Info | ${a11yInfo} | Polish — no patron is blocked |\n`;
              body += `| | **Total** | **${a11yIssues}** | |\n\n`;
              
              // Top issues
              body += '**Top Issues:**\n';
              try {
                const topIssues = fs.readFileSync('/tmp/a11y_top_issues.md', 'utf8');
                if (topIssues.trim()) {
                  body += topIssues + '\n';
                } else {
                  body += `Found ${a11yIssues} issue(s). See details below.\n`;
                }
              } catch (e) {
                body += `Found ${a11yIssues} issue(s). See details below.\n`;
              }
              
              // Expandable full details
              body += '\n<details>\n<summary><strong>📋 View All Accessibility Issues</strong></summary>\n\n';
              body += '| Severity | Issue | Location | Rule |\n';
              body += '|----------|-------|----------|------|\n';
              try {
                const allIssues = fs.readFileSync('/tmp/a11y_all_issues.md', 'utf8');
                if (allIssues.trim()) {
                  body += allIssues;
                } else {
                  body += '| - | No detailed data available | - | - |\n';
                }
              } catch (e) {
                body += '| - | See full report artifact | - | - |\n';
              }
              body += '\n</details>\n\n';
            }
            
            // ═══════════════════════════════════════════════════════════════
            // ARCHITECTURE SECTION
            // ═══════════════════════════════════════════════════════════════
            body += '---\n';
            body += '### 🏛️ Architecture\n\n';

            // The headline metric is the tangle, because it is the one that
            // should FALL as the decomposition proceeds. Avg Coupling rises
            // when a package is extracted, so leading with it tells the reader
            // the opposite of the truth.
            if (largestScc !== '0') {
              body += `**Largest dependency tangle: ${largestScc} components** — ${sccCount} distinct ${sccCount === '1' ? 'cycle' : 'cycles'}.\n\n`;
              body += '<sub>This is the number to watch during the modularisation: it should fall as packages come out. Extracting a leaf without cutting a cycle leaves it unchanged.</sub>\n\n';
            } else {
              body += '**No dependency cycles.**\n\n';
            }

            body += '<details>\n<summary>All architecture metrics</summary>\n\n';
            body += '| Metric | Value | What it means |\n';
            body += '|--------|-------|---------------|\n';
            body += `| Components | ${components} | Modules and layers the analyser indexed |\n`;
            body += `| Dependency cycles | ${sccCount} | Distinct circular dependencies (A→B→C→A) |\n`;
            body += `| Largest cycle | ${largestScc === '0' ? '—' : largestScc + ' components'} | Components mutually tangled in the biggest one |\n`;
            body += `| Layer violations | ${violations} | Dependencies crossing an architectural boundary |\n`;
            body += `| Hotspots | ${hotspots} | Components with more than 5 dependents |\n`;
            body += `| Avg coupling | ${avgCoupling} | Dependency edges ÷ components |\n\n`;
            body += '**Two of these read the opposite way to how they sound:**\n\n';
            body += '- **Avg coupling rises when you extract a package.** Edges that were invisible inside the monolith become counted edges between named components. Same code, same real coupling, higher number. It is not a decomposition scoreboard.\n';
            body += '- **Hotspots counts dependents, not complexity.** A widely-used package adds one the moment it is extracted.\n\n';
            body += '</details>\n\n';

            // Honesty note: these are repo-BASELINE metrics, not diff deltas —
            // they read identically on most PRs. Don't misread a constant as
            // PR-caused. A true base-vs-head delta is a tracked Obligation
            // (pr-report-contract.md §2).
            if (changedFiles === '0') {
              body += `> ℹ️ These are **whole-repo** figures measured at this PR's head commit, not a diff against the base. Ledger has no per-PR delta: its \`--diff\` path is a stub and is not invoked. Compare against another PR's numbers to see movement.\n\n`;
            } else {
              body += `> ℹ️ Baseline metrics (whole-repo), not a diff delta. Watch for a value that *moves* vs. \`develop\`, not its absolute level.\n\n`;
            }

            if (parseInt(archIssues) === 0 && sccCount === '0' && violations === '0') {
              body += '✅ **Architecture looks healthy!**\n\n';
            } else {
              // Show issues summary
              if (parseInt(archIssues) > 0) {
                body += `⚠️ Found **${archIssues}** architectural issue(s).\n\n`;
              }
              // A layer violation with no issue count still gets NAMED, not left
              // as a bare number the reader can't act on (pr-report-contract.md
              // gap #8). Surfaces the same findings file below.
              if (parseInt(violations) > 0) {
                body += `⚠️ **${violations}** layer violation(s) — see **Architecture Findings** below for the offending dependency edge(s).\n\n`;
              }

              // Expandable: Dependency Cycles
              if (parseInt(sccCount) > 0) {
                body += `<details>\n<summary><strong>🔄 Dependency Cycles (${sccCount})</strong></summary>\n\n`;
                try {
                  const cyclesDetail = fs.readFileSync('/tmp/arch_cycles.md', 'utf8');
                  if (cyclesDetail.trim()) {
                    body += cyclesDetail;
                  } else {
                    body += 'See full report for cycle details.\n';
                  }
                } catch (e) {
                  body += 'See full report for cycle details.\n';
                }
                body += '\n</details>\n\n';
              }
              
              // Expandable: All Findings — open when a violation exists so the
              // offending edge is named, not just counted (gap #8).
              if (parseInt(archIssues) > 0 || parseInt(violations) > 0) {
                body += '<details>\n<summary><strong>📋 Architecture Findings</strong></summary>\n\n';
                try {
                  const findings = fs.readFileSync('/tmp/arch_findings.md', 'utf8');
                  if (findings.trim()) {
                    body += findings;
                  } else {
                    body += 'See full report for detailed findings.\n';
                  }
                } catch (e) {
                  body += 'See full report for detailed findings.\n';
                }
                body += '\n</details>\n\n';
              }
            }
            
            // ═══════════════════════════════════════════════════════════════
            // FOOTER
            // ═══════════════════════════════════════════════════════════════
            body += '---\n';
            body += `**Scanned:** whole repo at \`${process.env.GITHUB_SHA ? process.env.GITHUB_SHA.substring(0,9) : 'head'}\` · `;
            body += `**Accessibility:** ${a11yAvailable ? 'ran' : '**did not run**'} · `;
            body += `**Dead code / test coverage:** not analysed — see DOMAINS in this workflow\n\n`;
            body += `[Download the full report](${runUrl})\n\n`;
            body += '*Powered by [CodeAtlas Ledger](https://github.com/mauricecarrier7/ledger-dist)*\n';
            body += '*• Accessibility: [AccessLint](https://github.com/mauricecarrier7/AccessLint-Distribution)*';
            
            // Find/update existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('CodeAtlas Ledger Analysis')
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

