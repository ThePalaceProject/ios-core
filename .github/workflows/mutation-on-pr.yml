name: Mutation on PR

# Broader mutation-gate counterpart to mutation-gate.yml. Where mutation-gate
# is path-filtered to the curated critical-path list, this workflow runs on
# every PR to develop/release/*: it executes verify-pr.sh --mutation-only
# against the PR's diff so non-critical-path files also get a kill-rate
# verdict surfaced as a PR comment. Critical-path files still gate merge.
#
# verify-pr.sh --quick --mutation-only:
#   - skips build/test/lint/coverage/a11y/ledger (each is owned by its own
#     workflow — unit-testing.yml, ledger.yml, etc.)
#   - runs palace_mutate.py over each changed *.swift in production paths
#   - writes per-file JSON reports to .forgeos/mutation-reports/
#   - exits non-zero only when a critical-path file falls below the
#     50% kill-rate floor (advisory for non-critical paths)
#
# The mutation cache (.forgeos/mutation-cache/) is keyed by file SHA + test
# selection, so re-running on unchanged files is near-instant. Only files
# whose hash changed since the cache entry actually rebuild + retest.

on:
  pull_request:
    branches:
      - develop
      - 'release/*'

concurrency:
  group: mutation-on-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    runs-on: macos-26
    # palace_mutate runs xcodebuild test per mutant. Cache + --max-mutations 10
    # keeps cold runs to ~30-45 min; 75 min gives headroom for first-touch PRs
    # that miss the cache entirely.
    timeout-minutes: 75
    steps:
      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Checkout PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private DRM submodules require this token. Same pattern as
          # mutation-gate.yml + unit-testing.yml.
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}

      - name: Restore mutation cache
        uses: actions/cache@v4
        with:
          path: .forgeos/mutation-cache
          # Cache is content-addressed (file SHA + test selection are the
          # primary keys); the workflow-level key only needs to scope by
          # branch so two unrelated PRs don't clobber each other's writes.
          key: mutation-cache-${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            mutation-cache-${{ github.head_ref || github.ref_name }}-
            mutation-cache-develop-
            mutation-cache-

      - name: Boot iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          preferred = 'iPhone 16 Pro'
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'] == preferred and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run verify-pr.sh --quick --mutation-only
        id: mutation
        env:
          HARNESS_SESSION_SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          scripts/verify-pr.sh --quick --mutation-only \
            --report /tmp/mutation-verify-report.json
          echo "verify_exit=$?" >> "$GITHUB_OUTPUT"
          # Don't fail the step itself — the comment step needs to run
          # regardless so reviewers see WHY the gate flipped. The final
          # gate step below converts the saved exit code into job status.
          exit 0

      - name: Post kill-rate comment on PR
        # Always post: a clean run posts the "all green" table; a dirty run
        # posts the table showing exactly which file(s) blocked merge.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [[ -d .forgeos/mutation-reports ]]; then
            python3 scripts/post-mutation-pr-comment.py \
              --reports-dir .forgeos/mutation-reports \
              --pr "$PR_NUMBER" \
              --post
          else
            echo "No mutation reports produced — nothing to comment."
          fi

      - name: Gate on critical-path kill rate
        # verify-pr.sh already exits non-zero when a critical-path file
        # falls below the floor; mirror that into the job status so the
        # PR check turns red. Non-critical files stay advisory.
        if: always()
        run: |
          set -euo pipefail
          VERIFY_EXIT="${{ steps.mutation.outputs.verify_exit }}"
          if [[ "$VERIFY_EXIT" != "0" ]]; then
            echo "::error::verify-pr.sh --mutation-only exited $VERIFY_EXIT — critical-path mutation kill rate below threshold."
            exit "$VERIFY_EXIT"
          fi
          echo "All critical-path files meet the kill-rate floor."

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            .forgeos/mutation-reports/
            /tmp/mutation-verify-report.json
          if-no-files-found: ignore
          retention-days: 14
