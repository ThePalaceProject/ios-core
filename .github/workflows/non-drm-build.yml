name: NonDRM Build

# Runs on PRs that touch app sources, not just on demand.
#
# WHY. `Palace-noDRM` is the open-source target: it compiles WITHOUT
# `FEATURE_DRM_CONNECTOR`, so every symbol declared inside one of those blocks
# is invisible to it. PR CI builds only the DRM scheme, so a new file added to
# the noDRM Sources phase that references a DRM-gated symbol compiles fine in
# every check we run and breaks a target nobody built.
#
# That is not hypothetical. On 2026-09-10 review caught exactly this shape
# before merge — two new files in the noDRM Sources phase, zero `#if` lines,
# both calling `AdobeDRMService.splitClientToken`, which lives inside
# `#if FEATURE_DRM_CONNECTOR`. Nothing in PR CI could have failed on it. It was
# found by a human-equivalent reading the pbxproj, which is not a control.
#
# `paths` keeps the cost proportionate: this is a full macOS build, so it runs
# only when something it could plausibly break has changed. `workflow_dispatch`
# is retained for manual runs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Palace/**'
      - 'Palace.xcodeproj/project.pbxproj'
      - '.github/workflows/non-drm-build.yml'
jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify Xcode Version
        run: xcodebuild -version
      # Submodules and a token that can read them. The bare checkout this
      # replaces cloned no submodules, so the first PR run failed on
      # `Could not read from remote repository` for ios-tenprintcover,
      # mobile-bookmark-spec and readium-sdk — all private. Every other
      # workflow that builds this repo already passes CI_GITHUB_ACCESS_TOKEN;
      # this one did not, and being workflow_dispatch-only meant nobody found
      # out. A guard that cannot check out the code it guards is not a guard.
      - name: Checkout main repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.CI_GITHUB_ACCESS_TOKEN }}
      - name: Set up repo for nonDRM build
        run: exec ./scripts/setup-repo-nodrm.sh
        env:
          BUILD_CONTEXT: ci
      - name: Build 3rd party dependencies
        run: ./scripts/build-3rd-party-dependencies.sh --no-private
        env:
          BUILD_CONTEXT: ci
      # tee to a log so the @objc-witness-drift gate below can scan the build
      # warnings. `set -o pipefail` is set EXPLICITLY: GitHub's default bash does
      # NOT enable it, so `cmd | tee` would return tee's exit 0 and mask a
      # failing build as a green step.
      - name: Build Palace without DRM support
        shell: bash
        run: |
          set -o pipefail
          ./scripts/xcode-build-nodrm.sh 2>&1 | tee nodrm-build-output.log

      # PP-4895: the noDRM target is where the URLSession auth-challenge witness
      # drift was visible. Which target sees it is decided by ClangImporter
      # frontend-batch membership, so the DRM log this gate already scans in
      # unit-testing.yml is only one draw of that lottery — the same source was
      # clean there and drifted here. Scanning both logs is what closes it.
      - name: Guard against @objc witness drift (silent delegate skip)
        if: always()
        run: scripts/check-objc-witness-nearly-matches.sh nodrm-build-output.log
