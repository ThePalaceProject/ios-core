name: Jira Release Sync
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. 2.2.2)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to sync'
        required: true
        type: string
jobs:
  sync-to-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided"
            exit 1
          fi
          RELEASE_JSON=$(gh release view "$TAG" --json tagName,url,body)
          echo "tag=$(echo "$RELEASE_JSON" | jq -r .tagName)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$RELEASE_JSON" | jq -r .url)" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOFBODY"
            echo "$RELEASE_JSON" | jq -r .body
            echo "EOFBODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create Jira version
        id: create-version
        env:
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RELEASE_NAME: "iOS ${{ steps.release.outputs.tag }}"
        run: |
          echo "Creating Jira version: $RELEASE_NAME"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            --url "${JIRA_URL}/rest/api/3/version" \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg name "$RELEASE_NAME" '{
              name: $name,
              description: "Release created from GitHub build.",
              project: "PP",
              released: false
            }')")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          # 400 is acceptable here — usually means version already exists
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::Jira API returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Link GitHub release to Jira version
        env:
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RELEASE_NAME: "iOS ${{ steps.release.outputs.tag }}"
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          VERSION_ID=$(curl -s \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --url "${JIRA_URL}/rest/api/3/project/PP/versions" \
            | jq -r ".[] | select(.name == \"$RELEASE_NAME\") | .id")
          echo "Version ID: $VERSION_ID"
          curl -s --fail -X POST \
            --url "${JIRA_URL}/rest/api/3/version/$VERSION_ID/relatedwork" \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg title "GitHub Release Notes" --arg url "$RELEASE_URL" '{
              title: $title,
              url: $url,
              category: "release notes"
            }')" || echo "Warning: relatedwork link failed (may already exist)"

      - name: Update fixVersions on linked tickets
        env:
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RELEASE_NAME: "iOS ${{ steps.release.outputs.tag }}"
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          KEYS=$((echo "$RELEASE_BODY" | grep -oE "PP-[0-9]+" | sort -u) || echo "")
          if [ -z "$KEYS" ]; then
            echo "No Jira keys found in release body."
            exit 0
          fi
          echo "Found tickets: $KEYS"
          added=0; skipped=0; failed=0
          for KEY in $KEYS; do
            # Guard against release-notes over-inclusion (see
            # docs/architecture/release-merge-policy.md + the wall-failure entry):
            # ReleaseNotes.py collects every PP key mentioned in any commit since
            # the last tag, so a merge commit sweeps in tickets that already
            # shipped in an EARLIER iOS release. Stamping those with the new
            # fixVersion corrupts release reporting. Skip any ticket that already
            # carries a different "iOS *" fixVersion — it was attributed to an
            # earlier release and is a re-mention, not new work in this one.
            ISSUE_JSON=$(curl -s --fail \
              --url "${JIRA_URL}/rest/api/3/issue/$KEY?fields=fixVersions,status" \
              --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              --header 'Accept: application/json') || ISSUE_JSON=""
            EXISTING=$(printf '%s' "$ISSUE_JSON" | jq -r '.fields.fixVersions[]?.name' 2>/dev/null) || EXISTING=""
            PRIOR_IOS=$(printf '%s\n' "$EXISTING" | grep -E '^iOS ' | grep -vxF "$RELEASE_NAME" || true)
            if [ -n "$PRIOR_IOS" ]; then
              echo "Skipping $KEY — already shipped in: $(printf '%s' "$PRIOR_IOS" | tr '\n' ',' | sed 's/,$//')"
              skipped=$((skipped + 1))
              continue
            fi

            # Second over-inclusion class, which the fixVersion guard above
            # cannot see: a key that has NEVER shipped and was never worked in
            # this release either. Two ways it reaches the release body, both
            # observed in the 3.3.0 (502) run:
            #
            #   * an EPIC listed in a PR title beside its delivered children
            #     (PP-4086 "Implement App Rating Prompt for iOS" — To Do, while
            #     PP-4087..4091 were Done), and
            #   * a FOLLOW-UP ticket named in a commit body as deferred work
            #     ("Deferred: … separate ticket"). Eight of the ten offenders
            #     were this shape. House style asks commit bodies to record what
            #     was NOT done, so these mentions are correct and will keep
            #     appearing; the body cannot distinguish them from delivery.
            #
            # ReleaseNotes.py cannot tell a mention from an attribution — its
            # own header notes it falls back to branch name, body and commits
            # when a PR title carries no key. Jira can: work still in the To Do
            # category was not completed in this release, whatever the notes say.
            # Anything further along (In Progress, Code Review, Done) is kept —
            # PP-5118 shipped in 3.3.0 while sitting in Code Review, so gating
            # on "Done" would drop real work.
            STATUS_CAT=$(printf '%s' "$ISSUE_JSON" | jq -r '.fields.status.statusCategory.key // empty' 2>/dev/null) || STATUS_CAT=""
            if [ "$STATUS_CAT" = "new" ]; then
              STATUS_NAME=$(printf '%s' "$ISSUE_JSON" | jq -r '.fields.status.name // "To Do"' 2>/dev/null)
              echo "Skipping $KEY — status is '$STATUS_NAME' (not started; a mention, not delivery)"
              skipped=$((skipped + 1))
              continue
            fi
            # An unreadable status must not silently become a skip: absence of
            # evidence is not evidence of a mention. Fall through and tag, which
            # is the pre-existing behaviour and is correctable by hand.
            if [ -z "$STATUS_CAT" ]; then
              echo "Note: could not read status for $KEY — tagging anyway (verify manually)"
            fi
            echo "Adding $RELEASE_NAME to $KEY..."
            if curl -s --fail -X PUT \
              --url "${JIRA_URL}/rest/api/3/issue/$KEY" \
              --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg name "$RELEASE_NAME" '{
                update: { fixVersions: [{ add: { name: $name } }] }
              }')"; then
              added=$((added + 1))
            else
              echo "Warning: failed to update $KEY"
              failed=$((failed + 1))
            fi
          done
          echo "fixVersion sync summary: added=$added skipped(already-shipped)=$skipped failed=$failed"
