name: 'Checkout Adobe RMSDK'
description: 'Checkout Adobe RMSDK, caching relevant large files'

inputs:
  token:
    description: "Access token to use"
    required: true
  path:
    description: "Path where it should be checked out"
    required: false
    default: "./ios-drm-adeptconnector"
  ref:
    description: "Connector commit to check out (the record; see below)"
    required: false
    # These defaults are the connector record: repo, ref and generation.
    # CI checks out `ref`, scripts/bootstrap-drm.sh clones it, and
    # scripts/drm_connector.py check compares local connector trees with it.
    # No workflow passes these inputs; change the defaults here to change the
    # connector. `ref` is commit 7913158 on branch
    # feature/bytebooks-connector-20261104, the ByteBooks (Wipro 2.0) drop every
    # 3.4.1 build used. `generation` must equal AdobeConnectorGeneration.current;
    # testCurrentGenerationDescribesTheLinkedConnector checks that the linked
    # binaries report it. Update path:
    # docs/architecture/adobe-drm-connector-linking.md.
    default: "7913158fa6b04ef8387a0b3bf32454bd795284fb"
  generation:
    description: "AdobeConnectorGeneration of the connector at ref"
    required: false
    default: "2"
  repo:
    description: "Repository to checkout"
    required: false
    default: "ThePalaceProject/ios-drm-adeptconnector"

runs:
  using: "composite"
  steps:
    - name: Checkout Adobe RMSDK
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ${{ inputs.repo }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        ref: ${{ inputs.ref }}

    - name: Verify Adobe RMSDK revision
      working-directory: ${{ inputs.path }}
      shell: bash
      env:
        CONNECTOR_REPO: ${{ inputs.repo }}
        CONNECTOR_SHA: ${{ inputs.ref }}
        CONNECTOR_GENERATION: ${{ inputs.generation }}
      run: |
        actual=$(git rev-parse HEAD)
        echo "DRM connector $CONNECTOR_REPO at $actual (generation $CONNECTOR_GENERATION)"
        test "$actual" = "$CONNECTOR_SHA" || {
          echo "::error::Checked out $actual, but the connector record names $CONNECTOR_SHA."
          exit 1
        }

    # LFS Caching strategy taken from: https://github.com/actions/checkout/issues/165#issuecomment-2776048200
    - name: Create Adobe RMSDK Git LFS file list
      run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt
      working-directory: ${{ inputs.path }}
      shell: bash

    - name: Restore Adobe RMSDK Git LFS object cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}/.git/lfs
        key: ${{ runner.os }}-rmsdk-lfsdata-v1-${{ hashFiles(format('{0}/.git/lfs-hashes.txt', inputs.path)) }}
        restore-keys: |
          ${{ runner.os }}-rmsdk-lfsdata-v1-
          ${{ runner.os }}-rmsdk-lfsdata

    - name: Fetch any needed Adobe RMSDK Git LFS objects and prune extraneous ones
      run: git lfs fetch --prune
      working-directory: ${{ inputs.path }}
      shell: bash

    - name: Check out Adobe RMSDK Git LFS content
      run: git lfs checkout
      working-directory: ${{ inputs.path }}
      shell: bash
