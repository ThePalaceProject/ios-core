name: reader-open-and-exit
description: |
  Open a borrowed EPUB in the Readium reader, verify page renders, exit
  back to the book detail / catalog. Exercises:
  - E1 EPUB reading (DRM-free path on Palace Bookshelf)
  - Reader nav-bar reveal (single-tap shows back/settings buttons)
  - Reader exit (back button without exiting the entire app)

status: PARTIAL_CAPTURE
captured_so_far: |
  Reader OPENS reliably on candidate (verified 2026-04-29 — Page 1 of 497
  rendered for 'A Night in Acadie'). Reader EXIT could not be cleanly
  captured because the back button tap on the candidate build caused a
  full app exit (see SIMDRIVE_DOGFOOD_2026_04_29.md P1 #3). Need either:
    - simdrive v0.1.0a2 with the xctest-runner attachment fix, OR
    - a workaround using xcrun simctl uri to navigate without back-tap, OR
    - manual capture from a tester driving via screen-share.

steps:
  - id: 01-from-mybooks
    setup: "User has at least one borrowed EPUB; on My Books tab."
    expects:
      contains_text: ["Read", "Remove"]

  - id: 02-tap-read
    action: "tap text='Read'"
    expects:
      contains_text: ["Page 1 of"]                  # Readium WKWebView is invisible to AX,
                                                    # but the page-counter at the bottom IS visible
      no_text: ["My Books", "Catalog", "Settings"]  # tab bar hidden in reader

  - id: 03-reveal-nav-bar
    action: "tap center of screen (x=600, y=1300)"
    expects:
      contains_text: ["< Back"]                     # nav-bar reveal pattern
      contains_text: ["TT"]                          # font/visual settings icon

  - id: 04-page-turn
    action: "tap right edge of screen (x=1100, y=1300) — Readium tap-zone for forward"
    expects:
      contains_text: ["Page 2 of"]                  # advanced one page

  - id: 05-exit-reader
    action: "tap text='< Back'"
    expects:
      contains_text: ["Read", "Remove"]              # back to book detail
      no_text: ["Page 1 of", "Page 2 of"]            # reader dismissed
    blocked_on_candidate_by: |
      Tap on '< Back' in reader nav-bar caused full app exit on candidate
      build (Phase 6.5/6.6/SPM head). PalaceTests.xctest probe error
      preceded the exit. Baseline release/3.0.0 does NOT exhibit this.
      Worth investigating as a real candidate-side scene-lifecycle issue.

mutation_targets:
  - file: Palace/Reader2/UI/TPPEPUBViewController.swift
    rationale: |
      Reader open path. A mutation that fails to instantiate the WKWebView
      or fails to load the EPUB locator would prevent 'Page 1 of' from
      appearing. Asserted in step 02.
  - file: Palace/Reader2/UI/TPPBaseReaderViewController.swift
    rationale: |
      Nav-bar reveal logic — the single-tap-shows-controls pattern. A
      mutation that breaks this leaves the reader unreachable for exit.
      Asserted in step 03.
  - file: Palace/Reader2/UI/KeyboardNavigationHandler.swift
    rationale: |
      PP-3594 keyboard nav. Not directly tested in this flow but adjacent.
      Listed as a future expansion target.
