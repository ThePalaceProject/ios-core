scenario:
  id: dark-mode
  name: "Dark Mode"
  description: "Verify the app adapts its UI correctly when the system appearance is toggled to dark mode. Use ios_set_appearance MCP tool to toggle."
  tags: [tier2, ios, appearance, UI-001, A11Y-002, THEME-001]

  personas:
    - ref: ios_tester
      role: primary

  # UNBLOCKED: ios_set_appearance tool is available in SpecterQA v6.0+.
  # In direct mode, use ios_simctl with 'ui appearance dark/light' as fallback.

  steps:
    - id: capture_light_mode_baseline
      description: "Launch app in Light Mode and capture baseline"
      goal: >
        Launch the Palace app in Light Mode (default). Confirm the Catalog screen
        loads with book lanes visible. Observe the light color scheme: light/white
        backgrounds with dark text. Navigate to the Settings tab to verify it also
        uses light mode styling.
      checkpoint: light_mode_baseline_captured
      max_iterations: 15

    - id: toggle_to_dark_mode
      description: "Toggle simulator to Dark Mode and verify UI adapts"
      goal: >
        Use the ios_set_appearance tool to switch to Dark Mode (or run
        'xcrun simctl ui <device> appearance dark' if available). Wait for the UI
        to update. Confirm the Settings screen background changes to dark/black
        colors and text changes to light/white. The tab bar should also adapt.
      checkpoint: dark_mode_applied
      max_iterations: 15

    - id: verify_catalog_dark_mode
      description: "Navigate to Catalog tab and verify dark mode appearance"
      goal: >
        Tap the Catalog tab and confirm the catalog adapts to dark mode: navigation
        bar uses dark colors, lane titles use light text, and book covers remain
        visible against the dark background. No UI elements should be invisible
        or unreadable.
      checkpoint: catalog_dark_mode_correct
      max_iterations: 10

    - id: restore_light_mode
      description: "Toggle back to Light Mode and verify restoration"
      goal: >
        Toggle the simulator appearance back to Light Mode. Confirm the Catalog
        screen returns to light colors. No error alerts should have appeared
        during the entire appearance toggle cycle.
      checkpoint: light_mode_restored
      max_iterations: 10
