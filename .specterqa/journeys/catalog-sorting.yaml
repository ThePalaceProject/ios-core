scenario:
  id: catalog-sorting
  name: "Catalog Sorting and Filtering"
  description: "Verify catalog subcategory sorting (Author, Recently Added, Title) and availability filtering."
  tags: [tier2, ios, catalog, CAT-006, CAT-007, CAT-008]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: open_subcategory
      description: "Launch app and open a catalog subcategory"
      goal: >
        Launch the Palace app on Palace Bookshelf. Wait for the Catalog to load.
        Find a lane with a 'More' button (e.g., 'DPLA Publications', 'Fiction', or
        any lane with a disclosure arrow). Tap the 'More' button to open the full
        subcategory view. Confirm a list or grid of books appears with sorting
        controls visible.
      checkpoint: subcategory_opened
      max_iterations: 15

    - id: verify_sort_options
      description: "Verify all sorting options are available"
      goal: >
        Look for a sort button or control (often labeled 'Title', 'Author', or with
        a sort icon). Tap it to reveal available sort options. Confirm that sorting
        options include at least 'Author', 'Recently Added', and 'Title'. The current
        sort order should be indicated (e.g., highlighted or checked).
      checkpoint: sort_options_visible
      max_iterations: 10

    - id: sort_by_title
      description: "Sort books by Title and verify ordering"
      goal: >
        Select 'Title' as the sort option. Wait for the list to update. Confirm
        the books are now sorted alphabetically by title — the first few book titles
        should be in A-Z order. The sort control should indicate Title is active.
      checkpoint: sorted_by_title
      max_iterations: 10

    - id: sort_by_author
      description: "Sort books by Author and verify ordering"
      goal: >
        Select 'Author' as the sort option. Wait for the list to update. Confirm
        the books are now sorted by author name. The sort control should indicate
        Author is active. The ordering should be different from the Title sort.
      checkpoint: sorted_by_author
      max_iterations: 10

    - id: navigate_back
      description: "Return to the catalog main screen"
      goal: >
        Tap the back button to return to the main catalog screen. Confirm the
        catalog lanes are still displayed and no error alerts appeared during
        the sorting operations.
      checkpoint: catalog_restored
      max_iterations: 10
