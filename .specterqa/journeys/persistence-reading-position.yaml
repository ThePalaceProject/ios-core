# Reading position persistence across app relaunch. Covers P1, P2.
scenario:
  id: persistence-reading-position
  name: "Reading Position Persists Across Relaunch"
  description: "Verify that EPUB reading position and bookmarks survive an app relaunch."
  tags: [tier2, ios, persistence, BOOK-006]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the Catalog on A1QA"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select "A1QA Test Library" (use the search field if it
        isn't visible in the initial list). Wait for the Catalog screen on
        A1QA to appear before proceeding.
      checkpoint: app_ready_on_a1qa
      max_iterations: 10

    - id: sign_in
      description: "Sign in to A1QA Test Library"
      goal: >
        Open Settings → Libraries → A1QA Test Library (or tap "Sign In" on a
        catalog row that requires auth). Enter barcode and PIN from
        ~/.specterqa/credentials/a1qa-test.env (A1QA_BARCODE, A1QA_PIN).
        Submit and wait for the authenticated state (signed-in indicator
        shown, My Books / Holds populate).
      checkpoint: user_authenticated
      max_iterations: 10

    - id: open_epub
      description: "Open a borrowed EPUB and advance to a non-first page"
      goal: >
        Navigate to My Books. If no books are borrowed, borrow one from the
        Catalog first. Open an EPUB book. Swipe or tap to advance at least
        3-4 pages past the beginning. Note the current page number or chapter
        heading visible on screen.
      checkpoint: reading_position_noted
      max_iterations: 20

    - id: close_reader
      description: "Close the reader and return to My Books"
      goal: >
        Close the EPUB reader by navigating back (back button or swipe-back
        gesture). Return to the My Books screen.
      checkpoint: reader_closed
      max_iterations: 10

    - id: reopen_book
      description: "Reopen the same book"
      goal: >
        Tap the same book in My Books to reopen it. Verify the reader opens
        to the same page or chapter that was noted in step 1, not the
        beginning of the book. The reading position should have persisted.
      checkpoint: position_restored
      max_iterations: 15

    - id: teardown_sign_out
      description: "Sign out of A1QA to release the DRM device activation"
      goal: >
        After the journey body is complete, navigate Settings → Libraries →
        A1QA Test Library and tap "Sign Out". Confirm in any presented alert.
        Verify the user is no longer authenticated. This step is required at
        the end of every authenticated journey so the test account does not
        accumulate Adobe/ADEPT device activations (they are limited per user).
      checkpoint: signed_out
      max_iterations: 8
