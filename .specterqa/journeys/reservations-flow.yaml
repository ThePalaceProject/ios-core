scenario:
  id: reservations-flow
  name: "Reservations Flow"
  description: "Verify the Reservations tab displays correctly and handles holds. Note: placing a real hold requires an authenticated library with holdable content."
  tags: [tier2, ios, reservations, RES-001, RES-002, RES-003]

  # NOTE: Palace Bookshelf books are free and borrowable instantly (no holds).
  # To test actual reservation placement, switch to a library that supports
  # holds (e.g., Lyrasis Reads with credentials). This journey tests the
  # Reservations tab UI and empty state with Palace Bookshelf.

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: verify_reservations_empty
      description: "Navigate to Reservations tab and verify empty state"
      goal: >
        Launch the Palace app and wait for the Catalog to load. Tap the
        'Reservations' tab in the bottom tab bar. Confirm the Reservations
        screen opens with an empty state message (something about reserving
        books from the catalog). No error alerts should appear.
      checkpoint: reservations_empty_state
      max_iterations: 15

    - id: verify_empty_message_content
      description: "Verify the empty state message is helpful"
      goal: >
        On the empty Reservations screen, confirm the message explains what
        reservations are and guides the user to the catalog. The tab bar
        should remain visible. There should be no loading spinners stuck
        on screen and no error states.
      checkpoint: helpful_empty_message
      max_iterations: 10

    - id: navigate_to_catalog_and_back
      description: "Switch to Catalog and back to Reservations"
      goal: >
        Tap the 'Catalog' tab, confirm the catalog loads with book lanes.
        Then tap back to the 'Reservations' tab. Confirm the Reservations
        screen reappears in the same state (empty). This verifies tab
        state is preserved across switches. No errors should appear.
      checkpoint: tab_state_preserved
      max_iterations: 10
