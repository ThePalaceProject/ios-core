scenario:
  id: feed-refresh
  name: "Catalog Pull-to-Refresh"
  description: "Verify pull-to-refresh on the Catalog reloads content and preserves UI structure."
  tags: [navigation, ios, refresh]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: pull_to_refresh
      description: "Swipe down on Catalog to trigger pull-to-refresh"
      goal: >
        Perform a downward swipe on the Catalog screen. Verify the navigation chrome
        (Switch Library, Search Catalog) and filter tabs (All/Ebooks/Audiobooks)
        remain visible after the refresh completes.
