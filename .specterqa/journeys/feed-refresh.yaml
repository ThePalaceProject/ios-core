scenario:
  id: feed-refresh
  name: "Catalog Pull-to-Refresh"
  description: "Verify pull-to-refresh on the Catalog reloads content and preserves UI structure."
  tags: [navigation, ios, refresh]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the catalog"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select any listed library (e.g. "Palace Bookshelf" or
        "Allin Township Library"). Wait for the Catalog screen to appear
        with at least one lane of book covers before proceeding.
      checkpoint: app_ready
      max_iterations: 10

    - id: pull_to_refresh
      description: "Swipe down on Catalog to trigger pull-to-refresh"
      goal: >
        Perform a downward swipe on the Catalog screen. Verify the navigation chrome
        (Switch Library, Search Catalog) and filter tabs (All/Ebooks/Audiobooks)
        remain visible after the refresh completes.
