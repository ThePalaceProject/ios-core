# Sign out + verify state cleanup. Companion to sign-in-basic.yaml.
scenario:
  id: sign-out
  name: "Sign Out and State Cleanup"
  description: "Verify a signed-in user can sign out, the auth state is cleared, and protected resources are no longer accessible without re-auth."
  tags: [tier1, ios, auth, AUTH-002]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: open_account_settings
      description: "Open Settings and the active library account"
      goal: >
        Tap the 'Settings' tab. Find the currently signed-in library row (it should
        show user info or a 'Sign Out' button). Tap it to open the account detail.
        Confirm a 'Sign Out' button is visible.
      checkpoint: account_detail_open
      max_iterations: 15
      # REQUIRES: user already signed in (run sign-in-basic.yaml first if needed).

    - id: tap_sign_out
      description: "Tap Sign Out and confirm any dialog"
      goal: >
        Tap 'Sign Out'. If a confirmation dialog appears (e.g., 'Are you sure?
        Your downloaded books may be removed'), confirm it. Wait for the action
        to complete.
      checkpoint: sign_out_completed
      max_iterations: 15

    - id: verify_signed_out_state
      description: "Verify the user is signed out"
      goal: >
        Confirm the 'Sign Out' button is replaced by 'Sign In' on the account
        screen. Navigate to My Books — it should show the empty state (any
        previously borrowed books for this account should be gone). Navigate to
        the Catalog — public catalog content may still load, but any 'Borrow'
        action should now prompt for sign-in instead of borrowing immediately.
      checkpoint: signed_out_state_clean
      max_iterations: 20
