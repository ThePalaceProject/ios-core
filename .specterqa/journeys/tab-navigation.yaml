scenario:
  id: tab-navigation
  name: "Tab Navigation"
  description: "Verify all four tabs can be selected and each loads its respective screen correctly."
  tags: [smoke, ios, navigation, NAV-001, NAV-002, NAV-003, NAV-004]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the catalog"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select any listed library (e.g. "Palace Bookshelf" or
        "Allin Township Library"). Wait for the Catalog screen to appear
        with at least one lane of book covers before proceeding.
      checkpoint: app_ready
      max_iterations: 10

    - id: launch_on_catalog
      description: "Launch app and confirm Catalog tab is active"
      goal: >
        Launch the Palace app. Confirm it opens on the Catalog tab with book lanes
        visible and the Catalog tab highlighted in the tab bar.
      checkpoint: catalog_tab_active
      max_iterations: 15

    - id: navigate_to_my_books
      description: "Tap My Books tab and verify it loads"
      goal: >
        Tap the 'My Books' tab in the bottom tab bar. Confirm the My Books screen
        appears with a 'My Books' navigation title. The screen should show either
        an empty state message or a list of books.
      checkpoint: my_books_screen_visible
      max_iterations: 10

    - id: navigate_to_reservations
      description: "Tap Reservations tab and verify it loads"
      goal: >
        Tap the 'Reservations' tab in the bottom tab bar. Confirm the Reservations
        screen appears with its navigation bar. The screen should show either an
        empty state or a list of held items.
      checkpoint: reservations_screen_visible
      max_iterations: 10

    - id: navigate_to_settings
      description: "Tap Settings tab and verify it loads"
      goal: >
        Tap the 'Settings' tab in the bottom tab bar. Confirm the Settings screen
        appears showing account information, library configuration, and app info options.
      checkpoint: settings_screen_visible
      max_iterations: 10

    - id: return_to_catalog
      description: "Return to Catalog tab and confirm round-trip"
      goal: >
        Tap the 'Catalog' tab in the bottom tab bar. Confirm the Catalog screen
        reappears with book lanes still loaded. Verify no error alerts appeared
        during the entire tab navigation cycle.
      checkpoint: catalog_restored_no_errors
      max_iterations: 10
