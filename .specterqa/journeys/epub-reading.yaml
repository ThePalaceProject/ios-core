scenario:
  id: epub-reading
  name: "EPUB Reading"
  description: "Verify EPUB reader: borrow a book, open reader, navigate pages, add/delete bookmarks, use Table of Contents, and resume reading position."
  tags: [tier2, ios, reader, EPUB-001, EPUB-002, EPUB-003, EPUB-004]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: borrow_and_open_epub
      description: "Search for a book, borrow it, and open the EPUB reader"
      goal: >
        On the Catalog screen (A1QA Test Library), find an ebook in the
        'Accessible EPUB Test' lane. Tap on a book (e.g., 'Fundamental Accessibility
        Tests: Basic Functionality'). On the book detail screen, tap 'Borrow'. Once
        borrowed, tap the 'Read' button. Confirm the EPUB reader screen opens showing
        book content (text on a page).
      checkpoint: epub_reader_opened
      max_iterations: 25

    - id: navigate_pages
      description: "Navigate forward and backward through pages"
      goal: >
        In the EPUB reader, swipe left or tap the right edge of the screen to advance
        to the next page. Do this 3-5 times. Confirm the page content changes each time.
        Then swipe right or tap the left edge to go back one page. Confirm the previous
        page content reappears. The reader should respond smoothly without errors.
      checkpoint: page_navigation_works
      max_iterations: 15

    - id: add_bookmark
      description: "Add a bookmark and verify it appears"
      goal: >
        Tap the center of the reader screen to reveal the navigation bar/toolbar.
        Look for a bookmark icon (ribbon or flag) and tap it to add a bookmark on
        the current page. The bookmark icon should change state (filled or highlighted)
        to indicate the page is bookmarked. If a TOC/bookmarks panel exists, open it
        and verify the bookmark appears in the bookmarks list.
      checkpoint: bookmark_added
      max_iterations: 15

    - id: open_table_of_contents
      description: "Open the Table of Contents and navigate to a chapter"
      goal: >
        Tap the center of the reader to show the toolbar. Look for a TOC button
        (list icon or 'Contents'). Tap it to open the Table of Contents. Confirm
        a list of chapters is displayed. Tap on a chapter (not the first one).
        Confirm the reader jumps to that chapter's content.
      checkpoint: toc_navigation_works
      max_iterations: 15

    - id: resume_reading_position
      description: "Leave the reader and verify reading position is saved"
      goal: >
        Note the current page or chapter. Navigate back from the reader to the book
        detail screen (tap Back or use the navigation gesture). Then tap 'Read' again
        to reopen the book. Confirm the reader opens at the same position (same page
        or chapter) where you left off, not at the beginning.
      checkpoint: reading_position_saved
      max_iterations: 15

    - id: return_book
      description: "Return the borrowed book"
      goal: >
        Navigate back from the reader to the book detail screen. Look for a 'Return'
        or 'Delete' button and tap it. Confirm any dialog that appears. Navigate to
        My Books and verify the book is no longer listed. The app should be stable
        with no errors.
      checkpoint: book_returned
      max_iterations: 15
