scenario:
  id: switch-library
  name: "Switch Library"
  description: "Verify the library switcher in the nav bar works correctly, switching between configured libraries."
  tags: [tier1, ios, navigation, LIB-001, LIB-005]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: launch_and_verify_current_library
      description: "Launch app and note the current library"
      goal: >
        Launch the Palace app and wait for the Catalog to load. Note the current
        library name displayed in the navigation bar (e.g., 'Palace Bookshelf' or
        another library name). Confirm the catalog content is loaded.
      checkpoint: current_library_noted
      max_iterations: 15

    - id: open_library_switcher
      description: "Tap the Switch Library button"
      goal: >
        Tap the 'Switch Library' button (hamburger/library icon) in the top-left
        of the navigation bar. Confirm an action sheet or popover appears showing
        available libraries and an 'Add Library' option. At least two libraries
        should be listed.
      checkpoint: library_switcher_open
      max_iterations: 10

    - id: switch_to_different_library
      description: "Select a different library"
      goal: >
        Tap on a library that is different from the currently active one. Confirm
        the switcher dismisses and the catalog reloads with the new library's
        content. The navigation bar should update to show the new library name.
        Wait for content to load (book lanes or an error state).
      checkpoint: library_switched
      max_iterations: 20

    - id: switch_back
      description: "Switch back to the original library"
      goal: >
        Open the library switcher again and tap the original library to switch back.
        Confirm the catalog reloads with the original library's content and the
        navigation bar shows the original library name. No error alerts should
        be present.
      checkpoint: original_library_restored
      max_iterations: 20
