scenario:
  id: multi-format-borrow
  name: "Multi-Format Borrow and Return"
  description: "Verify borrowing and returning multiple book formats (ebook and PDF) in a single session, confirming My Books tracks them correctly."
  tags: [tier2, ios, books, BOOK-009, BOOK-010, BOOK-011]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: borrow_first_book
      description: "Search for and borrow an ebook"
      goal: >
        On the Catalog screen (Palace Bookshelf), search for a book. Tap
        on the first result, then tap 'Borrow' or 'Get' on the detail screen.
        Confirm the button changes to 'Read'. Note the book title. Navigate
        back to the catalog.
      checkpoint: first_book_borrowed
      max_iterations: 20

    - id: borrow_second_book
      description: "Search for and borrow a second book"
      goal: >
        Search for a different book title. Tap on it, then tap 'Borrow' or
        'Get'. Confirm the button changes to 'Read'. Note this book's title
        too. Navigate back to the catalog.
      checkpoint: second_book_borrowed
      max_iterations: 20

    - id: verify_my_books_has_both
      description: "Check My Books shows both borrowed books"
      goal: >
        Tap the 'My Books' tab. Confirm that both borrowed books appear in
        the list — there should be at least 2 book entries visible with their
        titles or covers. The empty state message should NOT be shown.
      checkpoint: both_books_in_my_books
      max_iterations: 10

    - id: return_first_book
      description: "Return the first book from My Books"
      goal: >
        In My Books, tap on the first borrowed book to open its detail screen.
        Find the 'Delete' or 'Return' button and tap it. Confirm any dialog.
        Navigate back to My Books. Confirm only one book remains — the second
        book should still be listed.
      checkpoint: first_book_returned
      max_iterations: 15

    - id: return_second_book
      description: "Return the second book and verify empty state"
      goal: >
        In My Books, tap on the remaining book to open its detail screen.
        Find the 'Delete' or 'Return' button and tap it. Confirm any dialog.
        Navigate back to My Books. Confirm the empty state message reappears,
        indicating all books have been returned successfully.
      checkpoint: all_books_returned
      max_iterations: 15
