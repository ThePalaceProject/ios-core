scenario:
  id: bookmark-sync
  name: "Bookmark Management"
  description: "Verify bookmarks can be added, listed, navigated to, and deleted in the EPUB reader."
  tags: [tier2, ios, reader, BOOKMARK-001, BOOKMARK-002, BOOKMARK-003]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: open_book_in_reader
      description: "Borrow and open a book in the EPUB reader"
      goal: >
        On the Catalog screen (A1QA Test Library), find an ebook in the
        'Accessible EPUB Test' lane. Tap it, tap 'Borrow', wait for download,
        then tap 'Read'. Confirm the EPUB reader opens with book content visible.
      checkpoint: reader_opened
      max_iterations: 25

    - id: add_bookmarks
      description: "Add bookmarks on two different pages"
      goal: >
        In the EPUB reader, tap the center to reveal the toolbar. Find the
        bookmark icon (ribbon/flag) and tap it to bookmark the current page.
        Confirm the icon changes state (filled/highlighted). Navigate forward
        3-4 pages, then add another bookmark. You should now have 2 bookmarks.
      checkpoint: two_bookmarks_added
      max_iterations: 15

    - id: navigate_via_bookmark
      description: "Open bookmarks list and navigate to a bookmark"
      goal: >
        Open the Table of Contents / Bookmarks panel (TOC button in toolbar).
        Switch to the Bookmarks tab if there are separate tabs. Confirm at
        least 2 bookmarks are listed. Tap the first bookmark. Confirm the
        reader navigates to that bookmarked page.
      checkpoint: bookmark_navigation_works
      max_iterations: 15

    - id: delete_bookmark
      description: "Delete a bookmark and verify removal"
      goal: >
        On the bookmarked page, tap the bookmark icon to remove it (toggle off).
        Confirm the icon returns to its unbookmarked state. Open the bookmarks
        list again and confirm only 1 bookmark remains. Navigate back to close
        the reader.
      checkpoint: bookmark_deleted
      max_iterations: 15

    - id: cleanup
      description: "Return the book"
      goal: >
        From the book detail screen, tap 'Return' or 'Delete' to return the
        book. Verify it's removed from My Books.
      checkpoint: book_returned
      max_iterations: 15
