scenario:
  id: catalog-filter
  name: "Catalog Feed Filter UI"
  description: "Open a catalog feed detail, open the Filter sheet, verify all filter sections, and dismiss."
  tags: [catalog, ios, filtering]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the catalog"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select any listed library (e.g. "Palace Bookshelf" or
        "Allin Township Library"). Wait for the Catalog screen to appear
        with at least one lane of book covers before proceeding.
      checkpoint: app_ready
      max_iterations: 10

    - id: open_feed_detail
      description: "Tap More to open a catalog lane's full feed view"
      goal: >
        Tap "More books in..." on a catalog lane. Verify the feed detail screen loads
        with Search Catalog and Filter buttons.

    - id: open_filter_sheet
      description: "Tap Filter to open the filter options sheet"
      goal: >
        Tap Filter. Verify the Filters sheet appears with sections for Availability,
        Distributor, and Collection Name, plus CANCEL and APPLY FILTERS buttons.

    - id: dismiss_filter
      description: "Tap CANCEL to dismiss the filter sheet"
      goal: >
        Tap CANCEL. Verify the sheet is dismissed.
