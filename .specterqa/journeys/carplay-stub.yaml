#   2. Launch Palace and start an audiobook playing (use audiobook-playback.yaml
#      up through play_and_pause).
#   3. In the Simulator menu: I/O -> External Displays -> CarPlay.
#   4. In the CarPlay window, find Palace's CarPlay scene and verify Now Playing
#      shows the active audiobook with play/pause/skip controls.
#   5. Disconnect by closing the CarPlay external display window and verify
#      playback continues / transitions cleanly on the phone screen.
#   6. Record the flow once SpecterQA gains multi-window support, or capture
#      via screen recording + manual checklist for now.
#
# Once tooling supports it, this stub should be replaced with a real scenario
# block matching the format of audiobook-playback.yaml.
