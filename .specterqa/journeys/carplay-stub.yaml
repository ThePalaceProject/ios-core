# CarPlay stub — placeholder for CUJ-6. NOT runnable as-is.
#
# Why this is a stub:
#   * The CarPlay simulator window is launched separately from the iOS sim
#     (Xcode > Simulator menu > I/O > External Displays > CarPlay), and the
