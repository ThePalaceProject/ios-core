scenario:
  id: concurrent-downloads
  name: "Concurrent Downloads"
  description: "Verify multiple books can be borrowed and downloaded concurrently without blocking each other."
  tags: [tier2, ios, downloads, DL-004, DL-005]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: borrow_first_book
      description: "Borrow the first book"
      goal: >
        On the Catalog screen (A1QA Test Library), tap a book from the
        'Accessible EPUB Test' lane. Tap 'Borrow'. Note the book title.
        Do NOT wait for download to complete — immediately navigate back
        to the catalog.
      checkpoint: first_book_borrowing
      max_iterations: 15

    - id: borrow_second_book
      description: "Borrow a second book while first is downloading"
      goal: >
        On the Catalog screen, tap a DIFFERENT book from the same or another
        lane. Tap 'Borrow'. Note the book title. Navigate back to the catalog.
        Both books should now be downloading concurrently.
      checkpoint: second_book_borrowing
      max_iterations: 15

    - id: verify_both_in_my_books
      description: "Check both books appear in My Books"
      goal: >
        Navigate to My Books tab. Confirm both borrowed books appear in the
        list. They may show download progress indicators or 'Read' buttons
        (if already downloaded). Wait for both to finish downloading if
        needed. Both should reach a readable state without errors.
      checkpoint: both_books_available
      max_iterations: 25

    - id: cleanup
      description: "Return both books"
      goal: >
        In My Books, tap the first book and return it ('Return'/'Delete').
        Then tap the second book and return it. Confirm My Books returns
        to the empty state. No errors should occur during cleanup.
      checkpoint: both_returned
      max_iterations: 20
