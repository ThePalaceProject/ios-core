# Return a loan early. Covers C6.
scenario:
  id: return-loan
  name: "Return a Loan Early"
  description: "Verify a user can return a borrowed book before the loan expires."
  tags: [tier1, ios, critical_path, BOOK-005]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the Catalog on A1QA"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select "A1QA Test Library" (use the search field if it
        isn't visible in the initial list). Wait for the Catalog screen on
        A1QA to appear before proceeding.
      checkpoint: app_ready_on_a1qa
      max_iterations: 10

    - id: sign_in
      description: "Sign in to A1QA Test Library"
      goal: >
        Open Settings → Libraries → A1QA Test Library (or tap "Sign In" on a
        catalog row that requires auth). Enter barcode and PIN from
        ~/.specterqa/credentials/a1qa-test.env (A1QA_BARCODE, A1QA_PIN).
        Submit and wait for the authenticated state (signed-in indicator
        shown, My Books / Holds populate).
      checkpoint: user_authenticated
      max_iterations: 10

    - id: ensure_borrowed_book
      description: "Navigate to My Books and find a borrowed book"
      goal: >
        Launch the Palace app. Tap the "My Books" tab. If the list is empty,
        go to Catalog, borrow a book first, then return to My Books. Confirm
        at least one borrowed book is visible.
      checkpoint: borrowed_book_visible
      max_iterations: 20

    - id: open_book_detail
      description: "Open the borrowed book's detail"
      goal: >
        Tap on the borrowed book in My Books to open its detail screen.
        Confirm the detail screen shows the book title and a "Return" button
        or a menu that includes "Return".
      checkpoint: return_button_visible
      max_iterations: 10

    - id: return_book
      description: "Return the book"
      goal: >
        Tap the "Return" button. If a confirmation dialog appears ("Return Loan"
        or similar), confirm it. Wait for the action to complete. The book
        should be removed and the view should navigate back or show the book
        as returned. No error alerts should appear.
      checkpoint: book_returned
      max_iterations: 15

    - id: verify_removed
      description: "Verify the book is no longer in My Books"
      goal: >
        Navigate to My Books tab. Confirm the returned book is no longer in
        the list. If it was the only book, the empty state should appear.
      checkpoint: book_removed_from_my_books
      max_iterations: 10

    - id: teardown_sign_out
      description: "Sign out of A1QA to release the DRM device activation"
      goal: >
        After the journey body is complete, navigate Settings → Libraries →
        A1QA Test Library and tap "Sign Out". Confirm in any presented alert.
        Verify the user is no longer authenticated. This step is required at
        the end of every authenticated journey so the test account does not
        accumulate Adobe/ADEPT device activations (they are limited per user).
      checkpoint: signed_out
      max_iterations: 8
