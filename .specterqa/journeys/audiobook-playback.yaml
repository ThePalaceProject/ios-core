scenario:
  id: audiobook-playback
  name: "Audiobook Playback"
  description: "Verify audiobook player: borrow an audiobook, open player, play/pause, skip forward/behind, change playback speed, use sleep timer, navigate chapters via TOC."
  tags: [tier1, ios, audiobook, AUD-001, AUD-002, AUD-003, AUD-004, AUD-005]

  # NOTE: This journey requires a library with available audiobooks.
  # Palace Bookshelf may have limited audiobook content. If no audiobooks
  # are found, try switching to a library with audiobook content or
  # searching for a known audiobook title.

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: find_and_borrow_audiobook
      description: "Search for an audiobook, borrow it, and open the player"
      goal: >
        On the Catalog screen, look for an audiobook. If the catalog has tabs like
        'All', 'eBooks', 'Audiobooks', switch to the 'Audiobooks' tab. Otherwise,
        search for an audiobook title. Tap on an audiobook, then tap 'Borrow' or
        'Get' on its detail screen. Once borrowed, tap the 'Listen' button. Confirm
        the audio player screen opens showing the book title, a play button, chapter
        info, and a progress/timeline bar.
      checkpoint: audio_player_opened
      max_iterations: 25

    - id: play_and_pause
      description: "Tap Play, verify playback starts, then Pause"
      goal: >
        Tap the Play button on the audio player. Confirm the button changes to a
        Pause button and the time counter starts advancing (playback is active).
        Wait 3-5 seconds, then tap Pause. Confirm the button changes back to Play
        and the time counter stops. Playback should stop cleanly without errors.
      checkpoint: play_pause_works
      max_iterations: 10

    - id: skip_forward_and_behind
      description: "Use skip ahead and skip behind controls"
      goal: >
        Note the current playback time. Tap the skip-ahead button (usually +30s or
        a forward-skip icon). Confirm the playback time jumped forward by approximately
        30 seconds. Then tap the skip-behind button (usually -30s or a backward-skip
        icon). Confirm the playback time jumped backward by approximately 30 seconds.
      checkpoint: skip_controls_work
      max_iterations: 10

    - id: change_playback_speed
      description: "Change playback speed and verify it persists"
      goal: >
        Find the playback speed control (often labeled '1.0x' or a speed button).
        Tap it to open speed options. Select a different speed (e.g., 1.5x or 2.0x).
        Confirm the speed indicator updates to show the new speed. The audio should
        play at the new speed when resumed.
      checkpoint: speed_changed
      max_iterations: 15

    - id: sleep_timer
      description: "Set and verify the sleep timer"
      goal: >
        Find the sleep timer control (moon icon or 'Sleep timer' button). Tap it to
        open timer options. Select 'End of Chapter' or a time duration. Confirm the
        sleep timer indicator shows the timer is active. Then open the sleep timer
        again and close/cancel it to verify the UI works correctly.
      checkpoint: sleep_timer_set
      max_iterations: 15

    - id: navigate_chapters_via_toc
      description: "Open TOC and navigate to a different chapter"
      goal: >
        Find and tap the Table of Contents button (list icon or 'TOC'). Confirm a
        chapter list appears with chapter names. The TOC screen should have a 'Content'
        or 'Chapters' tab and a 'Bookmarks' tab. Tap on a chapter that is not the
        current one. Confirm the player returns and shows the new chapter name.
      checkpoint: toc_chapter_navigation_works
      max_iterations: 15

    - id: return_audiobook
      description: "Return to book detail and return the audiobook"
      goal: >
        Tap the back/close button to leave the audio player and return to the book
        detail screen. Look for a 'Return' or 'Delete' button and tap it. Confirm
        the book is returned. Navigate to My Books and verify the audiobook is no
        longer listed.
      checkpoint: audiobook_returned
      max_iterations: 15
