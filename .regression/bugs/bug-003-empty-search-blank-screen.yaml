id: bug-003-empty-search-blank-screen
severity: Low-Medium
title: "Search with no results renders completely blank screen — no empty-state, no message"
description: |
  Catalog search with no results (e.g. query "zzzzzzzzz") renders a
  completely blank screen — no empty-state view, no spinner, no "no results"
  message. Indistinguishable from a hung request from the user's perspective.

reproduction:
  preconditions:
    - "Any library catalog tab active"
    - "Tap the magnifying-glass search icon"
    - "Type a query that returns no results (e.g. 'zzzzzzzzz')"
    - "Submit"
  simdrive_recording: bug-search-no-empty-state

verification:
  ocr_must_contain:
    - "No results"
  structural_assertions:
    - kind: body_not_blank
      min_marks: 3

github:
  pr: 949
  branch: fix/empty-search-no-results-blank-screen

notes: |
  Root cause per Agent C (PR #949): CatalogSearchView.resultsContent
  rendered BookListView unconditionally with no empty-state branch.
  AccessibilityID.Search.noResultsView already existed in the codebase but
  was never used. Fix: added hasCompletedSearch lifecycle + derived
  shouldShowNoResultsState; new noResultsEmptyState SwiftUI view with
  magnifying-glass SF Symbol + headline/subhead.
