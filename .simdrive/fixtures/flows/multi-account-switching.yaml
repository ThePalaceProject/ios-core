name: multi-account-switching
description: |
  Add 3 libraries (Palace Bookshelf anonymous + A1QA basic + one more),
  switch between them rapidly, verify no credential bleed and no spurious
  sign-in modals. The defining test for A5 (multi-account switching) and
  A6 (credential isolation) — F-034 from PP-4020 was a 6-year-old TOCTOU
  race in this exact flow.

status: PENDING_CAPTURE
blocked_by: |
  Depends on basic-auth-borrow flow being capturable first (need at least
  one credentialed library added). Same simdrive type_text blocker applies.

steps:
  - id: 01-three-libraries-added
    setup: |
      Add Palace Bookshelf (anonymous), A1QA Test Library (basic), and one
      more library. Library list shows all 3.
    expects:
      title: "Libraries"
      contains_text: ["Palace Bookshelf", "A1QA Test Library"]

  - id: 02-rapid-switch-1
    action: "tap A1QA → wait → tap Palace Bookshelf → wait → tap A1QA"
    expects:
      title: "A1QA Test Library"
      no_text: ["Sign In", "Library Card", "PIN"]   # signed-in state preserved
      no_text: ["loading", "spinner"]
      no_text: ["401", "Unauthorized"]              # F-034 / SQ-007 guard

  - id: 03-after-rapid-switch
    expects:
      title: "A1QA Test Library"
      contains_text: ["My Books", "Holds"]
      no_text: ["Palace Bookshelf"]                 # current library is A1QA

  - id: 04-mybooks-isolation
    action: "tap My Books while on A1QA"
    expects:
      contains_text: ["A1QA Test Library"]
      no_text: ["Palace Bookshelf"]                 # books from other library MUST NOT appear

  - id: 05-switch-to-bookshelf
    action: "tap library switcher → Palace Bookshelf"
    expects:
      title: "Palace Bookshelf"
      no_text: ["A1QA Test Library", "Library Card"]   # no auth prompt, no other-library books

mutation_targets:
  - file: Palace/Accounts/Library/AccountsManager.swift
    rationale: |
      The Phase 6.5 singleton kill replaces shared mutable state with DI.
      Switching libraries must thread the current account through the right
      ViewModels. A mutated AccountsManager would either (a) not switch (My
      Books still shows old library's books) or (b) leak credentials.
  - file: Palace/Accounts/User/TPPUserAccount.swift
    rationale: |
      Per-library account state. F-034 lived here (was a TOCTOU race on
      keychain reads during library switch).
  - file: Palace/Accounts/User/TPPCredentials.swift
    rationale: |
      Each library's credentials are namespaced. A mutation that conflates
      namespaces would let A1QA's barcode appear when Palace Bookshelf is
      active (which would manifest as 'Library Card' text appearing on an
      anonymous library — explicitly asserted absent in step 05).
