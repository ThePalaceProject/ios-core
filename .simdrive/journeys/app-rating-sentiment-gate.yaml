scenario:
  id: app-rating-sentiment-gate
  name: "App-rating sentiment gate (Epic PP-4086)"
  description: >
    Drives the app-rating sentiment gate via the Developer Settings debug hooks
    and verifies both routing branches: positive → native App Store prompt
    (PP-4090), negative → feedback → support address, NEVER the App Store
    (PP-4091). Companion to the declarative fixture
    .simdrive/fixtures/flows/app-rating-sentiment-gate.yaml and the per-version
    visual baselines under .simdrive/fixtures/baselines/3.3.0/app-rating-sentiment-gate/.
  tags: [tier1, ios, app-rating, PP-4086, PP-4089, PP-4090, PP-4091, PP-4716]
  tier: stateful
  blocking: false   # the native StoreKit prompt is iOS-controlled; replay cares
                    # about the app's UI + routing up to requestReview, not the
                    # system prompt's rendering (which is unobservable off-sim).

  preconditions:
    - "showDeveloperSettings = true and RemoteFeatureFlags.appRatingForceEligibleOverride = true (set via `xcrun simctl spawn <udid> defaults write org.thepalaceproject.palace ...` BEFORE launch)"
    - "App on the Catalog tab (cold launch)"

  state_reset:
    - "Developer Settings → Testing → FEATURE FLAGS → 'Reset Rating State' before each run to clear engagement signals"
    - "Force-eligible override stays ON so the gate is reachable via 'Trigger Rating Prompt Now'"

  # MANDATORY visual check (PP-4716 wall-failure 2026-07-02-pr1168-darkmode-contrast):
  # OCR text presence is contrast-blind. Every gate step gets a vision review of
  # the rendered pixels, in BOTH light and dark appearance, against the baselines.
  visual_checks:
    - "The 'Yes, I love it!' primary button label is legible against its navy fill (NOT white-on-white)."
    - "All three buttons ('Yes, I love it!', 'Not really', 'Ask me later') have visible, readable labels."
    - "Verify in BOTH appearances (simctl ui <udid> appearance {light,dark})."

  steps:
    - "Settings tab → Testing row → FEATURE FLAGS → tap 'Trigger Rating Prompt Now'"
    - "Assert gate: 'Are you enjoying The Palace Project?' + Yes, I love it! / Not really / Ask me later"
    - "Negative branch: tap 'Not really' → assert 'We're sorry to hear that' + Share feedback / No thanks"
    - "tap 'Share feedback' → assert support@thepalaceproject.org (mail composer or canSendMail fallback); assert NO App Store / star UI"
    - "Positive branch: re-trigger → tap 'Yes, I love it!' → assert native StoreKit prompt ('Enjoying Palace?' + stars + Not Now) renders (sim/DEBUG only)"

  recording:
    path: "~/.simdrive/recordings/app-rating-sentiment-gate-positive/recording.yaml"

  notes:
    - "Chaos-QA sweep 2026-07-02: zero crashes across rapid-tap, trigger-spam, background/foreground, swipe-dismiss, reset-during-display, network-loss."
    - "Known low-sev: a rapid 3x tap during the dismiss can land a trailing tap on content behind the gate (tap-outside-dismiss + fast input); non-blocking."
