scenario:
  id: settings-tour-stateless
  name: "Settings — open, scroll, return to Catalog"
  description: >
    Tap Settings tab, scroll the Settings page, scroll back, return to Catalog.
    Verifies Settings list rendering and round-trip layout stability. No
    toggles or rows are tapped.
  tags: [tier0, ios, settings, navigation, layout-regression]
  tier: stateless
  blocking: true

  preconditions:
    - "Palace app launched, Catalog tab active"

  recording:
    path: "~/.simdrive/recordings/settings-tour-stateless/recording.yaml"
    steps: 4
    captured_with: "simdrive 0.2.0a1"
    captured_on: "2026-04-29"

  steps:
    - { id: tap_settings,  description: "Tap Settings tab",            tap_target: { stable_id: "7fbaa4deb053" } }
    - { id: scroll_down,   description: "Swipe up to scroll Settings", swipe: { x1: 600, y1: 2000, x2: 600, y2: 800, duration_ms: 400 } }
    - { id: scroll_up,     description: "Swipe down to scroll back",   swipe: { x1: 600, y1: 800, x2: 600, y2: 2000, duration_ms: 400 } }
    - { id: tap_catalog,   description: "Return to Catalog",           tap_target: { stable_id: "a229e82e3f00" } }

  expected_invariants:
    - "Settings root sections render at top: LIBRARIES, DOWNLOADS, SUPPORT, ABOUT AND LEGAL"
    - "No row toggle states change (Download Only on Wi-Fi, anything else)"
    - "Catalog tab restored on return"

  ssim_gating:
    threshold: 0.85
    on_drift: warn   # step 1's pre is OPDS catalog; steps 2-4 score 1.000 when run from Settings

  structural_checks:
    - after_step: 4   # back on Catalog after the round-trip
      required_text:   ["Catalog", "My Books", "Holds", "Settings"]
      required_chrome: ["a229e82e3f00", "3218623d0801", "0f06bf1e2d8b", "7fbaa4deb053"]
      min_marks: 25
      rationale: "Round-trip lands on Catalog; tab chrome must be intact."
    - after_step: 1   # right after tapping Settings (top of Settings, pre-scroll)
      # STABLE root-Settings chrome only. 'Palace version' is NOT on root Settings
      # (it lives under About App, a sub-screen we never open) and is below-fold
      # regardless; there is no 'TESTING' section at the top either — asserting
      # them halted the structural gate even though Settings rendered healthy
      # (confirmed from the recording's 001_post.png). The real always-present
      # top-of-Settings sections are LIBRARIES / DOWNLOADS / SUPPORT / ABOUT AND LEGAL.
      required_text:   ["Settings", "LIBRARIES", "DOWNLOADS", "SUPPORT", "ABOUT"]
      min_marks: 15
      rationale: "Settings root sections must render at the top of the page."

  rationale: |
    Settings itself is fully static (verified: SSIM=1.000 across 65-minute gap).
    But the first step's pre_screenshot is the OPDS-driven catalog, so SSIM
    gating breaks. Structural checks are the right gate for OPDS-rooted journeys.
