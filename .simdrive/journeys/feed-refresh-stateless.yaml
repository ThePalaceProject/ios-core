scenario:
  id: feed-refresh-stateless
  name: "Catalog — pull-to-refresh"
  description: >
    Pull down on the catalog to trigger an OPDS feed refresh. Verify the
    catalog re-renders with lanes intact. Stateless from the user's
    perspective (no app data mutated; OPDS may return different content).
  tags: [tier1, ios, catalog, opds, layout-regression]
  tier: stateless
  blocking: true

  preconditions:
    - "Palace app launched, Catalog tab active"
    - "Network connection available (OPDS feed reachable)"

  recording:
    path: "~/.simdrive/recordings/feed-refresh-stateless/recording.yaml"
    steps: 1
    captured_with: "simdrive 0.2.0a2"
    captured_on: "2026-04-30"

  steps:
    - id: pull_to_refresh
      description: "Pull down from top of catalog to trigger refresh"
      swipe: { x1: 600, y1: 500, x2: 600, y2: 1500, duration_ms: 500 }

  expected_invariants:
    - "After refresh, catalog still shows DPLA Publications lane (or whatever lanes existed pre-refresh)"
    - "Tab bar chrome stays pinned at the bottom"
    - "No error alerts, no spinner stuck on screen"

  ssim_gating:
    threshold: 0.80
    on_drift: warn   # OPDS may return shuffled covers post-refresh

  structural_checks:
    - after_step: 1
      required_text:   ["Palace Bookshelf", "DPLA Publications", "More..."]
      required_chrome: ["a229e82e3f00", "3218623d0801", "0f06bf1e2d8b", "7fbaa4deb053"]
      min_marks: 25
      rationale: |
        Post-refresh, lane titles must still render and tab chrome intact.
        The covers may differ from before — that's expected, not a regression.

  rationale: |
    Replaces SpecterQA's `feed-refresh.yaml`. SSIM gating is meaningless here
    because OPDS often returns shuffled cover lists post-refresh. Structural
    checks assert the layout integrity (lane titles + chrome).
