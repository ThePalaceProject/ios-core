scenario:
  id: catalog-browse-stateless
  name: "Catalog — vertical scroll + return to top"
  description: >
    Scroll down through Catalog lanes, then scroll back up. Pure read-only
    interaction. Verifies vertical scroll smoothness, lane rendering, and
    that scrolling back returns to the same first-screen layout.
  tags: [tier0, ios, catalog, scroll, layout-regression]
  tier: stateless
  blocking: true

  preconditions:
    - "Palace app launched, Catalog tab active"
    - "Palace Bookshelf library OPDS feed reachable (default test library)"

  recording:
    path: "~/.simdrive/recordings/catalog-browse-stateless/recording.yaml"
    steps: 4
    captured_with: "simdrive 0.2.0a1"
    captured_on: "2026-04-29"

  steps:
    - { id: scroll_down_1, description: "Swipe up to scroll catalog down (1)", swipe: { x1: 600, y1: 2000, x2: 600, y2: 800, duration_ms: 400 } }
    - { id: scroll_down_2, description: "Swipe up again (2)",                   swipe: { x1: 600, y1: 2000, x2: 600, y2: 800, duration_ms: 400 } }
    - { id: scroll_up_1,   description: "Swipe down to scroll catalog up (1)",  swipe: { x1: 600, y1: 800, x2: 600, y2: 2000, duration_ms: 400 } }
    - { id: scroll_up_2,   description: "Swipe down again (2)",                 swipe: { x1: 600, y1: 800, x2: 600, y2: 2000, duration_ms: 400 } }

  expected_invariants:
    - "Lane covers render without placeholder artifacts after the second scroll-down"
    - "Scrolling back lands on the first 'DPLA Publications' lane visible from the top"
    - "Tab bar stays pinned at the bottom throughout"

  ssim_gating:
    threshold: 0.80
    on_drift: warn   # OPDS-driven content; SSIM is informational, not gating
                     # Use structural_checks below for actual regression detection.

  rationale: |
    Reversible scrolling — start state == end state. **SSIM does not work as a
    gate on OPDS-driven screens** — different cover thumbnails on each replay
    drop scores into the 0.6 range even when nothing's wrong. Use the
    structural_checks below instead: they assert the lane chrome and the
    presence of a minimum number of OCR marks (proxy for "screen rendered"),
    which is robust to thumbnail churn.

  structural_checks:
    - after_step: 4  # after the round-trip scroll-up returns us to the top
      required_text:   ["DPLA Publications", "More..."]
      required_chrome: ["a229e82e3f00", "3218623d0801", "0f06bf1e2d8b", "7fbaa4deb053"]
      min_marks: 25
      rationale: |
        After the round-trip scroll, we should be back at the top of the
        catalog. Verify at least one lane title rendered ("DPLA Publications")
        and the "More..." chrome on the lane. All 4 tab-bar items must be
        visible. min_marks=25 catches gross under-render (a normal catalog
        screen has 50+ marks; a half-loaded screen has 5-10).
