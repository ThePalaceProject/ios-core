scenario:
  id: ws4-ipad-on-mac-exit-adobe-drm
  name: "WS-4 iPad-on-Mac Adobe-DRM exit (no recursive_mutex crash)"
  description: >
    Promotion-ceiling gate for the WS-4 _exit(0) static-destructor bypass
    (commit e85119b8a, changeset cs_b77ea7cc). Opens an Adobe-DRM book to
    construct the RMSDK statics, then quits via BOTH the normal (Cmd-Q ->
    applicationWillTerminate -> _exit(0)) and the forced/watchdog path (skips
    applicationWillTerminate -> atexit{_exit(0)} interceptor), asserting NO
    recursive_mutex / 9a91840677 crash on either. This is the end-to-end half
    of the gate; the static-init ordering half is CHECK 1 in
    docs/architecture/ws4-mac-validation-runbook.md.
  tags: [ws4, ios-on-mac, adobe-drm, termination, crash-regression, manual]
  tier: stateful
  blocking: true

  # ⚠️ HOST REQUIREMENT — NOT a simulator run.
  #   The crash only reproduces where ProcessInfo.processInfo.isiOSAppOnMac == true,
  #   i.e. the "Designed for iPad" build running on an Apple Silicon Mac host.
  #   On the simulator isiOSAppOnMac is false, so the guarded _exit(0) never
  #   fires and the crash cannot occur — a green sim run proves NOTHING here.
  #   Requires Chairman authorization + a Mac host with the DRM build installed.
  runtime:
    host: "apple-silicon-mac"
    binary: "designed-for-ipad (iOS arm64 .app, FEATURE_DRM_CONNECTOR)"
    isiOSAppOnMac_required: true

  preconditions:
    - "A library with Adobe-DRM (ACSM / Adobe-EPUB) content is added"
    - "Signed in to that library with valid Adobe activation credentials (licensor present)"
    - "An Adobe-DRM title is borrowable or already borrowed"
    - "Crashlytics reachable OR Console.app log capture available for the bundle id org.thepalaceproject.palace"

  steps:
    # --- Construct the RMSDK statics ---
    - id: 01-open-adobe-drm-book
      description: "Borrow (if needed) + open an Adobe-DRM book to exercise the full RMSDK path and construct its static state"
      action: "observe(annotate=true) -> tap the Adobe-DRM title -> tap Borrow if shown -> tap Read; confirm the reader renders a page"
      expects:
        contains_text_any: ["Read", "Reading", "Loading"]
      notes: "Even a cold launch constructs the load-time __mod_init_func global; opening a book is the strongest exercise of the path."

    # --- Path A: normal Cmd-Q (willTerminate -> _exit(0)) ---
    - id: 02-pathA-normal-quit
      description: "Normal quit: press Cmd-Q (routes through applicationWillTerminate -> _exit(0))"
      action: "press_key(cmd+q)  # macOS app quit"
      post_assert:
        crashes:
          absent_signatures: ["recursive_mutex", "9a91840677", "EXC_BAD_INSTRUCTION", "SIGABRT __cxa", "std::__1::recursive_mutex::~recursive_mutex"]
        logs:
          must_not_contain: ["recursive_mutex lock failed", "recursive_mutex", "libc++abi: terminating"]
      notes: "Path A is correct independent of atexit ordering — willTerminate never relies on the LIFO list."

    # --- Re-arm for Path B ---
    - id: 03-relaunch-reopen
      description: "Relaunch the app and reopen the Adobe-DRM book to reconstruct statics"
      action: "launch app -> repeat step 01"
      expects:
        contains_text_any: ["Read", "Reading", "Loading"]

    # --- Path B: forced/watchdog exit (skips willTerminate -> atexit interceptor) ---
    - id: 04-pathB-forced-exit
      description: >
        Forced/watchdog exit that SKIPS applicationWillTerminate, so termination
        falls through C library exit() and our atexit{_exit(0)} interceptor must
        fire LIFO-before Adobe's static recursive_mutex destructor.
      action: >
        Trigger the FinalTerminationWatchdog forced-exit path (e.g. the app's
        own watchdog timeout, or an external exit()-routing kill — NOT SIGKILL,
        which bypasses atexit entirely and would prove nothing). Confirm
        applicationWillTerminate did NOT run (no willTerminate log line).
      post_assert:
        crashes:
          absent_signatures: ["recursive_mutex", "9a91840677", "EXC_BAD_INSTRUCTION", "SIGABRT __cxa", "std::__1::recursive_mutex::~recursive_mutex"]
        logs:
          must_not_contain: ["recursive_mutex lock failed", "recursive_mutex", "libc++abi: terminating"]
      notes: >
        SIGKILL (kill -9) bypasses atexit and the C++ runtime entirely — it
        neither reproduces the crash nor exercises the fix. Use a path that
        routes through exit()/the watchdog so the atexit list actually runs.

  expected_invariants:
    - "Path A (Cmd-Q): process exits with no recursive_mutex crash; no new 9a91840677"
    - "Path B (forced/watchdog, willTerminate skipped): atexit interceptor fires; no recursive_mutex crash; no new 9a91840677"
    - "Adobe-DRM book opened successfully before each quit (statics were constructed)"

  device_regression:
    description: "Real iPhone/iPad (isiOSAppOnMac == false) — the _exit short-circuit must NOT engage."
    steps:
      - "Open + read an Adobe-DRM book; borrow and return it — all succeed"
      - "Quit normally; confirm applicationWillTerminate runs its full cleanup (no _exit short-circuit)"
      - "No behavior change vs pre-WS-4 build"

  rationale: |
    The two pure-helper unit tests + 100% diff-scoped mutation prove the GATING
    DECISION (skip on Mac, never on device) and idempotency. They cannot prove
    the crash-at-exit is actually avoided — that is Mac-only, fires inside
    exit()/atexit, and is not in-process observable. This journey + CHECK 1
    (binary static-init ordering) together are the verification gate. Until both
    pass, WS-4 is UNVERIFIED and cs_b77ea7cc does not promote past testing.
