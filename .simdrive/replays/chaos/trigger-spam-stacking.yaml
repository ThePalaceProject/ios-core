scenario:
  id: trigger-spam-stacking
  name: "Chaos: repeated 'Trigger Rating Prompt Now' must not stack rating dialogs"
  description: >
    Curated chaos replay seeded from the 2026-07-02 chaos-QA sweep of the
    app-rating sentiment gate (Epic PP-4086). Repeatedly fires the rating-gate
    trigger (Developer Settings → FEATURE FLAGS → 'Trigger Rating Prompt Now')
    five times in rapid succession, then interacts with the resulting gate,
    then re-fires.

    The adversarial intent: firing the same modal trigger N times must present
    AT MOST ONE gate — a second/third fire while a gate is already displayed
    must be a no-op (or coalesce), NEVER push a second gate on top of the
    first. Stacked modals are the failure mode: dismissing the top one reveals
    an identical gate underneath, trapping the patron in a dismiss loop.

    Sibling of rapid-tap-ask-me-later.yaml (same 2026-07-02 gate sweep,
    same Epic PP-4086 lineage). See CLAUDE.md "Local chaos pass for
    risk-bearing UI changes".

  tags: [chaos, chaos-trigger-spam, sentiment-gate, app-rating, PP-4086, modal-stacking]
  tier: stateful
  blocking: false   # advisory corpus; consumed by the dormant
                    # chaos-replay-on-pr.yml gate (needs a self-hosted
                    # [macos, palace-ios] runner + ENABLE_CHAOS_QA_RUNNER=true).

  preconditions:
    - "showDeveloperSettings = true (xcrun simctl spawn <udid> defaults write org.thepalaceproject.palace showDeveloperSettings -bool true)"
    - "App on the Settings tab, Testing → FEATURE FLAGS section visible, 'Trigger Rating Prompt Now' row at the recorded coordinate (x:365 y:2028 @ 1206x2622, iPhone 16 Pro)"
    - "App-rating force-eligible override ON so each fire is eligible to present the gate"

  # Resolved by directory NAME against SIMDRIVE_HOME/recordings
  # (recorder.replay: rec_dir = recordings_root() / name). Co-located
  # recording dir below is the replayable payload. See ./README.md.
  recording:
    path: ".simdrive/replays/chaos/trigger-spam-stacking/recording.yaml"
    steps: 7
    captured_with: "simdrive 1.0.0b12"
    captured_on: "2026-07-02"
    app_version: "484"

  steps:
    - id: fire_trigger_1
      description: "1st fire of 'Trigger Rating Prompt Now' — presents the rating gate"
      tap_target: { x: 365, y: 2028 }
    - id: fire_trigger_2
      description: "2nd rapid fire — gate already displayed; must NOT stack a 2nd gate"
      tap_target: { x: 365, y: 2028 }
    - id: fire_trigger_3
      description: "3rd rapid fire — still exactly one gate"
      tap_target: { x: 365, y: 2028 }
    - id: fire_trigger_4
      description: "4th rapid fire — still exactly one gate"
      tap_target: { x: 365, y: 2028 }
    - id: fire_trigger_5
      description: "5th rapid fire — still exactly one gate"
      tap_target: { x: 365, y: 2028 }
    - id: interact_with_gate
      description: "Interact with the (single) presented gate at x:602 y:1460 — dismiss/route it"
      tap_target: { x: 602, y: 1460 }
    - id: re_fire_after_dismiss
      description: "Re-fire the trigger after dismissal — a fresh single gate should present (no leftover stacked copy from the earlier spam)"
      tap_target: { x: 367, y: 2028 }

  expected_invariants:
    - "The five rapid fires present AT MOST ONE rating gate — no stacked / layered duplicate gates"
    - "Dismissing the single gate (step 6) returns to the Settings/FEATURE FLAGS screen, NOT to a second identical gate underneath"
    - "Re-firing after dismissal (step 7) presents a fresh single gate — proving the earlier spam left no queued/stacked gate behind"
    - "No crash across the 5 rapid fires + interaction + re-fire (chaos sweep 2026-07-02 recorded zero crashes)"

  structural_checks:
    # After the dismiss (step 6), exactly one dismissal should return to
    # FEATURE FLAGS — if a stacked gate existed, the rating prompt text would
    # STILL be present post-dismiss.
    text_subset_required_settings:
      - "TRIAGE"
      - "Anthropic API Key"

  ssim_gating:
    threshold: 0.85
    on_drift: halt   # single-gate presentation + clean dismiss is
                     # deterministic. If post-dismiss SSIM diverges (a second
                     # gate is visible where FEATURE FLAGS should be), the
                     # modal-stacking regression has reappeared.
    masks:
      - { x: 0, y: 0, w: 1206, h: 180, label: status_bar }

  rationale: |
    Kills the "same modal trigger fired N times stacks N modals" bug class on
    the app-rating gate. The dangerous variant traps the patron: they dismiss
    the visible gate, an identical one is revealed, they dismiss again, etc.
    Presentation-guard logic (present-once / coalesce-if-already-shown) is
    exactly the kind of state a unit test asserts on a flag but does not prove
    end-to-end; only driving the real trigger repeatedly against the live
    presenter exercises the guard. Companion to the rapid-tap dismiss replay:
    together they cover both "spam the trigger" and "spam the dismiss".

  known_issues:
    - "Replaying mutates rating-state engagement signals. Reset via Developer Settings → 'Reset Rating State' before re-running so each fire is eligible."
    - "The interact coordinate (602,1460) and the re-fire row (367,2028) assume the recorded FEATURE FLAGS layout; if the Developer Settings list order shifts, re-anchor against a fresh observe before trusting an SSIM halt."
