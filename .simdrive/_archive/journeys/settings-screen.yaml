scenario:
  id: settings-screen
  name: "Settings Screen"
  description: "Verify the Settings screen displays library section, app info links, and version information."
  tags: [tier1, ios, settings, SET-001, SET-002, SET-003]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the catalog"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select any listed library (e.g. "Palace Bookshelf" or
        "Allin Township Library"). Wait for the Catalog screen to appear
        with at least one lane of book covers before proceeding.
      checkpoint: app_ready
      max_iterations: 10

    - id: launch_and_navigate_to_settings
      description: "Launch app and navigate to the Settings tab"
      goal: >
        Launch the Palace app and wait for the Catalog to load. Tap the 'Settings'
        tab in the bottom tab bar. Confirm the Settings screen appears with a
        'Settings' navigation title.
      checkpoint: settings_screen_loaded
      max_iterations: 15

    - id: verify_library_section
      description: "Verify library section with library name"
      goal: >
        On the Settings screen, confirm: (1) a 'Libraries' button or section is
        visible, (2) the current library name is displayed somewhere on screen or
        accessible via the Libraries button. Note: not all libraries require sign-in,
        so a 'Sign In' button may or may not be present depending on the active library.
      checkpoint: library_section_visible
      max_iterations: 10

    - id: verify_app_info_links
      description: "Verify About, Privacy, Agreement, Licenses, and version"
      goal: >
        On the Settings screen, confirm the following links or buttons are visible:
        'About App' (or 'About Palace'), 'Privacy Policy', 'User Agreement', and
        'Software Licenses'. Also confirm a version string is displayed (e.g.,
        'Palace version X.Y.Z'). No error alerts should be present.
      checkpoint: app_info_links_visible
      max_iterations: 10
