scenario:
  id: concurrent-borrow
  name: "Concurrent Book Borrowing"
  description: "Borrow a book while another book is already in My Books, verify both appear, then return one."
  tags: [borrow, my_books, ios]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the Catalog on A1QA"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select "A1QA Test Library" (use the search field if it
        isn't visible in the initial list). Wait for the Catalog screen on
        A1QA to appear before proceeding.
      checkpoint: app_ready_on_a1qa
      max_iterations: 10

    - id: sign_in
      description: "Sign in to A1QA Test Library"
      goal: >
        Open Settings → Libraries → A1QA Test Library (or tap "Sign In" on a
        catalog row that requires auth). Enter barcode and PIN from
        ~/.specterqa/credentials/a1qa-test.env (A1QA_BARCODE, A1QA_PIN).
        Submit and wait for the authenticated state (signed-in indicator
        shown, My Books / Holds populate).
      checkpoint: user_authenticated
      max_iterations: 10

    - id: open_book_detail
      description: "Tap a book in the Accessible EPUB Test lane to view its detail"
      goal: >
        Tap a book in the Accessible EPUB Test lane. Verify the book detail screen
        loads with Borrow button and INFORMATION/FORMAT/PUBLISHER metadata.

    - id: borrow_book
      description: "Tap Borrow to add the book to My Books"
      goal: >
        Tap Borrow. Verify the borrow confirmation sheet appears with Cancel option.

    - id: dismiss_sheet
      description: "Dismiss the confirmation sheet"
      goal: >
        Tap the sheet grabber to dismiss. Verify we return to the book detail.

    - id: check_my_books
      description: "Navigate to My Books and verify the book appears alongside any
        existing borrowed books"
      goal: >
        Tap My Books. Verify the screen loads with Switch Library, Search Books,
        and Sort by Title controls.

    - id: return_book
      description: "Tap Return on the borrowed book"
      goal: >
        Tap Return. Verify the confirmation dialog appears.

    - id: confirm_return
      description: "Confirm the return"
      goal: >
        Tap Return in the confirmation dialog. Verify the book is removed from My Books.

    - id: teardown_sign_out
      description: "Sign out of A1QA to release the DRM device activation"
      goal: >
        After the journey body is complete, navigate Settings → Libraries →
        A1QA Test Library and tap "Sign Out". Confirm in any presented alert.
        Verify the user is no longer authenticated. This step is required at
        the end of every authenticated journey so the test account does not
        accumulate Adobe/ADEPT device activations (they are limited per user).
      checkpoint: signed_out
      max_iterations: 8
