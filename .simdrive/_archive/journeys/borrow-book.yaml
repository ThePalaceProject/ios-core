scenario:
  id: borrow-book
  name: "Borrow a Book"
  description: "Verify a user can borrow a book from the A1QA Test Library, see it appear in My Books, and return it."
  tags: [tier1, ios, critical_path, BOOK-003, BOOK-004, BOOK-005]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the Catalog on A1QA"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select "A1QA Test Library" (use the search field if it
        isn't visible in the initial list). Wait for the Catalog screen on
        A1QA to appear before proceeding.
      checkpoint: app_ready_on_a1qa
      max_iterations: 10

    - id: sign_in
      description: "Sign in to A1QA Test Library"
      goal: >
        Open Settings → Libraries → A1QA Test Library (or tap "Sign In" on a
        catalog row that requires auth). Enter barcode and PIN from
        ~/.specterqa/credentials/a1qa-test.env (A1QA_BARCODE, A1QA_PIN).
        Submit and wait for the authenticated state (signed-in indicator
        shown, My Books / Holds populate).
      checkpoint: user_authenticated
      max_iterations: 10

    - id: navigate_to_book_detail
      description: "Launch app and open a book's detail screen"
      goal: >
        Launch the Palace app on A1QA Test Library. Wait for the Catalog to load
        with book lanes (e.g., 'Accessible EPUB Test', 'Palace Bookshelf').
        Tap a book from the 'Accessible EPUB Test' or 'Palace Bookshelf' lane
        to open its detail screen. Confirm the detail shows a title and a 'Borrow' button.
      checkpoint: book_detail_with_borrow_button
      max_iterations: 15

    - id: borrow_book
      description: "Tap Borrow and confirm the book is borrowed"
      goal: >
        Tap the 'Borrow' button on the book detail screen. Wait for the button
        to change — it should become 'Read' or 'Download' or show a progress
        indicator. Confirm the borrow action completed without error alerts.
      checkpoint: book_borrowed
      max_iterations: 20

    - id: verify_in_my_books
      description: "Navigate to My Books and verify the borrowed book appears"
      goal: >
        Tap the 'My Books' tab in the bottom tab bar. Confirm the My Books screen
        now shows at least one book (the one just borrowed). The book's title or
        cover should be visible. The empty state message should no longer appear.
      checkpoint: book_in_my_books
      max_iterations: 15

    - id: return_book
      description: "Return the borrowed book"
      goal: >
        Tap on the borrowed book in My Books to open its detail screen. Look for
        a 'Return' or 'Delete' button. Tap it and confirm any confirmation dialog.
        Navigate back to My Books and verify the book is removed and the empty
        state returns.
      checkpoint: book_returned
      max_iterations: 20

    - id: teardown_sign_out
      description: "Sign out of A1QA to release the DRM device activation"
      goal: >
        After the journey body is complete, navigate Settings → Libraries →
        A1QA Test Library and tap "Sign Out". Confirm in any presented alert.
        Verify the user is no longer authenticated. This step is required at
        the end of every authenticated journey so the test account does not
        accumulate Adobe/ADEPT device activations (they are limited per user).
      checkpoint: signed_out
      max_iterations: 8
