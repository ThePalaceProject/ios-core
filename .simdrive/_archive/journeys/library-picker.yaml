scenario:
  id: library-picker
  name: "Library Picker Sheet"
  description: "Open the library switcher sheet and verify Add Library and Cancel options are present."
  tags: [navigation, ios, library_management]

  personas:
    - ref: ios_tester
      role: primary

  steps:
    - id: onboard_app
      description: "Dismiss first-launch alerts and open the catalog"
      goal: >
        If a SpringBoard "Would Like to Send You Notifications" alert is on
        screen, tap "Don't Allow" to dismiss it. If the Add Library picker
        appears, select any listed library (e.g. "Palace Bookshelf" or
        "Allin Township Library"). Wait for the Catalog screen to appear
        with at least one lane of book covers before proceeding.
      checkpoint: app_ready
      max_iterations: 10

    - id: open_library_picker
      description: "Tap the Switch Library button to open the picker sheet"
      goal: >
        Tap Switch Library. Verify the picker sheet appears with Add Library and
        Cancel buttons visible.

    - id: dismiss_picker
      description: "Tap Cancel to dismiss the picker"
      goal: >
        Tap Cancel. Verify the picker is dismissed and we return to the catalog.
