# The Xcode build and simulator the CI test lanes use, and the one local
# verification defaults to. scripts/reference_toolchain.py reads this file;
# every setup-xcode `xcode-version` in the workflows must equal `xcode_version`
# here, which scripts/tests/test_reference_toolchain.py checks.
#
# The test lanes use the same Xcode build and SDK as the release builds
# (upload.yml, upload-on-merge.yml, release-rc.yml, release-on-merge.yml), so
# the tested binary and the shipped one come from one compiler. The values were
# read from the 3.4.1 upload run (42086842274) and from the ThreadSanitizer
# lane's toolchain record on macos-26 (run 42698440164).
#
# The weekly toolchain-availability workflow checks that the runner image
# still provides all of these. To update the profile, see
# docs/Testing/reference-toolchain.md.

[reference]
runner_image = macos-26-arm64
xcode_version = 26.6
xcode_build = 17F113
sdk = iphonesimulator26.5
runtime = iOS 26.5
device = iPhone 17 Pro
arch = arm64
configuration = Debug
