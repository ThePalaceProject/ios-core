# The Xcode build and simulator each CI lane uses, and the one local
# verification defaults to. scripts/reference_toolchain.py reads this file;
# the workflows' setup-xcode `xcode-version` values must equal `xcode_version`
# here, which scripts/tests/test_reference_toolchain.py checks.
#
# Two profiles, because the lanes ran two toolchains when this was pinned:
#   reference - unit-test shards, UI journeys, toolkit tests, local verify-pr
#               and xcode-test-optimized. Measured on unit-testing run
#               42650450672 (macos-15-arm64).
#   release   - archive and upload lanes, the non-DRM build and ThreadSanitizer.
#               Measured on upload.yml run 42086842274 (the 3.4.1 build).
# Using one toolchain for both is an open decision. Moving the tests to the
# release toolchain needs macos-26 runners and a different simulator, because
# the macos-26 image has no iPhone 16 Pro or iOS 18.5.
#
# To update a profile, see docs/Testing/reference-toolchain.md.

[reference]
runner_image = macos-15-arm64
xcode_version = 26.3
xcode_build = 17C529
sdk = iphonesimulator26.2
runtime = iOS 18.5
device = iPhone 16 Pro
arch = arm64
configuration = Debug

[release]
runner_image = macos-26-arm64
xcode_version = 26.6
xcode_build = 17F113
sdk = iphonesimulator26.5
runtime = iOS 26.5
device = iPhone 17 Pro
arch = arm64
configuration = Debug
